// REPAIRS


const DEFAULT_REPAIR_TYPES=['Silnik','Hamulce','Zawieszenie','Elektryk','Klimatyzacja','Oleje/płyny','Opony','Karoseria','Inne'];
const DEFAULT_EQUIP=['Gaśnica','Kamizelka odblaskowa','Trójkąt ostrzegawczy','Apteczka','Liny/pasy','Kliny pod koła','Łańcuchy śniegowe','Tarcza tachografu','Karta kierowcy','Dowód rejestracyjny','OC','CMR'];
const DEFAULT_TECH_ITEMS=['Klocki hamulcowe','Opony (zużycie)','Olej silnikowy','Płyn chłodniczy','Płyn hamulcowy','Pasy/liny','Oświetlenie','Wycieraczki','Akumulator','Sprzęgło'];
const Repairs=({db,initialFilter,onFilterApplied})=>{
  const [repairs,setRepairs]=db.repairs;
  const [vehicles,setVehicles]=db.vehicles;
  const [modal,setModal]=useState(false);
  const [form,setForm]=useState({});
  const [fV,setFV]=useState('');const [fT,setFT]=useState('');const [fS,setFS]=useState('');const [fDF,setFDF]=useState('');const [fDT,setFDT]=useState('');
  useEffect(()=>{
    if(initialFilter?.vehicle){setFV(initialFilter.vehicle);onFilterApplied&&onFilterApplied();}
  },[initialFilter]);
  const [repairTypes,setRepairTypes]=useStore('tm_repair_types',DEFAULT_REPAIR_TYPES);
  const [newType,setNewType]=useState('');
  const [manualType,setManualType]=useState(false);
  const [invLoading,setInvLoading]=useState(false);
  const save=()=>{if(form.id)setRepairs(p=>p.map(x=>x.id===form.id?{...x,...form}:x));else setRepairs(p=>[...p,{...form,id:gid(),created_at:today()}]);setModal(false)};
  const hInv=async e=>{const file=e.target.files[0];if(!file)return;setInvLoading(true);
    try{
      let dataUrl,fileType;
      if(file.type==='application/pdf'||file.name.toLowerCase().endsWith('.pdf')){
        const buf=await file.arrayBuffer();if(!window.pdfjsLib){await new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js';s.onload=res;s.onerror=rej;document.head.appendChild(s);});window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';}
        const pdf=await window.pdfjsLib.getDocument({data:buf}).promise;const page=await pdf.getPage(1);const vp=page.getViewport({scale:0.8});const canvas=document.createElement('canvas');canvas.width=vp.width;canvas.height=vp.height;await page.render({canvasContext:canvas.getContext('2d'),viewport:vp}).promise;
        dataUrl=canvas.toDataURL('image/jpeg',0.85);fileType='pdf';
      }else{
        dataUrl=await new Promise(res=>{const rd=new FileReader();rd.onload=ev=>res(ev.target.result);rd.onerror=()=>res(null);rd.readAsDataURL(file);});
        fileType='image';
      }
      if(dataUrl){
        const url=await sbUploadBase64(dataUrl,file.name,'repairs');
        setForm(p=>({...p,invoice_img:url||dataUrl,invoice_name:file.name,invoice_file_type:fileType}));
        if(!url)alert('Nie udało się wysłać pliku do chmury. Zapisano tymczasowo lokalnie — spróbuj ponownie z internetem.');
      }
    }catch(err){alert('Błąd: '+err.message);}setInvLoading(false);e.target.value='';};
  const addRT=()=>{const t=newType.trim();if(!t||repairTypes.includes(t))return;setRepairTypes(p=>[...p,t]);setNewType('')};
  const remRT=t=>{setRepairTypes(p=>p.filter(x=>x!==t));if(form.repair_type===t)setForm(p=>({...p,repair_type:''}))};
  const F=(k,l,t='text',full=false)=>(<div style={full?{gridColumn:'span 2'}:{}}><label style={C.lbl}>{l}</label>{t==='textarea'?<textarea style={{...C.inp,height:60,resize:'vertical'}} value={form[k]||''} onChange={e=>setForm(p=>({...p,[k]:e.target.value}))}/>:<input style={C.inp} type={t} value={form[k]||''} onChange={e=>setForm(p=>({...p,[k]:e.target.value}))}/>}</div>);
  const anyF=fV||fT||fS||fDF||fDT;
  const filtered=repairs.filter(r=>{
    if(fV&&r.vehicle_reg!==fV)return false;if(fT&&r.repair_type!==fT)return false;
    if(fS&&(r.status||'nowa')!==fS)return false;if(fDF&&(r.date||'')<fDF)return false;if(fDT&&(r.date||'')>fDT)return false;return true;
  });
  const total=filtered.reduce((s,r)=>s+(parseFloat(r.cost)||0),0);
  const totalNet=filtered.reduce((s,r)=>s+(parseFloat(r.cost_net)||0),0);
  const sc=s=>s==='zakończona'?'green':s==='w toku'?'amber':s==='zaplanowana'?'blue':'gray';
  const usedV=[...new Set(repairs.map(r=>r.vehicle_reg).filter(Boolean))].sort();
  const usedT=[...new Set(repairs.map(r=>r.repair_type).filter(Boolean))].sort();
  return(<div>
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}}><h1 style={{fontSize:18,fontWeight:500,margin:0}}>Rejestr napraw</h1><button style={C.btnP} onClick={()=>{setForm({date:today(),status:'nowa'});setManualType(false);setModal(true)}}><i className="ti ti-plus"/> Dodaj</button></div>
    <div style={{...C.card,marginBottom:10,padding:'10px 14px'}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}><span style={{fontSize:10,fontWeight:500,color:'#888',textTransform:'uppercase',letterSpacing:'0.05em'}}><i className="ti ti-filter" style={{marginRight:4}}/>Filtry</span>{anyF&&<button style={{...C.btn,fontSize:10,padding:'1px 7px',color:'#A32D2D'}} onClick={()=>{setFV('');setFT('');setFS('');setFDF('');setFDT('')}}><i className="ti ti-x"/> Wyczyść</button>}</div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr 1fr 1fr',gap:7}}>
        <div><label style={C.lbl}>Pojazd</label><select style={C.inp} value={fV} onChange={e=>setFV(e.target.value)}><option value="">Wszystkie</option>{usedV.map(v=><option key={v}>{v}</option>)}</select></div>
        <div><label style={C.lbl}>Typ</label><select style={C.inp} value={fT} onChange={e=>setFT(e.target.value)}><option value="">Wszystkie</option>{usedT.map(t=><option key={t}>{t}</option>)}</select></div>
        <div><label style={C.lbl}>Status</label><select style={C.inp} value={fS} onChange={e=>setFS(e.target.value)}><option value="">Wszystkie</option><option value="zaplanowana">Zaplanowana</option><option value="nowa">Nowa</option><option value="w toku">W toku</option><option value="zakończona">Zakończona</option></select></div>
        <div><label style={C.lbl}>Data od</label><input style={C.inp} type="date" value={fDF} onChange={e=>setFDF(e.target.value)}/></div>
        <div><label style={C.lbl}>Data do</label><input style={C.inp} type="date" value={fDT} onChange={e=>setFDT(e.target.value)}/></div>
      </div>
      {anyF&&<div style={{marginTop:6,fontSize:10,color:'#888'}}>Wyniki: <strong style={{color:'#1a1a18'}}>{filtered.length}</strong> z {repairs.length}</div>}
    </div>
    <div style={{display:'flex',justifyContent:'flex-end',marginBottom:8,gap:8}}>
      <div style={{...C.stat,fontSize:12,whiteSpace:'nowrap'}}><span style={{color:'#888'}}>Suma netto: </span><strong>{totalNet.toFixed(2)} zł</strong></div>
      <div style={{...C.stat,fontSize:12,whiteSpace:'nowrap'}}><span style={{color:'#888'}}>Suma brutto: </span><strong>{total.toFixed(2)} zł</strong></div>
    </div>
    <div style={C.card}><table style={{width:'100%',borderCollapse:'collapse'}}>
      <thead><tr>{['Data','Pojazd','Opis','Typ','Warsztat','Przebieg','Netto','Brutto','Status','Faktura',''].map(h=><th key={h} style={C.th}>{h}</th>)}</tr></thead>
      <tbody>{filtered.sort((a,b)=>(a.date||'').localeCompare(b.date||'')).map(r=>(<tr key={r.id}>
        <td style={C.td}>{r.date}</td><td style={C.td}><strong style={{fontWeight:500}}>{r.vehicle_reg}</strong></td>
        <td style={{...C.td,maxWidth:120}}><div style={{overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{r.description}</div></td>
        <td style={C.td}>{r.repair_type}</td><td style={C.td}>{r.workshop}</td>
        <td style={{...C.td,whiteSpace:'nowrap'}}>{r.mileage?parseInt(r.mileage).toLocaleString()+' km':'–'}</td>
        <td style={C.td}>{r.cost_net?`${parseFloat(r.cost_net).toFixed(2)} zł`:'–'}</td>
        <td style={C.td}>{r.cost?`${parseFloat(r.cost).toFixed(2)} zł`:'–'}</td>
        <td style={C.td}><span style={bdg(sc(r.status))}>{r.status||'nowa'}</span></td>
        <td style={C.td}>{r.invoice_img?<span style={{...bdg('blue'),cursor:'pointer'}} onClick={()=>{setForm(r);setManualType(!repairTypes.includes(r.repair_type)&&!!r.repair_type);setModal(true)}}><i className="ti ti-receipt" style={{marginRight:2}}/>Faktura</span>:<span style={{color:'#aaa',fontSize:10}}>–</span>}</td>
        <td style={C.td}><button style={{...C.btn,padding:'2px 5px'}} onClick={()=>{setForm(r);setManualType(!repairTypes.includes(r.repair_type)&&!!r.repair_type);setModal(true)}}><i className="ti ti-edit"/></button><button style={{...C.btn,padding:'2px 5px',marginLeft:3}} onClick={()=>{
          if(r.service_col&&r.vehicle_reg){setVehicles(p=>p.map(v=>{if(v.registration!==r.vehicle_reg)return v;const sh={...v.service_history};delete sh[String(r.service_col)];return{...v,service_history:sh};}));}
          setRepairs(p=>p.filter(x=>x.id!==r.id));
        }}><i className="ti ti-trash"/></button></td>
      </tr>))}</tbody>
    </table>{filtered.length===0&&<div style={{textAlign:'center',padding:20,color:'#888',fontSize:11}}>Brak wyników</div>}</div>
    {modal&&<Modal title={form.id?'Edytuj naprawę':'Dodaj naprawę'} onClose={()=>setModal(false)} wide>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
        <div><label style={C.lbl}>Pojazd</label><select style={C.inp} value={form.vehicle_reg||''} onChange={e=>setForm(p=>({...p,vehicle_reg:e.target.value}))}><option value="">Wybierz...</option>{vehicles.map(v=><option key={v.id}>{v.registration}</option>)}</select></div>
        {F('date','Data','date')}
        <div><div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:2}}><label style={C.lbl}>Typ naprawy</label><button style={{...C.btn,padding:'1px 6px',fontSize:10}} onClick={()=>{setManualType(p=>!p);if(manualType)setForm(p=>({...p,repair_type:''}))}}>{manualType?'← Lista':'Wpisz ręcznie'}</button></div>
          {manualType?<input style={C.inp} value={form.repair_type||''} onChange={e=>setForm(p=>({...p,repair_type:e.target.value}))} placeholder="Wpisz typ..."/>:<select style={C.inp} value={form.repair_type||''} onChange={e=>setForm(p=>({...p,repair_type:e.target.value}))}><option value="">Wybierz...</option>{repairTypes.map(t=><option key={t}>{t}</option>)}</select>}
        </div>
        <div><label style={C.lbl}>Status</label><select style={C.inp} value={form.status||'nowa'} onChange={e=>setForm(p=>({...p,status:e.target.value}))}><option value="zaplanowana">Zaplanowana</option><option value="nowa">Nowa</option><option value="w toku">W toku</option><option value="zakończona">Zakończona</option></select></div>
        {F('workshop','Warsztat')}
        <div><label style={C.lbl}>Przebieg (km)</label><input style={C.inp} type="number" value={form.mileage||''} onChange={e=>setForm(p=>({...p,mileage:e.target.value.replace(/\s/g,'')}))}/></div>
        <div><label style={C.lbl}>Koszt netto (zł)</label><input style={C.inp} type="number" step="0.01" value={form.cost_net||''} onChange={e=>{
          const net=e.target.value;
          setForm(p=>{
            const vatRate=parseFloat(p.vat_rate);
            const gross=(net!==''&&!isNaN(vatRate))?(parseFloat(net)*(1+vatRate/100)).toFixed(2):p.cost;
            return {...p,cost_net:net,cost:gross};
          });
        }}/></div>
        <div><label style={C.lbl}>VAT %</label><select style={C.inp} value={form.vat_rate||''} onChange={e=>{
          const vatRate=e.target.value;
          setForm(p=>{
            const net=parseFloat(p.cost_net);
            const gross=(vatRate!==''&&!isNaN(net))?(net*(1+parseFloat(vatRate)/100)).toFixed(2):p.cost;
            return {...p,vat_rate:vatRate,cost:gross};
          });
        }}><option value="">—</option><option value="23">23%</option><option value="8">8%</option><option value="5">5%</option><option value="0">0%</option></select></div>
        <div><label style={C.lbl}>Koszt brutto (zł)</label><input style={C.inp} type="number" step="0.01" value={form.cost||''} onChange={e=>setForm(p=>({...p,cost:e.target.value}))}/></div>
        {F('description','Opis','textarea',true)}
      </div>

      {/* Oil service table */}
      {(form.repair_type||'').toLowerCase().includes('olej')&&(()=>{
        const OIL_ITEMS=['Olej','Filtr oleju','Filtr kabiny','Filtr powietrza','Spr. i usun. p. z okł. ham.','Wym. pas. akt. i rolki','Wym. płyn chłód.','Wym. płyn ham.'];
        const INTERVALS=Array.from({length:20},(_,i)=>(i+1)*40000);
        const mileage=parseInt(form.mileage)||0;
        const veh=vehicles.find(v=>v.registration===form.vehicle_reg);
        const st=veh?.service_history||{};
        const myKm=form.service_col||null;
        const otherRepairs=repairs.filter(r=>r.id!==form.id&&r.vehicle_reg===form.vehicle_reg&&r.service_col);
        const lockedByOther=new Set(otherRepairs.map(r=>r.service_col));
        const selectCol=km=>{
          if(lockedByOther.has(km)||( myKm&&myKm!==km))return;
          const key=String(km);
          const existingMileage=st[key]?.mileage;
          const newSt={...st,[key]:{...(st[key]||{}),mechanic:form.workshop||'',mileage:mileage||existingMileage||0}};
          setVehicles(p=>p.map(v=>v.registration===form.vehicle_reg?{...v,service_history:newSt}:v));
          // Automatycznie odczytaj przebieg z historii tej kolumny, jeśli pole jest jeszcze puste
          setForm(p=>({...p,service_col:km,mileage:(p.mileage&&parseInt(p.mileage)>0)?p.mileage:(existingMileage||p.mileage)}));
        };
        const toggleCell=(km,item)=>{
          if(km!==myKm||!form.vehicle_reg)return;
          const key=String(km);const cur=st[key]||{};
          const newSt={...st,[key]:{...cur,[item]:!cur[item]}};
          setVehicles(p=>p.map(v=>v.registration===form.vehicle_reg?{...v,service_history:newSt}:v));
        };
        return(<div style={{marginTop:12,borderTop:'0.5px solid rgba(0,0,0,0.08)',paddingTop:12}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>
            <div style={C.secT}>Historia serwisowa — {form.vehicle_reg||'wybierz pojazd'}</div>
            {myKm&&<span style={{fontSize:11,color:'#3B6D11',fontWeight:500}}>Kolumna: {myKm/1000}k km ★</span>}
            {!myKm&&<span style={{fontSize:10,color:'#888'}}>Kliknij kolumnę aby wybrać</span>}
          </div>
          {!form.vehicle_reg&&<div style={{fontSize:11,color:'#aaa'}}>Wybierz pojazd.</div>}
          {form.vehicle_reg&&<div style={{overflowX:'auto',fontSize:10}}>
            <table style={{borderCollapse:'collapse',minWidth:900}}>
              <thead><tr style={{background:'#1a1a18',color:'#fff'}}>
                <th style={{padding:'5px 8px',textAlign:'left',position:'sticky',left:0,background:'#1a1a18',minWidth:160}}>Czynność</th>
                {INTERVALS.map(km=>{
                  const isSel=myKm===km,isLocked=lockedByOther.has(km),isNear=mileage>0&&Math.abs(mileage-km)<5000&&!isLocked&&!myKm,hasData=OIL_ITEMS.some(item=>st[String(km)]?.[item]);
                  return<th key={km} onClick={()=>(!isLocked&&!myKm)&&selectCol(km)}
                    style={{padding:'5px 6px',textAlign:'center',whiteSpace:'nowrap',minWidth:52,cursor:(!isLocked&&!myKm)?'pointer':'default',
                      background:isSel?'#185FA5':isLocked?'#444':isNear?'#854F0B':hasData?'#2A4A2A':'#1a1a18',
                      borderBottom:isSel?'3px solid #64B5F6':'none',opacity:isLocked?0.5:1}}>
                    {km/1000}k{isSel&&<span style={{display:'block',fontSize:7}}>★</span>}{isLocked&&<span style={{display:'block',fontSize:7}}>🔒</span>}
                  </th>;
                })}
              </tr></thead>
              <tbody>
                {OIL_ITEMS.map((item,idx)=>{const bg=idx%2===0?'#fff':'#f5f4f0';return<tr key={item} style={{background:bg}}>
                  <td style={{padding:'5px 8px',fontWeight:500,position:'sticky',left:0,background:bg,borderRight:'1px solid #e0dfd8'}}>{item}</td>
                  {INTERVALS.map(km=>{const isSel=myKm===km,checked=!!(st[String(km)]?.[item]);return<td key={km} onClick={()=>toggleCell(km,item)}
                    style={{padding:'4px 6px',textAlign:'center',cursor:isSel?'pointer':'default',border:'0.5px solid #e0dfd8',background:isSel?(checked?'#EAF3DE':'#EEF5FF'):checked?'#f0fae8':bg}}>
                    {checked?<span style={{color:'#3B6D11',fontWeight:700}}>✓</span>:<span style={{color:isSel?'#aaa':'#ddd'}}>{isSel?'○':''}</span>}
                  </td>;})}
                </tr>;})}
                <tr style={{background:'#EAF3DE'}}>
                  <td style={{padding:'5px 8px',fontWeight:600,position:'sticky',left:0,background:'#EAF3DE',borderRight:'1px solid #e0dfd8',color:'#3B6D11'}}>Przebieg</td>
                  {INTERVALS.map(km=>{const isSel=myKm===km,saved=st[String(km)]?.mileage;return<td key={km} style={{padding:'4px 6px',textAlign:'center',border:'0.5px solid #e0dfd8',background:isSel?'#D4EDDA':'#EAF3DE',fontWeight:isSel?700:400,color:'#3B6D11',fontSize:10}}>{isSel&&mileage>0?mileage.toLocaleString():saved?saved.toLocaleString():km.toLocaleString()}</td>;})}
                </tr>
                <tr style={{background:'#E6F1FB'}}>
                  <td style={{padding:'5px 8px',fontWeight:600,position:'sticky',left:0,background:'#E6F1FB',borderRight:'1px solid #e0dfd8',color:'#185FA5'}}>Mechanik</td>
                  {INTERVALS.map(km=>{const isSel=myKm===km,saved=st[String(km)]?.mechanic||'';return<td key={km} style={{padding:'4px 6px',textAlign:'center',border:'0.5px solid #e0dfd8',background:isSel?'#D6E8FB':'#E6F1FB',fontWeight:isSel?700:400,color:'#185FA5',fontSize:10}}>{isSel?(form.workshop||saved||'–'):(saved||'–')}</td>;})}
                </tr>
              </tbody>
            </table>
          </div>}
        </div>);
      })()}
      <div style={{marginTop:12,borderTop:'0.5px solid rgba(0,0,0,0.08)',paddingTop:12}}>
        <div style={C.secT}>Faktura za naprawę</div>
        <div style={{display:'flex',gap:7,flexWrap:'wrap',alignItems:'center',marginBottom:8}}>
          <label style={{...C.btnP,cursor:'pointer',position:'relative',overflow:'hidden'}}>{invLoading?<><i className="ti ti-loader-2" style={{animation:'spin 1s linear infinite'}}/> Wczytywanie...</>:<><i className="ti ti-upload"/> Wgraj PDF/zdjęcie</>}<input type="file" accept=".pdf,application/pdf,image/*" onChange={hInv} style={{position:'absolute',inset:0,opacity:0,cursor:'pointer'}} disabled={invLoading}/></label>
          <label style={{...C.btn,cursor:'pointer',position:'relative',overflow:'hidden'}}><i className="ti ti-camera"/> Zdjęcie<input type="file" accept="image/*" capture="environment" onChange={hInv} style={{position:'absolute',inset:0,opacity:0,cursor:'pointer'}} disabled={invLoading}/></label>
          {form.invoice_img&&<span style={{fontSize:11,color:'#3B6D11',display:'flex',alignItems:'center',gap:4}}><i className="ti ti-circle-check"/>{form.invoice_name}<button style={{...C.btn,padding:'1px 4px',marginLeft:4}} onClick={()=>setForm(p=>({...p,invoice_img:null,invoice_name:null}))}><i className="ti ti-trash"/></button></span>}
        </div>
        {form.invoice_img&&<img src={form.invoice_img} style={{width:'100%',borderRadius:7,border:'0.5px solid rgba(0,0,0,0.1)'}}/>}
      </div>
      <div style={{marginTop:12,borderTop:'0.5px solid rgba(0,0,0,0.08)',paddingTop:12}}>
        <div style={C.secT}>Zarządzaj typami naprawy</div>
        <div style={{display:'flex',gap:6,marginBottom:8}}><input style={{...C.inp,flex:1}} placeholder="Nowy typ..." value={newType} onChange={e=>setNewType(e.target.value)} onKeyDown={e=>e.key==='Enter'&&addRT()}/><button style={C.btnP} onClick={addRT}><i className="ti ti-plus"/></button></div>
        <div style={{display:'flex',flexWrap:'wrap',gap:5}}>{repairTypes.map(t=><div key={t} style={{display:'flex',alignItems:'center',gap:3,background:'#f5f4f0',borderRadius:20,padding:'2px 10px 2px 11px',fontSize:11}}><span>{t}</span><button style={{background:'none',border:'none',cursor:'pointer',color:'#888',fontSize:13,lineHeight:1,padding:'0 1px'}} onClick={()=>remRT(t)}>×</button></div>)}</div>
      </div>
      <div style={{display:'flex',gap:6,justifyContent:'flex-end',marginTop:12,position:'sticky',bottom:0,background:'#fff',paddingTop:10,paddingBottom:6,borderTop:'0.5px solid rgba(0,0,0,0.08)'}}><button style={C.btn} onClick={()=>setModal(false)}>Anuluj</button><button style={C.btnP} onClick={save}>Zapisz</button></div>
    </Modal>}
  </div>);
};

// FUEL — imports fueling CSVs, auto-matches vehicle by registration number and
// trip by date range, lets you monitor/control driver fuel consumption company-wide.
// WERYFIKACJA TANKOWAŃ KIEROWCÓW — porównuje wpisy dodane przez kierowców (z portalu
// kierowcy) z rzeczywistymi transakcjami zaimportowanymi z CSV karty paliwowej.
// Dopasowuje po pojeździe + dacie (±3 dni) + najbliższej kwocie, i pokazuje różnice.
const FuelDriverReconciliation=({trips:tripsProp,setTrips,records:recordsProp,setRecords,scopeTripId,settings})=>{
  const eurRate=parseFloat(settings?.eur_rate)||0;
  const fmtCcy=(amount,currency)=>{
    const a=parseFloat(amount);
    if(isNaN(a))return'–';
    if(currency==='PLN'){
      const eur=eurRate>0?(a/eurRate).toFixed(2):null;
      if(eur===null)return<>{a.toFixed(2)} zł<span style={{color:'#A32D2D',fontSize:9}}> (brak kursu)</span></>;
      return<>{eur} €<span style={{color:'#888',fontSize:9}}> ({a.toFixed(2)} zł)</span></>;
    }
    return`${a.toFixed(2)} €`;
  };
  const [selDriver,setSelDriver]=useState(null); // {tripId, fuelId}
  const [selAuth,setSelAuth]=useState(null); // record id (Autoryzacje)
  const [selDkv,setSelDkv]=useState(null); // record id (Koszty całkowite DKV)
  const [filterVerified,setFilterVerified]=useState(''); // '' | 'sprawdzone' | 'niesprawdzone'
  const [freshData,setFreshData]=useState(null); // {trips, records} pobrane świeżo z chmury przy otwarciu
  const [refreshing,setRefreshing]=useState(true);

  // Zawsze pobierz najświeższe dane bezpośrednio z Supabase przy otwarciu tego widoku —
  // reszta aplikacji odświeża się tylko raz przy starcie, więc wpisy dodane przez
  // kierowcę (z osobnego, publicznego linku) mogły nie dotrzeć jeszcze do lokalnego stanu.
  const [fetchError,setFetchError]=useState('');
  const refreshFromCloud=async()=>{
    setRefreshing(true);setFetchError('');
    try{
      if(scopeTripId){
        // Pobierz TYLKO ten konkretny wyjazd bezpośrednim zapytaniem — omija to ryzyko,
        // że ogólne, stronicowane pobieranie wszystkich wyjazdów po cichu pominie duży
        // rekord przy błędzie (co mogło być przyczyną braku wpisu kierowcy na liście).
        const r=await fetch(`${SB_URL}/rest/v1/trips?data->>id=eq.${encodeURIComponent(scopeTripId)}&select=id,data`,{headers:SB_HEADERS,cache:'no-store'});
        if(!r.ok){const t=await r.text().catch(()=>'');throw new Error(`HTTP ${r.status}: ${t.slice(0,200)}`);}
        const rows=await r.json();
        const freshTrip=rows[0]?{...rows[0].data,_sbid:rows[0].id}:null;
        const freshRecords=await sbFetch('fuel_records');
        setFreshData({trips:freshTrip?[freshTrip]:[],records:freshRecords});
        if(!freshTrip)setFetchError('Nie znaleziono tego wyjazdu bezpośrednio w bazie — spróbuj zapisać wyjazd jeszcze raz i otwórz weryfikację ponownie.');
      }else{
        const [freshTrips,freshRecords]=await Promise.all([sbFetch('trips'),sbFetch('fuel_records')]);
        setFreshData({trips:freshTrips,records:freshRecords});
      }
    }catch(e){
      setFetchError('Błąd pobierania danych: '+e.message);
      setFreshData({trips:tripsProp,records:recordsProp}); // awaryjnie użyj tego co już mamy
    }
    setRefreshing(false);
  };
  useEffect(()=>{refreshFromCloud();},[]);

  const trips=freshData?.trips||tripsProp;
  const records=freshData?.records||recordsProp;

  // Wpisy ręczne kierowców — zebrane ze wszystkich wyjazdów (albo tylko jednego, jeśli scopeTripId podany)
  const scopedTrips=scopeTripId?trips.filter(t=>t.id===scopeTripId):[]; // bez scopeTripId (moduł Paliwo) — nie pokazuj wpisów ręcznych
  const scopedTrip=scopeTripId?trips.find(t=>t.id===scopeTripId):null;
  const scopedVehicleReg=scopedTrip?.vehicle_reg||null;
  const driverRows=[];
  scopedTrips.forEach(trip=>{
    (trip.fuels||[]).filter(f=>!f.deleted).forEach(f=>{
      driverRows.push({tripId:trip.id,driverName:trip.driver_name,vehicleReg:trip.vehicle_reg,fuel:f});
    });
  });
  driverRows.sort((a,b)=>(b.fuel.date||'').localeCompare(a.fuel.date||''));

  // Wpisy z CSV — jeśli mamy zakres do jednego wyjazdu, ogranicz do pojazdu TEGO wyjazdu
  // ORAZ do dat mieszczących się w zakresie tego konkretnego wyjazdu (start-koniec), żeby nie
  // pokazywać tankowań tym samym pojazdem z zupełnie innych, niepowiązanych wyjazdów.
  // Rozdzielone na dwa osobne źródła: Autoryzacje i Koszty całkowite DKV.
  const csvRowsBase=r=>{
    if(r.deleted)return false;
    if(scopedVehicleReg&&r.vehicle_reg!==scopedVehicleReg)return false;
    if(scopedTrip?.start_date&&r.date&&r.date<scopedTrip.start_date)return false;
    if(scopedTrip?.end_date&&r.date&&r.date>scopedTrip.end_date)return false;
    return true;
  };
  const authRows=[...records].filter(r=>csvRowsBase(r)&&(r.source_type||'koszty_dkv')==='autoryzacje').sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const dkvRows=[...records].filter(r=>csvRowsBase(r)&&(r.source_type||'koszty_dkv')==='koszty_dkv').sort((a,b)=>(b.date||'').localeCompare(a.date||''));

  const filteredDriverRows=filterVerified==='sprawdzone'?driverRows.filter(r=>r.fuel.verified):filterVerified==='niesprawdzone'?driverRows.filter(r=>!r.fuel.verified):driverRows;
  const filteredAuthRows=filterVerified==='sprawdzone'?authRows.filter(r=>r.verified):filterVerified==='niesprawdzone'?authRows.filter(r=>!r.verified):authRows;
  const filteredDkvRows=filterVerified==='sprawdzone'?dkvRows.filter(r=>r.verified):filterVerified==='niesprawdzone'?dkvRows.filter(r=>!r.verified):dkvRows;

  const countVerified=driverRows.filter(r=>r.fuel.verified).length;
  const countUnverified=driverRows.length-countVerified;

  // Skojarzenie kierowcy działa TYLKO z Autoryzacjami (nigdy bezpośrednio z Kosztami DKV).
  // Autoryzacje ↔ Koszty DKV to osobne, niezależne skojarzenie, które nie wpływa na to co
  // widzi kierowca. Dozwolone kombinacje: (kierowca+autoryzacje), (autoryzacje+DKV),
  // (kierowca+autoryzacje+DKV). Niedozwolone: (kierowca+DKV bez autoryzacji).
  const selCount=[selDriver,selAuth,selDkv].filter(Boolean).length;
  const invalidCombo=selDriver&&selDkv&&!selAuth;
  const canPair=selCount>=2&&!invalidCombo;

  const pair=()=>{
    if(!canPair)return;
    const authRec=selAuth?records.find(r=>r.id===selAuth):null;
    const dkvRec=selDkv?records.find(r=>r.id===selDkv):null;

    if(selDriver){
      // Wpis kierowcy zapisuje WYŁĄCZNIE skojarzenie z Autoryzacjami
      setTrips(p=>p.map(t=>t.id!==selDriver.tripId?t:{
        ...t,
        fuels:(t.fuels||[]).map(f=>f.id!==selDriver.fuelId?f:{...f,verified:true,verified_csv_id:authRec?.id||f.verified_csv_id||null})
      }));
    }
    if(authRec){
      setRecords(p=>p.map(r=>r.id!==authRec.id?r:{...r,verified:true,
        verified_driver_trip_id:selDriver?.tripId||r.verified_driver_trip_id||null,
        verified_driver_fuel_id:selDriver?.fuelId||r.verified_driver_fuel_id||null,
        verified_other_id:dkvRec?.id||r.verified_other_id||null}));
    }
    if(dkvRec){
      // Wpis Kosztów DKV NIGDY nie dostaje bezpośredniego odniesienia do kierowcy —
      // jego jedyne skojarzenie to Autoryzacje (osobna, niezależna sprawa księgowa).
      setRecords(p=>p.map(r=>r.id!==dkvRec.id?r:{...r,verified:true,
        verified_other_id:authRec?.id||r.verified_other_id||null}));
    }
    // Zaktualizuj też lokalny podgląd (świeże dane), żeby zmiana była widoczna od razu w tym oknie
    setFreshData(fd=>({
      trips:selDriver?fd.trips.map(t=>t.id!==selDriver.tripId?t:{...t,fuels:(t.fuels||[]).map(f=>f.id!==selDriver.fuelId?f:{...f,verified:true,verified_csv_id:authRec?.id||f.verified_csv_id||null})}):fd.trips,
      records:fd.records.map(r=>{
        if(authRec&&r.id===authRec.id)return{...r,verified:true,verified_driver_trip_id:selDriver?.tripId||r.verified_driver_trip_id||null,verified_driver_fuel_id:selDriver?.fuelId||r.verified_driver_fuel_id||null,verified_other_id:dkvRec?.id||r.verified_other_id||null};
        if(dkvRec&&r.id===dkvRec.id)return{...r,verified:true,verified_other_id:authRec?.id||r.verified_other_id||null};
        return r;
      }),
    }));
    setSelDriver(null);setSelAuth(null);setSelDkv(null);
  };

  const unpair=(tripId,fuelId,authId,dkvId)=>{
    if(tripId&&fuelId)setTrips(p=>p.map(t=>t.id!==tripId?t:{...t,fuels:(t.fuels||[]).map(f=>f.id!==fuelId?f:{...f,verified:false,verified_csv_id:null,verified_csv_id_dkv:null})}));
    [authId,dkvId].filter(Boolean).forEach(id=>{
      setRecords(p=>p.map(r=>r.id!==id?r:{...r,verified:false,verified_driver_trip_id:null,verified_driver_fuel_id:null,verified_other_id:null}));
    });
    setFreshData(fd=>({
      trips:(tripId&&fuelId)?fd.trips.map(t=>t.id!==tripId?t:{...t,fuels:(t.fuels||[]).map(f=>f.id!==fuelId?f:{...f,verified:false,verified_csv_id:null,verified_csv_id_dkv:null})}):fd.trips,
      records:fd.records.map(r=>[authId,dkvId].includes(r.id)?{...r,verified:false,verified_driver_trip_id:null,verified_driver_fuel_id:null,verified_other_id:null}:r),
    }));
  };

  const fuelTag=ft=><span style={{...bdg(classifyProduct(ft)==='paliwo'?'blue':'amber'),fontSize:8}}>{classifyProduct(ft)==='paliwo'?'ON':'AdBlue'}</span>;

  const Column=({title,rows,type})=>{
    const selId=type==='driver'?selDriver?.fuelId:type==='auth'?selAuth:selDkv;
    return<div>
      <div style={{fontSize:12,fontWeight:600,marginBottom:6}}>{title} ({rows.length})</div>
      <div style={C.card}><div style={{maxHeight:520,overflowY:'auto'}}>
        {rows.map(row=>{
          const isDriver=type==='driver';
          const f=isDriver?row.fuel:row;
          const isVerified=isDriver?f.verified:f.verified;
          const isSel=isDriver?selDriver?.fuelId===f.id:selId===f.id;
          const onClick=()=>{
            if(isVerified)return;
            if(isDriver)setSelDriver(isSel?null:{tripId:row.tripId,fuelId:f.id});
            else if(type==='auth')setSelAuth(isSel?null:f.id);
            else setSelDkv(isSel?null:f.id);
          };
          // Znajdź powiązane wpisy z pozostałych dwóch kolumn (dla wyświetlenia)
          let otherMatches=[];
          if(isDriver&&isVerified){
            if(f.verified_csv_id){const m=records.find(r=>r.id===f.verified_csv_id);if(m)otherMatches.push({label:'Autoryzacje',rec:m});}
          }else if(!isDriver&&isVerified){
            if(type==='auth'&&f.verified_driver_trip_id&&f.verified_driver_fuel_id){
              const t=trips.find(tt=>tt.id===f.verified_driver_trip_id);
              const drv=t?(t.fuels||[]).find(x=>x.id===f.verified_driver_fuel_id):null;
              if(drv)otherMatches.push({label:'Kierowca',rec:{...drv,driverName:t.driver_name,_isDriver:true}});
            }
            if(f.verified_other_id){const m=records.find(r=>r.id===f.verified_other_id);if(m)otherMatches.push({label:(m.source_type||'koszty_dkv')==='autoryzacje'?'Autoryzacje':'Koszty DKV',rec:m});}
          }
          return<div key={f.id} onClick={onClick}
            style={{padding:'8px 10px',borderBottom:'0.5px solid rgba(0,0,0,0.06)',cursor:isVerified?'default':'pointer',
              background:isVerified?'#EAF3DE':isSel?'#E6F1FB':'transparent'}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start'}}>
              <div>
                <div style={{fontSize:11,fontWeight:500,display:'flex',alignItems:'center',gap:5}}>{f.date} · {isDriver?row.vehicleReg:f.vehicle_reg} {fuelTag(f.fuel_type)}</div>
                <div style={{fontSize:10,color:'#888'}}>{isDriver?row.driverName:(f.station||f.fuel_type||'')} {isDriver&&(f.station||f.country)?`· ${f.station||f.country}`:''}</div>
                <div style={{fontSize:11,marginTop:2}}>{f.liters}L · <b>{fmtCcy(f.total_gross||f.total_cost,f.currency||'EUR')}</b></div>
              </div>
              {isVerified?
                <div style={{textAlign:'right'}}>
                  <span style={{...bdg('green'),fontSize:9}}><i className="ti ti-check" style={{fontSize:9}}/> Sprawdzono</span>
                  <button style={{...C.btn,padding:'1px 5px',fontSize:9,marginTop:3,display:'block'}} onClick={e=>{e.stopPropagation();
                    if(isDriver)unpair(row.tripId,f.id,f.verified_csv_id,f.verified_csv_id_dkv);
                    else unpair(f.verified_driver_trip_id,f.verified_driver_fuel_id,type==='auth'?f.id:f.verified_other_id,type==='dkv'?f.id:f.verified_other_id);
                  }}>Rozłącz</button>
                </div>
                :<div style={{textAlign:'right'}}>
                  {isSel&&<span style={{...bdg('blue'),fontSize:9,display:'block',marginBottom:4}}>Wybrano</span>}
                  {type==='auth'&&<button style={{...C.btn,padding:'1px 5px',fontSize:9,color:f.no_driver_entry?'#3B6D11':'#854F0B',borderColor:f.no_driver_entry?'#3B6D11':'#854F0B'}} title="Kierowca nie zalogował tego tankowania — kliknij żeby dodać ten wpis Autoryzacji do listy 'Wpisane od kierowcy' i liczyć go normalnie" onClick={e=>{e.stopPropagation();setRecords(p=>p.map(x=>x.id===f.id?{...x,no_driver_entry:!x.no_driver_entry}:x));}}>{f.no_driver_entry?<><i className="ti ti-check"/> Dodano</>:'Brak wpisu'}</button>}
                </div>}
            </div>
            {otherMatches.map((om,i)=><div key={i} style={{fontSize:9,color:'#3B6D11',marginTop:4,borderTop:i===0?'0.5px dashed #9FCB6A':undefined,paddingTop:i===0?4:0}}>↔ {om.label}: {om.rec.date} · {om.rec.liters}L · {fmtCcy(om.rec.total_gross||om.rec.total_cost,om.rec.currency||'EUR')} · {fuelTag(om.rec.fuel_type)}</div>)}
          </div>;
        })}
        {rows.length===0&&<div style={{textAlign:'center',padding:30,color:'#888',fontSize:11}}>{type==='driver'&&driverRows.length===0?(scopeTripId?'Brak ręcznych wpisów tankowań dla tego wyjazdu.':'Wpisy ręczne kierowców widoczne są tylko z poziomu konkretnego wyjazdu (Wyjazdy → zakładka Paliwo → Weryfikuj z CSV).'):'Brak wpisów w wybranym filtrze.'}</div>}
      </div></div>
    </div>;
  };

  return(<div>
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}}>
      <div style={{fontSize:10,color:'#888'}}>{refreshing?<span><i className="ti ti-loader-2" style={{animation:'spin 1s linear infinite',marginRight:4}}/>Pobieranie najświeższych danych z chmury...</span>:'Dane odświeżone z chmury przy otwarciu tego widoku.'}</div>
      <button style={{...C.btn,fontSize:10,padding:'3px 8px'}} onClick={refreshFromCloud} disabled={refreshing}><i className="ti ti-refresh"/> Odśwież teraz</button>
    </div>
    {fetchError&&<div style={{background:'#FCEBEB',color:'#A32D2D',padding:'8px 12px',borderRadius:8,marginBottom:12,fontSize:11}}><i className="ti ti-alert-triangle"/> {fetchError}</div>}
    <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(140px,1fr))',gap:10,marginBottom:14}}>
      <div style={{...C.stat,background:'#EAF3DE',cursor:'pointer'}} onClick={()=>setFilterVerified(filterVerified==='sprawdzone'?'':'sprawdzone')}><div style={{fontSize:10,color:'#3B6D11'}}>Sprawdzone</div><div style={{fontSize:18,fontWeight:600,color:'#3B6D11'}}>{countVerified}</div></div>
      <div style={{...C.stat,background:'#FAEEDA',cursor:'pointer'}} onClick={()=>setFilterVerified(filterVerified==='niesprawdzone'?'':'niesprawdzone')}><div style={{fontSize:10,color:'#854F0B'}}>Niesprawdzone</div><div style={{fontSize:18,fontWeight:600,color:'#854F0B'}}>{countUnverified}</div></div>
    </div>

    {/* Pasek akcji skojarzenia */}
    <div style={{position:'sticky',top:0,zIndex:10,background:invalidCombo?'#A32D2D':canPair?'#185FA5':'#f5f4f0',borderRadius:8,padding:'10px 14px',marginBottom:14,display:'flex',alignItems:'center',gap:12,flexWrap:'wrap',transition:'background 0.2s'}}>
      <span style={{fontSize:12,color:(invalidCombo||canPair)?'#fff':'#888'}}>
        {invalidCombo?<><i className="ti ti-alert-triangle"/> Kierowca łączy się tylko z Autoryzacjami — zaznacz też wpis z Autoryzacji, albo usuń zaznaczenie Kosztów DKV</>:
          <>{selDriver?'✓ Kierowca':'Kierowca —'} · {selAuth?'✓ Autoryzacje':'Autoryzacje —'} · {selDkv?'✓ Koszty DKV':'Koszty DKV —'} (zaznacz min. 2 z 3)</>}
      </span>
      <button style={{...C.btn,background:canPair?'#fff':'',opacity:canPair?1:0.5}} disabled={!canPair} onClick={pair}><i className="ti ti-link"/> Skojarz</button>
      {(selDriver||selAuth||selDkv)&&<button style={{...C.btn,color:(invalidCombo||canPair)?'#fff':'',border:(invalidCombo||canPair)?'1px solid #fff':undefined}} onClick={()=>{setSelDriver(null);setSelAuth(null);setSelDkv(null);}}>Anuluj wybór</button>}
    </div>
    <div style={{fontSize:9,color:'#888',marginBottom:10,marginTop:-6}}>Kierowca łączy się wyłącznie z Autoryzacjami. Autoryzacje ↔ Koszty całkowite DKV to osobne skojarzenie — nie wpływa na to co widzi kierowca w swoim linku.</div>

    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:14}}>
      <Column title="Wpisy ręczne kierowcy" rows={filteredDriverRows} type="driver"/>
      <Column title="Autoryzacje" rows={filteredAuthRows} type="auth"/>
      <Column title="Koszty całkowite DKV" rows={filteredDkvRows} type="dkv"/>
    </div>

    <div style={{fontSize:10,color:'#888',marginTop:10}}>
      Zaznacz co najmniej dwa wpisy (z dowolnych dwóch lub wszystkich trzech kolumn), potem kliknij "Skojarz" — oznaczą się na zielono jako "Sprawdzono". Kliknij "Rozłącz" żeby cofnąć skojarzenie.
    </div>
  </div>);
};

const Fuel=({db})=>{
  const [records,setRecords]=db.fuel_records;
  const [vehicles]=db.vehicles;const [trips,setTrips]=db.trips;const [settings]=db.settings;
  const [filterVeh,setFilterVeh]=useState('');
  const [filterMonth,setFilterMonth]=useState(today().slice(0,7));
  const [filterCat,setFilterCat]=useState('');
  const [filterDupOnly,setFilterDupOnly]=useState(false);
  const [modal,setModal]=useState(false);
  const [form,setForm]=useState({});
  const [importReport,setImportReport]=useState(null);
  const [importing,setImporting]=useState(false);
  const [mainTab,setMainTab]=useState('lista'); // 'lista' | 'weryfikacja'
  const [fixingCurrency,setFixingCurrency]=useState(false);

  // Narzędzie naprawcze: wpisy "Autoryzacje" z Polski, zaimportowane PRZED poprawką
  // rozpoznawania waluty, mają błędnie zapisane currency:'EUR' zamiast 'PLN' (kwota
  // autoryzacji dla Polski jest w złotówkach, nie euro). To przelicza je raz, ręcznie.
  const fixPolishCurrency=async()=>{
    const toFix=records.filter(r=>!r.deleted&&(r.source_type||'koszty_dkv')==='autoryzacje'&&/^PL$/i.test((r.country||'').trim())&&r.currency!=='PLN');
    if(toFix.length===0){alert('Nie znaleziono wpisów do naprawy — wszystkie autoryzacje z Polski mają już poprawną walutę (PLN).');return;}
    if(!window.confirm(`Znaleziono ${toFix.length} wpis(ów) "Autoryzacje" z Polski oznaczonych jako EUR. Zmienić ich walutę na PLN? Same kwoty (liczby) NIE zostaną zmienione — poprawi się tylko etykieta waluty, żeby dalsze przeliczenia były poprawne.`))return;
    setFixingCurrency(true);
    const ids=new Set(toFix.map(r=>r.id));
    setRecords(p=>p.map(r=>ids.has(r.id)?{...r,currency:'PLN'}:r));
    setFixingCurrency(false);
    alert(`Poprawiono walutę dla ${toFix.length} wpis(ów).`);
  };
  const [sourceTab,setSourceTab]=useState('autoryzacje'); // 'autoryzacje' | 'koszty_dkv'

  // Find vehicle by registration — tolerant of spaces/case differences common in CSV exports
  const normReg=s=>String(s||'').toUpperCase().replace(/\s/g,'');
  const matchVehicle=reg=>vehicles.find(v=>normReg(v.registration)===normReg(reg));

  // Find the trip covering this vehicle+date — used to auto-link a fuel record to
  // the correct wyjazd (and therefore the driver who was on it at the time)
  const matchTrip=(vehicleReg,date)=>{
    if(!vehicleReg||!date)return null;
    return trips.find(t=>t.vehicle_reg===vehicleReg&&t.start_date&&t.start_date<=date&&(!t.end_date||t.end_date>=date))||null;
  };

  const enrich=r=>{
    const trip=matchTrip(r.vehicle_reg,r.date);
    return{...r,trip_id:trip?trip.id:null,driver_name:trip?trip.driver_name:(r.driver_name||null),category:classifyProduct(r.fuel_type)};
  };

  const save=()=>{
    const item=enrich(form);
    if(form.id)setRecords(p=>p.map(x=>x.id===form.id?{...x,...item}:x));
    else setRecords(p=>[...p,{...item,id:gid(),created_at:today()}]);
    setModal(false);
  };

  // CSV import — mapuje dokładnie kolumny z eksportu karty paliwowej użytkownika,
  // z fallbackiem na kilka alternatywnych nazw na wypadek innego formatu pliku.
  // sourceType: 'autoryzacje' | 'koszty_dkv' — dwa osobne rodzaje eksportu DKV,
  // przechowywane i wyświetlane osobno, ale uwzględniane razem w skojarzeniach.
  const importCSV=(e,sourceType)=>{
    const file=e.target.files[0];if(!file)return;
    setImporting(true);
    const rd=new FileReader();
    rd.onload=async ev=>{
      const {records:rows}=parseCSV(ev.target.result);
      const REG_KEYS=['Nr rejestracyjny pojazdu','Nr rejestracyjny','Numer rejestracyjny','Rejestracja','vehicle_reg'];
      const DATE_KEYS=['Czas transakcji','Godzina autoryzacji','Data transakcji','Data','Date','date'];
      const COST_GROUP_KEYS=['Grupa kosztowa','cost_group'];
      const FUEL_TYPE_KEYS=['Rodzaj produktu','Rodzaj towaru','Rodzaj paliwa','fuel_type'];
      const LITERS_KEYS=['Sprzedaż','Sprzedaz','Ilość','Ilosc','liters'];
      const UNIT_KEYS=['Jednostka','unit'];
      const PRICE_KEYS=['Cena jednostkowa','Cena/l','price_per_liter'];
      const TOTAL_NET_KEYS=['Wartość całkowita netto','Wartosc calkowita netto','total_net'];
      const TOTAL_GROSS_KEYS=['Wartość całkowita brutto','Wartosc calkowita brutto','Kwota autoryzacji brutto','total_gross'];
      const TOTAL_INVOICE_CCY_KEYS=['Łączna wartość brutto (waluta faktury)','Laczna wartosc brutto (waluta faktury)','total_invoice_currency'];
      const VAT_KEYS=['Podatek VAT','VAT','vat'];
      const DISCOUNT_KEYS=['Rabat netto','discount_net'];
      const SERVICE_FEE_KEYS=['Opłata serwisowa netto','Oplata serwisowa netto','service_fee_net'];
      const COUNTRY_KEYS=['Kraj świadczenia usług','Kraj swiadczenia uslug','Kraj','country'];
      const POSTAL_KEYS=['Kod pocztowy','postal_code'];
      const CITY_KEYS=['Miejscowość','Miejscowosc','city'];
      const STATION_NO_KEYS=['Numer stacji','station_number'];
      const STATION_KEYS=['Nazwa stacji','Stacja','station'];
      const CARD_KEYS=['Nr karty','Karta','card_number'];
      const MILEAGE_KEYS=['Stan licznika','Przebieg','mileage'];
      const pick=(row,keys)=>{for(const k of keys)if(row[k]!==undefined&&row[k]!=='')return row[k];return '';};

      let matched=0,unmatchedVeh=0,unmatchedTrip=0;
      const imported=rows.map(row=>{
        const regRaw=pick(row,REG_KEYS);
        const veh=matchVehicle(regRaw);
        const date=normalizeDate((pick(row,DATE_KEYS)||'').split(' ')[0]); // strip time part if present
        const trip=veh?matchTrip(veh.registration,date):null;
        if(veh)matched++;else unmatchedVeh++;
        if(veh&&!trip)unmatchedTrip++;
        const totalGross=pick(row,TOTAL_GROSS_KEYS);
        const fuelType=pick(row,FUEL_TYPE_KEYS);
        return{
          id:gid(),
          vehicle_reg:veh?veh.registration:regRaw,
          vehicle_matched:!!veh,
          date,
          cost_group:pick(row,COST_GROUP_KEYS),
          fuel_type:fuelType,
          category:classifyProduct(fuelType),
          liters:pick(row,LITERS_KEYS),
          unit:pick(row,UNIT_KEYS)||'L',
          price_per_liter:(()=>{
            const raw=pick(row,PRICE_KEYS);
            if(raw!=='')return raw;
            // W eksporcie "Autoryzacje" pole "Cena jednostkowa" jest zwykle puste —
            // wylicz je z wartości brutto podzielonej przez ilość (Sprzedaż), dla każdego wiersza.
            const litersNum=parseFloat(pick(row,LITERS_KEYS));
            const grossNum=parseFloat(totalGross);
            if(litersNum>0&&grossNum>0)return (grossNum/litersNum).toFixed(3);
            return '';
          })(),
          total_net:pick(row,TOTAL_NET_KEYS),
          total_gross:totalGross,
          total_cost:totalGross, // primary cost figure used for sums/reporting
          total_invoice_currency:pick(row,TOTAL_INVOICE_CCY_KEYS),
          vat:pick(row,VAT_KEYS),
          discount_net:pick(row,DISCOUNT_KEYS),
          service_fee_net:pick(row,SERVICE_FEE_KEYS),
          country:pick(row,COUNTRY_KEYS),
          postal_code:pick(row,POSTAL_KEYS),
          city:pick(row,CITY_KEYS),
          station_number:pick(row,STATION_NO_KEYS),
          station:pick(row,STATION_KEYS),
          card_number:pick(row,CARD_KEYS),
          mileage:pick(row,MILEAGE_KEYS),
          // Format "Koszty całkowite DKV" ("Wartość całkowita brutto") jest już podawany w jednej,
          // ujednoliconej walucie rozliczeniowej (EUR). Format "Autoryzacje" ("Kwota autoryzacji
          // brutto") to jednak kwota z MOMENTU autoryzacji transakcji — w walucie LOKALNEJ kraju
          // tankowania, przed przewalutowaniem na fakturze — więc dla Polski jest w PLN, nie EUR.
          currency:sourceType==='autoryzacje'&&/^PL$/i.test((pick(row,COUNTRY_KEYS)||'').trim())?'PLN':'EUR',
          source_type:sourceType,
          trip_id:trip?trip.id:null,
          driver_name:trip?trip.driver_name:null,
          created_at:today(),
        };
      }).filter(r=>r.date||r.liters||r.vehicle_reg);

      // Duplicate detection: same date + vehicle + amount + liters as an existing
      // record (or another row within this same import) is flagged, not blocked —
      // the user decides on the table (yellow rows) whether to keep or delete them.
      const dupKey=r=>`${r.source_type||'koszty_dkv'}|${r.date}|${r.vehicle_reg}|${(parseFloat(r.total_gross||r.total_cost)||0).toFixed(2)}|${(parseFloat(r.liters)||0).toFixed(2)}`;
      const existingKeys=new Set(records.map(dupKey));
      const seenInBatch=new Set();
      let duplicates=0;
      imported.forEach(r=>{
        const k=dupKey(r);
        if(existingKeys.has(k)||seenInBatch.has(k)){r.is_duplicate=true;duplicates++;}
        seenInBatch.add(k);
      });

      setImportReport({total:imported.length,matched,unmatchedVeh,unmatchedTrip,duplicates,saving:true});
      const result=await setRecords(p=>[...p,...imported]);
      setImportReport({total:imported.length,matched,unmatchedVeh,unmatchedTrip,duplicates,saving:false,synced:result?.synced});
      if(result?.synced===false){
        alert('UWAGA: Część lub wszystkie zaimportowane wiersze NIE zapisały się w chmurze!\n\nBłąd: '+(result.error||'nieznany')+'\n\nNie odświeżaj jeszcze strony — spróbuj zaimportować plik ponownie, gdy będzie stabilne połączenie z internetem.');
      }
      setImporting(false);
    };
    rd.readAsText(file,'UTF-8');
    e.target.value='';
  };

  const months=[...new Set(records.map(r=>(r.date||'').slice(0,7)).filter(Boolean))].sort().reverse();
  const filtered=records.filter(r=>{
    if(r.deleted)return false;
    if((r.source_type||'koszty_dkv')!==sourceTab)return false;
    if(filterVeh&&r.vehicle_reg!==filterVeh)return false;
    if(filterMonth&&!(r.date||'').startsWith(filterMonth))return false;
    if(filterCat&&(r.category||classifyProduct(r.fuel_type))!==filterCat)return false;
    if(filterDupOnly&&!r.is_duplicate)return false;
    return true;
  }).sort((a,b)=>(b.date||'').localeCompare(a.date||''));

  const filteredFuel=filtered.filter(r=>(r.category||classifyProduct(r.fuel_type))==='paliwo');
  const filteredOther=filtered.filter(r=>(r.category||classifyProduct(r.fuel_type))!=='paliwo');

  // Sumy i średnia cena liczone WYŁĄCZNIE z kosztów paliwa (nie z AdBlue/Inne). Wpisy w PLN
  // (np. Autoryzacje z Polski) są najpierw przeliczane na EUR wg kursu z Panelu głównego —
  // dopiero potem sumowane razem z wpisami w EUR, żeby średnia cena nie była zawyżona.
  const eurRate=parseFloat(settings?.eur_rate)||0;
  // Wyświetlanie kwoty: główna, duża kwota to zawsze EUR (przeliczona jeśli wpis był w PLN,
  // wg kursu z Panelu głównego). Jeśli oryginał był w PLN, ta pierwotna kwota w złotówkach
  // pokazuje się dodatkowo jako mały dopisek w nawiasie obok.
  const fmtCcy=(amount,currency)=>{
    const a=parseFloat(amount);
    if(isNaN(a))return'–';
    if(currency==='PLN'){
      const eur=eurRate>0?(a/eurRate).toFixed(2):null;
      if(eur===null)return<>{a.toFixed(2)} zł<span style={{color:'#A32D2D',fontSize:9}}> (brak kursu)</span></>;
      return<>{eur} €<span style={{color:'#888',fontSize:9}}> ({a.toFixed(2)} zł)</span></>;
    }
    return`${a.toFixed(2)} €`;
  };
  const fmtCcyUnit=(amount,currency)=>{
    const a=parseFloat(amount);
    if(isNaN(a))return'–';
    if(currency==='PLN'){
      const eur=eurRate>0?(a/eurRate).toFixed(3):null;
      if(eur===null)return<>{a.toFixed(3)} zł</>;
      return<>{eur} €<span style={{color:'#888',fontSize:9}}> ({a.toFixed(3)} zł)</span></>;
    }
    return`${a.toFixed(3)} €`;
  };
  const toEUR=(amount,currency)=>{
    const a=parseFloat(amount)||0;
    if(!currency||currency==='EUR')return a;
    return eurRate>0?a/eurRate:0; // brak kursu → pomiń (0), żeby nie zawyżać sumy
  };
  const totalLiters=filteredFuel.reduce((s,r)=>s+(parseFloat(r.liters)||0),0);
  const totalCost=filteredFuel.reduce((s,r)=>s+toEUR(r.total_gross||r.total_cost,r.currency),0);
  const totalNet=filteredFuel.reduce((s,r)=>s+toEUR(r.total_net,r.currency),0);
  const totalVat=filteredFuel.reduce((s,r)=>s+toEUR(r.vat,r.currency),0);
  const missingRateCount=filteredFuel.filter(r=>r.currency&&r.currency!=='EUR'&&eurRate===0).length;
  const avgPrice=totalLiters>0?totalCost/totalLiters:0;
  const avgPriceNet=totalLiters>0?totalNet/totalLiters:0;
  const unmatchedCount=filtered.filter(r=>!r.vehicle_matched&&r.vehicle_reg).length;
  const noTripCount=filtered.filter(r=>r.vehicle_matched!==false&&!r.trip_id).length;

  const F=(k,l,t='text')=>(<div><label style={C.lbl}>{l}</label><input style={C.inp} type={t} step={t==='number'?'0.01':undefined} value={form[k]||''} onChange={e=>setForm(p=>({...p,[k]:e.target.value}))}/></div>);

  return(<div>
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14,flexWrap:'wrap',gap:8}}>
      <h1 style={{fontSize:18,fontWeight:500,margin:0}}>Paliwo</h1>
      <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>

          <label style={{...C.btn,cursor:'pointer',position:'relative',overflow:'hidden'}}><i className="ti ti-camera"/> Zrób zdjęcie CMR<input type="file" accept="image/*" capture="environment" onChange={async e=>{

      <div style={{display:'flex',gap:6,justifyContent:'flex-end',marginTop:12,position:'sticky',bottom:0,background:'#fff',paddingTop:10,paddingBottom:6,borderTop:'0.5px solid rgba(0,0,0,0.08)'}}><button style={C.btn} onClick={()=>setModal(false)}>Anuluj</button><button style={C.btnP} onClick={save}>Zapisz</button></div>

        <iframe src={cmrPreview.data} style={{width:'100%',height:'75vh',border:'0.5px solid rgba(0,0,0,0.1)',borderRadius:7}}/>

    {importModal&&<Modal title="Importuj zlecenia z CSV" onClose={()=>setImportModal(false)} wide>
      <div style={{fontSize:11,color:'#555',marginBottom:8}}>
        Nazwy kolumn w pierwszym wierszu CSV muszą odpowiadać polom formularza zlecenia (1:1). Wymagana kolumna: <strong>order_number</strong>. Zlecenia o numerach już istniejących w systemie zostaną pominięte (bez duplikatów).
        {' '}Jeśli wiersz nie zawiera kolumny <strong>client_name</strong>, automatycznie przypisany zostanie domyślny kontrahent (oznaczony ★ w Kontrahentach){contractors.find(c=>c.is_default)?<> — <strong>{contractors.find(c=>c.is_default).name}</strong></>:<span style={{color:'#A32D2D'}}> — nie masz jeszcze ustawionego domyślnego kontrahenta, ustaw go w zakładce Kontrahenci</span>}.
        {' '}Jeśli kolumna <strong>pdf_url</strong> zawiera link do pliku PDF zlecenia na Google Drive (udostępniony "dla każdego, kto ma link"), aplikacja przy imporcie spróbuje go automatycznie wczytać — tak jakby wgrać go ręcznie w formularzu. Może się nie udać z powodu zabezpieczeń CORS Google Drive — wtedy dokument trzeba dodać ręcznie w edycji zlecenia.
      </div>

          {ORDER_IMPORT_FIELDS.map(f=><span key={f.key} style={{...bdg(f.required?'amber':'gray'),fontFamily:'monospace'}} title={f.label}>{f.key}{f.required?' *':''}</span>)}

        <label style={{...C.btn,cursor:'pointer',position:'relative',overflow:'hidden'}}><i className="ti ti-upload"/> Wgraj plik CSV<input type="file" accept=".csv,text/csv" onChange={e=>{

        }} style={{position:'absolute',inset:0,opacity:0,cursor:'pointer'}}/></label>
        <span style={{fontSize:10,color:'#888'}}>lub wklej zawartość CSV poniżej</span>
      </div>
      <textarea style={{...C.inp,height:120,resize:'vertical',fontFamily:'monospace',fontSize:11}} placeholder="order_number,client_name,load_date,unload_date,load_address,unload_address,driver_name,vehicle_reg,kilometers,currency,rate,..." value={importText} onChange={e=>{setImportText(e.target.value);setImportPreview(null)}}/>
      <div style={{display:'flex',gap:6,marginTop:8}}>
        <button style={C.btn} onClick={()=>{
          const {headers,records}=parseCSV(importText);
          if(headers.length===0||records.length===0){setImportPreview({error:'Nie znaleziono danych w CSV.'});return;}
          if(!headers.includes('order_number')){setImportPreview({error:'Brak wymaganej kolumny "order_number".'});return;}
          const unknown=headers.filter(h=>!ORDER_IMPORT_FIELDS.some(f=>f.key===h));
          const existingNumbers=new Set(orders.map(o=>o.order_number).filter(Boolean));
          const seen=new Set();
          const toImport=[];const duplicates=[];const invalid=[];
          records.forEach(r=>{
            const num=(r.order_number||'').trim();
            if(!num){invalid.push(r);return;}
            if(existingNumbers.has(num)||seen.has(num)){duplicates.push(num);return;}
            seen.add(num);
            const item={};
            ORDER_IMPORT_FIELDS.forEach(f=>{if(r[f.key]!==undefined&&r[f.key]!=='')item[f.key]=r[f.key];});
            if(!item.currency)item.currency='EUR';
            if(!item.status)item.status='nowe';
            if(!item.number)item.number=item.order_number;
            if(item.load_date)item.load_date=normalizeDate(item.load_date);
            if(item.unload_date)item.unload_date=normalizeDate(item.unload_date);
            if(!item.client_name){
              const def=contractors.find(c=>c.is_default);
              if(def){item.client_name=def.name||'';item.client_nip=def.nip||'';}
            }
            // Match vehicle_reg / driver_name to existing records so they're pre-selected in dropdowns
            if(item.vehicle_reg){
              const norm=s=>(s||'').toUpperCase().replace(/\s+/g,'');
              const v=vehicles.find(v=>norm(v.registration)===norm(item.vehicle_reg));
              if(v)item.vehicle_reg=v.registration;
            }
            if(item.driver_name){
              const norm=s=>(s||'').toLowerCase().replace(/\s+/g,' ').trim();
              const d=drivers.find(d=>norm(`${d.first_name} ${d.last_name}`)===norm(item.driver_name));
              if(d)item.driver_name=`${d.first_name} ${d.last_name}`;
            }
            // If vehicle known but driver not given, infer driver from Wyjazdy (trip covering unload_date)
            if(item.vehicle_reg&&!item.driver_name){
              const ref=item.unload_date||item.load_date||today();
              const t=trips.find(t=>t.vehicle_reg===item.vehicle_reg&&t.start_date&&t.start_date<=ref&&(!t.end_date||t.end_date>=ref));
              if(t?.driver_name)item.driver_name=t.driver_name;
            }
            toImport.push(item);
          });
          setImportPreview({headers,unknown,toImport,duplicates,invalid,total:records.length});
        }}><i className="ti ti-list-check"/> Sprawdź dane</button>
        {importPreview&&!importPreview.error&&importPreview.toImport.length>0&&<button style={C.btnP} disabled={!!importing} onClick={async()=>{
          const items=importPreview.toImport;
          const withUrl=items.filter(it=>it.pdf_url);
          let pdfOk=0,pdfFail=0;
          for(let i=0;i<items.length;i++){
            const it=items[i];
            if(it.pdf_url){
              setImporting({done:pdfOk+pdfFail,total:withUrl.length});
              try{
                const res=await fetchPdfFirstPage(it.pdf_url);
                it.order_pdf_page1=res.order_pdf_page1;
                it.order_pdf_pages=res.order_pdf_pages;
                it.order_pdf_name=it.order_number?`Zlecenie_${it.order_number}.pdf`:'zlecenie.pdf';
                pdfOk++;
              }catch{pdfFail++;}
              delete it.pdf_url;
            }
          }
          setImporting(null);
          setOrders(p=>[...p,...items.map(item=>({...item,id:gid(),created_at:today()}))]);
          if(withUrl.length>0){
            alert(`Zaimportowano ${items.length} zleceń.\nPDF wczytane automatycznie: ${pdfOk}/${withUrl.length}${pdfFail>0?`\nNieudane (np. z powodu ograniczeń CORS Google Drive) — dodaj te dokumenty ręcznie w edycji zlecenia: ${pdfFail}`:''}`);
          }
          setImportModal(false);
        }}>{importing?<><i className="ti ti-loader-2" style={{animation:'spin 1s linear infinite'}}/> Wczytywanie PDF {importing.done}/{importing.total}...</>:<><i className="ti ti-check"/> Importuj {importPreview.toImport.length} zleceń</>}</button>}
      </div>
      {importPreview&&(
        importPreview.error
          ?<div style={{marginTop:10,fontSize:11,color:'#A32D2D'}}>{importPreview.error}</div>
          :<div style={{marginTop:10,fontSize:11}}>
            <div style={{display:'flex',gap:10,flexWrap:'wrap',marginBottom:8}}>
              <span style={bdg('green')}>Do importu: {importPreview.toImport.length}</span>
              {importPreview.duplicates.length>0&&<span style={bdg('amber')}>Pominięte duplikaty: {importPreview.duplicates.length}</span>}
              {importPreview.invalid.length>0&&<span style={bdg('red')}>Bez nr zlecenia: {importPreview.invalid.length}</span>}
              {importPreview.unknown.length>0&&<span style={bdg('gray')}>Nierozpoznane kolumny: {importPreview.unknown.join(', ')}</span>}
            </div>
            {importPreview.toImport.length>0&&<div style={{overflowX:'auto'}}>
              <table style={{width:'100%',borderCollapse:'collapse',fontSize:10}}>
                <thead><tr>{['Nr zlecenia','Klient','Załadunek','Rozładunek','Kierowca','Pojazd','Stawka'].map(h=><th key={h} style={C.th}>{h}</th>)}</tr></thead>
                <tbody>{importPreview.toImport.slice(0,10).map((it,i)=>(
                  <tr key={i}>
                    <td style={{...C.td,fontFamily:'monospace'}}>{it.order_number}</td>
                    <td style={C.td}>{it.client_name||'–'}</td>
                    <td style={C.td}>{it.load_date||'–'}</td>
                    <td style={C.td}>{it.unload_date||'–'}</td>
                    <td style={C.td}>{it.driver_name||'–'}</td>
                    <td style={C.td}>{it.vehicle_reg||'–'}</td>
                    <td style={C.td}>{it.rate?`${it.rate} ${it.currency==='EUR'?'€':'zł'}`:'–'}</td>
                  </tr>
                ))}</tbody>
              </table>
              {importPreview.toImport.length>10&&<div style={{color:'#888',marginTop:4}}>...i {importPreview.toImport.length-10} więcej</div>}
            </div>}
          </div>
      )}
    </Modal>}
  </div>);
};

// ─── KSEF HELPERS ─────────────────────────────────────────────────────────────
const KSEF_URLS={prod:'https://api.ksef.mf.gov.pl',test:'https://api-test.ksef.mf.gov.pl',demo:'https://api-demo.ksef.mf.gov.pl'};
const KSEF_PROXY=`${SB_URL}/functions/v1/ksef-proxy`;
const ksefCall=async(path,body,token,env,method='POST')=>{
  const r=await fetch(KSEF_PROXY,{
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':`Bearer ${SB_KEY}`,'apikey':SB_KEY},
    body:JSON.stringify({env:env||'prod',path,method,body:body||{},token}),
  });
  if(!r.ok){const t=await r.text();throw new Error(`Proxy ${r.status}: ${t.slice(0,300)}`);}
  const res=await r.json();
  if(!res.ok)throw new Error(`KSeF ${res.status}: ${JSON.stringify(res.data).slice(0,400)}`);
  return res.data;
};


const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
// Detect whether a preview target is a PDF, whether it's an old embedded base64
// blob OR a modern Supabase Storage URL (which doesn't have a data: prefix) —
// checking file name/extension too, so Storage-hosted PDFs render in an iframe
// instead of incorrectly falling through to an <img> tag (which showed as broken).
const isPdfFile=(data,name)=>{
  if(!data)return false;
  if(data.startsWith('data:application/pdf'))return true;
  if(/\.pdf($|\?)/i.test(data))return true;
  if(name&&/\.pdf$/i.test(name))return true;
  return false;
};

const generateKSeFXML=(inv,company)=>{
  const ts=new Date().toISOString().replace(/\.\d{3}Z$/,'Z');
  const issueDate=inv.issue_date||today();
  const saleDate=inv.sale_date||issueDate;
  const currency=inv.currency||'EUR';
  const isEUR=currency==='EUR';
  const rate=parseFloat(inv.eur_rate)||0;
  const items=inv.items||[];
  const docType=inv.doc_type||'faktura';
  // Dla korekt: wysyłamy RÓŻNICĘ (nowa wartość minus stara), zgodnie z życzeniem —
  // nie stan bezwzględny po korekcie. Żeby zachować spójność matematyczną wymaganą
  // przez schemat (ilość × cena = wartość), różnicę zapisujemy jako ilość=1,
  // cena=różnica — więc iloczyn zawsze się zgadza z deklarowaną wartością wiersza.
  const beforeItems=docType==='korekta'&&inv.before_items&&inv.before_items.length>0?inv.before_items:null;
  const netOf=it=>{
    const q=it&&(it.qty===''||it.qty==null)?1:(parseFloat(it?.qty)||0);
    const p=parseFloat(it?.price)||0;
    return Math.round(q*p*100)/100;
  };

  // Build invoice lines
  const lines=items.map((it,i)=>{
    let qty=it.qty===''||it.qty==null?1:(parseFloat(it.qty)||0);
    let price=parseFloat(it.price)||0;
    let net=Math.round(qty*price*100)/100;
    if(beforeItems){
      const netNew=net;
      const netOld=netOf(beforeItems[i]);
      net=Math.round((netNew-netOld)*100)/100;
      qty=1;price=net; // reprezentacja różnicy jako pojedynczy wiersz — ilość×cena=różnica
    }
    const vatPct=parseFloat(it.vat)||0;
    const vat=Math.round(net*vatPct)/100;
    const vatCode=vatPct===23?'23':vatPct===8?'8':vatPct===5?'5':vatPct===0?'0':'zw';
    return `
    <FaWiersz>
      <NrWierszaFa>${i+1}</NrWierszaFa>
      <P_7>${esc(it.description)}</P_7>
      <P_8A>szt.</P_8A>
      <P_8B>${qty.toFixed(4)}</P_8B>
      <P_9A>${price.toFixed(2)}</P_9A>
      <P_11>${net.toFixed(2)}</P_11>
      <P_12>${vatCode}</P_12>
    </FaWiersz>`;
  }).join('');

  // VAT breakdown by rate — computed directly from lines, so totals are always
  // mathematically consistent with the line items (a common cause of semantic rejection)
  const vatGroups={};
  items.forEach((it,i)=>{
    const vatPct=parseFloat(it.vat)||0;
    let net=netOf(it);
    if(beforeItems){
      const netOld=netOf(beforeItems[i]);
      net=Math.round((net-netOld)*100)/100;
    }
    const vat=Math.round(net*vatPct)/100;
    const key=String(vatPct);
    if(!vatGroups[key])vatGroups[key]={net:0,vat:0,rate:vatPct};
    vatGroups[key].net+=net;vatGroups[key].vat+=vat;
  });
  Object.values(vatGroups).forEach(g=>{g.net=Math.round(g.net*100)/100;g.vat=Math.round(g.vat*100)/100;});
  const sumNet=Object.values(vatGroups).reduce((s,g)=>s+g.net,0);
  const sumVat=Object.values(vatGroups).reduce((s,g)=>s+g.vat,0);
  const tNet=Math.round(sumNet*100)/100;
  const tVat=Math.round(sumVat*100)/100;
  const tGross=Math.round((tNet+tVat)*100)/100;

  // Map VAT groups to the P_13_x / P_14_x field pairs required by FA(3) (one pair per rate bracket)
  // For foreign-currency invoices (EUR), also include the PLN-converted tax amount (P_14_xW),
  // as required to show "Kwota podatku PLN" in the tax summary.
  const rateFieldMap={23:'1',8:'2',5:'3',0:'4'};
  const vatFieldsXml=Object.values(vatGroups).map(g=>{
    const idx=rateFieldMap[g.rate]||'1';
    const vatPLN=isEUR&&rate>0?`\n    <P_14_${idx}W>${Math.round(g.vat*rate*100)/100}</P_14_${idx}W>`:'';
    return `
    <P_13_${idx}>${g.net.toFixed(2)}</P_13_${idx}>
    <P_14_${idx}>${g.vat.toFixed(2)}</P_14_${idx}>${vatPLN}`;
  }).join('');

  const eurRow=isEUR&&rate>0?`
      <KursWalutyZ>${rate.toFixed(4)}</KursWalutyZ>`:'';

  // Extra description entries — NBP rate table reference (matches how accountants expect to see it)
  const eurRateDescRow=isEUR&&rate>0?`
    <DodatkowyOpis>
      <NrWiersza>1</NrWiersza>
      <Klucz>KursWalutyData</Klucz>
      <Wartosc>Kurs EUR z dnia ${inv.eur_rate_date||saleDate}: 1 EUR = ${rate.toFixed(4)} PLN</Wartosc>
    </DodatkowyOpis>`:'';

  // Seller bank accounts — both PLN and EUR if available, each clearly labelled
  const bankAccountsXml=[
    inv.seller_bank_pln?`
    <RachunekBankowy>
      <NrRB>${esc((inv.seller_bank_pln||'').replace(/\s/g,''))}</NrRB>
      ${inv.seller_swift?`<SWIFT>${esc(inv.seller_swift)}</SWIFT>`:''}
      <OpisRachunku>Rachunek w walucie: PLN</OpisRachunku>
    </RachunekBankowy>`:'',
    inv.seller_bank_eur?`
    <RachunekBankowy>
      <NrRB>${esc((inv.seller_bank_eur||'').replace(/\s/g,''))}</NrRB>
      ${inv.seller_swift?`<SWIFT>${esc(inv.seller_swift)}</SWIFT>`:''}
      <OpisRachunku>Rachunek w walucie: EUR</OpisRachunku>
    </RachunekBankowy>`:'',
  ].join('');
  const platnoscXml=bankAccountsXml?`
    <Platnosc>${bankAccountsXml}
    </Platnosc>`:'';

  const corrRow=docType==='korekta'&&inv.corrects_number?`
    <PrzyczynaKorekty>${esc(inv.correction_reason||'Korekta')}</PrzyczynaKorekty>
    <TypKorekty>1</TypKorekty>
    <DaneFaKorygowanej>
      <DataWystFaKorygowanej>${issueDate}</DataWystFaKorygowanej>
      <NrFaKorygowanej>${esc(inv.corrects_number)}</NrFaKorygowanej>
      ${inv.corrects_ksef_number?`<NrKSeF>1</NrKSeF><NrKSeFFaKorygowanej>${esc(inv.corrects_ksef_number)}</NrKSeFFaKorygowanej>`:'<NrKSeFN>1</NrKSeFN>'}
    </DaneFaKorygowanej>`:'';

  return `<?xml version="1.0" encoding="UTF-8"?>
<Faktura xmlns="http://crd.gov.pl/wzor/2025/06/25/13775/"
  xmlns:etd="http://crd.gov.pl/xml/schematy/dziedzinowe/mf/2022/01/05/eD/DefinicjeTypy/"
  xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">
  <Naglowek>
    <KodFormularza kodSystemowy="FA (3)" wersjaSchemy="1-0E">FA</KodFormularza>
    <WariantFormularza>3</WariantFormularza>
    <DataWytworzeniaFa>${ts}</DataWytworzeniaFa>
    <SystemInfo>STAR-TRANS</SystemInfo>
  </Naglowek>
  <Podmiot1>
    <DaneIdentyfikacyjne>
      <NIP>${esc((inv.seller_nip||'').replace(/[^0-9]/g,''))}</NIP>
      <Nazwa>${esc(inv.seller_name)}</Nazwa>
    </DaneIdentyfikacyjne>
    <Adres>
      <KodKraju>PL</KodKraju>
      <AdresL1>${esc(inv.seller_address)}</AdresL1>
    </Adres>
    <DaneKontaktowe>
      <Email>${esc(company?.email||'')}</Email>
    </DaneKontaktowe>
  </Podmiot1>
  <Podmiot2>
    <DaneIdentyfikacyjne>
      <NIP>${esc((inv.buyer_nip||'').replace(/[^0-9]/g,''))}</NIP>
      <Nazwa>${esc(inv.buyer_name)}</Nazwa>
    </DaneIdentyfikacyjne>
    <Adres>
      <KodKraju>PL</KodKraju>

// Send invoice to KSeF 2.0 via Supabase Edge Function proxy
const sendToKSeF=async(inv,company,settings)=>{
  const env=settings.ksef_env||'prod';
  const nip=(inv.seller_nip||company?.nip||'').replace(/[^0-9]/g,'');
  const ksefToken=settings.ksef_token||'';
  if(!ksefToken)throw new Error('Brak tokenu KSeF. Uzupełnij w Ustawieniach.');
  if(!nip)throw new Error('Brak NIP sprzedawcy. Uzupełnij w Danych firmy.');

  const proxyCall=async(payload)=>{
    const r=await fetch(KSEF_PROXY,{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':`Bearer ${SB_KEY}`,'apikey':SB_KEY},
      body:JSON.stringify({env,...payload}),
    });
    if(!r.ok){const t=await r.text().catch(()=>'');throw new Error(`Proxy HTTP ${r.status}: ${t.slice(0,300)}`);}
    const res=await r.json();
    if(!res.ok)throw new Error(`KSeF ${res.status||''}: ${JSON.stringify(res.data||res).slice(0,400)}`);
    return res;
  };

  // Krok 1: challenge
  const chRes=await proxyCall({path:'/api/v2/auth/challenge',method:'POST',body:{contextIdentifier:{type:'Nip',value:nip}}});
  const challenge=chRes.data?.challenge;
  const timestampMs=chRes.data?.timestampMs;
  if(!challenge||!timestampMs)throw new Error(`Brak challenge/timestampMs: ${JSON.stringify(chRes.data).slice(0,300)}`);

  // Krok 2: zaszyfruj token (dokładnie ten timestampMs, właściwy certyfikat KsefTokenEncryption)
  const encRes=await proxyCall({action:'encryptToken',ksefTokenToEncrypt:ksefToken,timestampMs});
  const encryptedToken=encRes.encryptedToken;
  if(!encryptedToken)throw new Error('Błąd szyfrowania tokenu.');

  // Krok 3: wyślij zaszyfrowany token → authenticationToken + referenceNumber
  const authRes=await proxyCall({path:'/api/v2/auth/ksef-token',method:'POST',body:{challenge,contextIdentifier:{type:'Nip',value:nip},encryptedToken}});
  const authenticationToken=authRes.data?.authenticationToken?.token||authRes.data?.authenticationToken;
  const authRefNumber=authRes.data?.referenceNumber;
  if(!authenticationToken||!authRefNumber)throw new Error(`Brak authenticationToken/referenceNumber: ${JSON.stringify(authRes.data).slice(0,300)}`);

  // Krok 4: poczekaj aż uwierzytelnienie się zakończy (status 200), odpytując co 1s, max 15s
  let statusOk=false;
  for(let i=0;i<15;i++){
    await new Promise(r=>setTimeout(r,1000));
    const stRes=await proxyCall({path:`/api/v2/auth/${authRefNumber}`,method:'GET',token:authenticationToken});
    const code=stRes.data?.status?.code;
    if(code===200){statusOk=true;break;}
    if(code&&code>=400)throw new Error(`Błąd uwierzytelniania (status ${code}): ${JSON.stringify(stRes.data).slice(0,300)}`);
  }
  if(!statusOk)throw new Error('Przekroczono czas oczekiwania na uwierzytelnienie KSeF (15s).');

  // Krok 5: wymień authenticationToken na accessToken JWT
  const redeemRes=await proxyCall({path:'/api/v2/auth/token/redeem',method:'POST',body:{},token:authenticationToken});
  const accessToken=redeemRes.data?.accessToken?.token||redeemRes.data?.accessToken;
  if(!accessToken)throw new Error(`Brak accessToken: ${JSON.stringify(redeemRes.data).slice(0,300)}`);

  // Krok 6: wyślij fakturę (otwarcie sesji + szyfrowanie AES + wysyłka + oczekiwanie na
  // FAKTYCZNE potwierdzenie/numer KSeF — nie tylko "przyjęto do przetworzenia").
  // Wywołujemy bezpośrednio (nie przez proxyCall), żeby zachować szczegółowy komunikat błędu.
  const xml=generateKSeFXML(inv,company);
  const sendR=await fetch(KSEF_PROXY,{
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':`Bearer ${SB_KEY}`,'apikey':SB_KEY},
    body:JSON.stringify({env,action:'sendInvoice',accessToken,xml}),
  });
  if(!sendR.ok){const t=await sendR.text().catch(()=>'');throw new Error(`Proxy HTTP ${sendR.status}: ${t.slice(0,300)}`);}
  const sendRes=await sendR.json();
  if(!sendRes.ok)throw new Error(sendRes.error||`Błąd wysyłki faktury (krok: ${sendRes.step}): ${JSON.stringify(sendRes.data).slice(0,400)}`);

  const ksefNumber=sendRes.ksefNumber;
  if(!ksefNumber)throw new Error(`Faktura przetworzona, ale brak numeru KSeF w odpowiedzi: ${JSON.stringify(sendRes.data).slice(0,400)}`);
  return{refNo:ksefNumber,xml};
};

// GENERATOR JPK_FA (4) — Jednolity Plik Kontrolny dla faktur, na podstawie publicznie
// znanego schematu Ministerstwa Finansów. UWAGA: w przeciwieństwie do integracji KSeF
// (którą testowaliśmy na żywym systemie), tego pliku NIE dało się zweryfikować na
// oficjalnym walidatorze MF — przed wysyłką sprawdź go w narzędziu "Klient JPK 2.0"
// lub skonsultuj z księgowym.
const generateJPK_FA=(invoices,company,monthStr,kodUrzedu)=>{
  const [y,m]=monthStr.split('-');
  const monthStart=`${y}-${m}-01`;
  const lastDay=new Date(parseInt(y),parseInt(m),0).getDate();
  const monthEnd=`${y}-${m}-${String(lastDay).padStart(2,'0')}`;
  const now=new Date().toISOString().replace(/\.\d{3}Z$/,'');

  // Faktury z danego miesiąca — TYLKO faktury VAT i korekty. Noty obciążeniowe NIE MOGĄ
  // być tu uwzględnione — schemat JPK_FA akceptuje wyłącznie RodzajFaktury = VAT, KOREKTA
  // lub ZAL (potwierdzone przez oficjalny walidator), nie ma żadnej wartości dla "innych"
  // dokumentów. Noty nie są dokumentami VAT, więc formalnie i tak nie powinny się tu
  // znaleźć — to zgodne z zasadami, nie ograniczenie tej aplikacji.
  const docs=invoices.filter(inv=>{
    const d=inv.issue_date||inv.created_at||'';
    if(inv.doc_type==='nota')return false;
    return d>=monthStart&&d<=monthEnd;
  }).sort((a,b)=>(a.issue_date||'').localeCompare(b.issue_date||''));

  if(docs.length===0)return null;

  let fakturyXml='';
  let wierszeXml='';
  let totalGross=0;
  let totalNet=0;
  let lineCount=0;

  docs.forEach(inv=>{
    const items=inv.items||[];
    const net=parseFloat(inv.total_net)||items.reduce((s,it)=>s+(parseFloat(it.qty)||0)*(parseFloat(it.price)||0),0);
    const gross=parseFloat(inv.total_gross)||net;
    const vatAmount=Math.round((gross-net)*100)/100;
    totalNet+=net;totalGross+=gross;

    const rodzaj=inv.doc_type==='korekta'?'KOREKTA':'VAT';
    const currency=inv.currency||'PLN';

    fakturyXml+=`
  <Faktura>
    <KodWaluty>${currency}</KodWaluty>
    <P_1>${inv.issue_date||''}</P_1>
    <P_2A>${esc(inv.number)}</P_2A>
    <P_3A>${esc(inv.buyer_name)}</P_3A>
    <P_3B>${esc(inv.buyer_address)}</P_3B>
    <P_3C>${esc(inv.seller_name)}</P_3C>
    <P_3D>${esc(inv.seller_address)}</P_3D>
    <P_4A>PL</P_4A>
    <P_4B>${esc((inv.seller_nip||'').replace(/[^0-9]/g,''))}</P_4B>
    <P_5A>PL</P_5A>
    <P_5B>${esc((inv.buyer_nip||'').replace(/[^0-9]/g,''))}</P_5B>
    <P_6>${inv.sale_date||inv.issue_date||''}</P_6>
    <P_13_1>${net.toFixed(2)}</P_13_1>
    <P_14_1>${vatAmount.toFixed(2)}</P_14_1>
    <P_15>${gross.toFixed(2)}</P_15>
    <P_16>false</P_16>
    <P_17>false</P_17>
    <P_18>false</P_18>
    <P_18A>false</P_18A>
    <P_19>false</P_19>
    <P_19A>false</P_19A>
    <P_19B>false</P_19B>
    <P_19C>false</P_19C>
    <P_20>false</P_20>
    <P_20A>false</P_20A>
    <P_20B>false</P_20B>
    <P_21>false</P_21>
    <P_21A>false</P_21A>
    <P_21B>false</P_21B>
    <P_21C>false</P_21C>
    <P_22>false</P_22>
    <P_23>false</P_23>
    <P_106E_2>false</P_106E_2>
    <P_106E_3>false</P_106E_3>
    <RodzajFaktury>${rodzaj}</RodzajFaktury>
    ${inv.doc_type==='korekta'&&inv.corrects_number?`<PrzyczynaKorekty>${esc(inv.correction_reason||'Korekta')}</PrzyczynaKorekty>\n    <NrFaKorygowanej>${esc(inv.corrects_number)}</NrFaKorygowanej>`:''}
  </Faktura>`;

    items.forEach((it,i)=>{
      const qty=parseFloat(it.qty)||0;
      const price=parseFloat(it.price)||0;
      const lineNet=qty*price;
      const vatPct=parseFloat(it.vat)||0;
      lineCount++;
      wierszeXml+=`
  <FakturaWiersz>
    <P_2B>${esc(inv.number)}</P_2B>
    <P_7>${esc(it.description)}</P_7>
    <P_8A>szt.</P_8A>
    <P_8B>${qty.toFixed(4)}</P_8B>
    <P_9A>${price.toFixed(2)}</P_9A>
    <P_11>${lineNet.toFixed(2)}</P_11>
    <P_12>${vatPct}</P_12>
  </FakturaWiersz>`;
    });
  });

  const nip=(company?.nip||'').replace(/[^0-9]/g,'');

  return `<?xml version="1.0" encoding="UTF-8"?>
<JPK xmlns="http://jpk.mf.gov.pl/wzor/2022/02/17/02171/"
  xmlns:etd="http://crd.gov.pl/xml/schematy/dziedzinowe/mf/2018/08/24/eD/DefinicjeTypy/"
  xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">
  <Naglowek>
    <KodFormularza kodSystemowy="JPK_FA (4)" wersjaSchemy="1-0">JPK_FA</KodFormularza>
    <WariantFormularza>4</WariantFormularza>
    <CelZlozenia>1</CelZlozenia>
    <DataWytworzeniaJPK>${now}</DataWytworzeniaJPK>
    <DataOd>${monthStart}</DataOd>
    <DataDo>${monthEnd}</DataDo>
    <KodUrzedu>${esc(kodUrzedu||'')}</KodUrzedu>
  </Naglowek>
  <Podmiot1>
    <IdentyfikatorPodmiotu>
      <NIP>${esc(nip)}</NIP>
      <PelnaNazwa>${esc(company?.name)}</PelnaNazwa>
    </IdentyfikatorPodmiotu>
    <AdresPodmiotu>
      <etd:KodKraju>PL</etd:KodKraju>
      <etd:Wojewodztwo>${esc(company?.wojewodztwo)}</etd:Wojewodztwo>
      <etd:Powiat>${esc(company?.powiat)}</etd:Powiat>
      <etd:Gmina>${esc(company?.gmina)}</etd:Gmina>
      ${company?.ulica?`<etd:Ulica>${esc(company.ulica)}</etd:Ulica>`:''}
      <etd:NrDomu>${esc(company?.nr_domu)}</etd:NrDomu>
      ${company?.nr_lokalu?`<etd:NrLokalu>${esc(company.nr_lokalu)}</etd:NrLokalu>`:''}
      <etd:Miejscowosc>${esc(company?.miejscowosc)}</etd:Miejscowosc>
      <etd:KodPocztowy>${esc(company?.kod_pocztowy)}</etd:KodPocztowy>
    </AdresPodmiotu>
  </Podmiot1>${fakturyXml}
  <FakturaCtrl>
    <LiczbaFaktur>${docs.length}</LiczbaFaktur>
    <WartoscFaktur>${totalGross.toFixed(2)}</WartoscFaktur>
  </FakturaCtrl>${wierszeXml}
  <FakturaWierszCtrl>
    <LiczbaWierszyFaktur>${lineCount}</LiczbaWierszyFaktur>
    <WartoscWierszyFaktur>${totalNet.toFixed(2)}</WartoscWierszyFaktur>
  </FakturaWierszCtrl>
</JPK>`;
};


const Invoices=({db,pendingInvoice,onClearPending,openPreviewId,onPreviewOpened,onInvoiceSavedFromOrder,editId,onEditOpened,printInvoiceIds,onPrintTriggered})=>{

  // Open modal pre-filled from order when pendingInvoice arrives
  React.useEffect(()=>{

    setEurRate(null);setEurOverride('');

    // Find contractor to get address
    const clientNip=(pendingInvoice.client_nip||'').replace(/[^0-9]/g,'');
    const contractor=contractors.find(c=>(c.nip||'').replace(/[^0-9]/g,'')===clientNip&&clientNip)||
                     contractors.find(c=>c.name===pendingInvoice.client_name);
    const buyerAddr=contractor
      ?[contractor.address,contractor.zip_city||contractor.city].filter(Boolean).join(', ')
      :'';
    setForm({
      currency:'EUR',
      issue_date:today(),
      sale_date:sd,
      payment_days:company.default_payment_days||'14',
      payment_method:company.default_payment_method||'przelew',
      seller_name:company.name||'',
      seller_nip:company.nip||'',
      seller_address:addr||'',
      seller_bank:company.bank_account_eur||company.bank_account||'',
      seller_bank_pln:company.bank_account||'',
      seller_bank_eur:company.bank_account_eur||'',
      seller_bank_name:company.bank_name||'',
      seller_swift:company.swift||'',
      buyer_name:pendingInvoice.client_name||'',
      buyer_nip:pendingInvoice.client_nip||'',
