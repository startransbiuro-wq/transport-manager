                  <i className={`ti ${icon}`} style={{fontSize:26,color:fuelSourceTab===v?'#185FA5':'#aaa'}}/>
                  <div style={{textAlign:'left'}}>
                    <div style={{fontSize:13,fontWeight:600,color:fuelSourceTab===v?'#185FA5':'#1a1a18'}}>{l} ({rws.length})</div>
                    <div style={{fontSize:11,color:'#888'}}>{s.l.toFixed(1)} L · {s.c.toFixed(2)}{s.cons!==null?` · ${s.cons.toFixed(1)} L/100km`:''}</div>
                  </div>
                </button>;
              })}
            </div>

            {/* Stan licznika i paliwa — wspólne dla pojazdu, potrzebne do dokładnego wyliczenia
                spalania na kafelku "Wpisane od kierowcy" (bez zgadywania że bak jest pełny) */}
            <div style={{background:'#fff',borderRadius:12,border:'1px solid #185FA5',padding:'14px 16px',marginBottom:18}}>
              <div style={{fontSize:12,fontWeight:600,marginBottom:10,display:'flex',alignItems:'center',gap:6,color:'#185FA5'}}><i className="ti ti-gauge"/>Stan licznika i paliwa (do wyliczenia spalania)</div>
              <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(150px,1fr))',gap:10}}>
                <div><label style={C.lbl}>Stan licznika początkowy (km)</label><input style={C.inp} type="number" value={form.mileage_start||''} onChange={e=>setForm(p=>({...p,mileage_start:e.target.value.replace(/\s/g,'')}))}/></div>
                <div><label style={C.lbl}>Stan licznika obecnie (km)</label><input style={C.inp} type="number" value={form.mileage_end||''} onChange={e=>setForm(p=>({...p,mileage_end:e.target.value.replace(/\s/g,'')}))}/></div>
                <div><label style={C.lbl}>Paliwo w baku na starcie (L)</label><input style={C.inp} type="number" value={form.fuel_start||''} onChange={e=>setForm(p=>({...p,fuel_start:e.target.value}))}/></div>
                <div><label style={C.lbl}>Paliwo w baku obecnie (L)</label><input style={C.inp} type="number" value={form.fuel_end||''} onChange={e=>setForm(p=>({...p,fuel_end:e.target.value}))}/></div>
              </div>
              {distance===null&&<div style={{fontSize:9,color:'#888',marginTop:8}}>Uzupełnij stan licznika, aby zobaczyć spalanie na kafelkach powyżej.</div>}
              {distance!==null&&<div style={{fontSize:10,color:'#3B6D11',marginTop:8}}>Przejechano: <strong>{distance.toFixed(0)} km</strong></div>}
              <div style={{fontSize:9,color:'#888',marginTop:4}}>Kafelek "Wpisane od kierowcy" pokazuje dokładnie to samo spalanie co widzi kierowca w swoim linku (zawsze przy założeniu pełnego baku — tak samo jak u niego).</div>
            </div>

            {/* Add button */}
            <div style={{display:'flex',gap:8,marginBottom:14,flexWrap:'wrap'}}>
              <button style={C.btnP} onClick={()=>{setFuelForm(emptyFuel());setFuelModal(true);}}><i className="ti ti-plus"/> Dodaj tankowanie ręcznie</button>
              <button style={{...C.btn,background:'#185FA5',color:'#fff',border:'none'}} onClick={()=>setReconcileOpen(true)}><i className="ti ti-checkbox"/> Weryfikuj z CSV</button>
              <label style={{...C.btn,cursor:'pointer',position:'relative',overflow:'hidden'}}><i className="ti ti-upload"/> Importuj CSV (ręczne)<input type="file" accept=".csv" onChange={e=>{const file=e.target.files[0];if(!file)return;const rd=new FileReader();rd.onload=ev=>{const{records}=parseCSV(ev.target.result);const imported=records.map(r=>({id:gid(),date:normalizeDate(r['Data']||r['date']||''),liters:r['Litry']||r['liters']||'',price_per_liter:r['Cena/l']||'',total_cost:r['Kwota']||r['total_cost']||'',currency:r['Waluta']||'PLN',station:r['Stacja']||r['station']||'',mileage:r['Przebieg']||r['mileage']||'',fuel_type:r['Paliwo']||r['fuel_type']||'',country:r['Kraj']||r['country']||'',notes:r['Uwagi']||'',full_tank:false})).filter(r=>r.date||r.liters);setFuels(p=>[...p,...imported]);};rd.readAsText(file,'UTF-8');e.target.value='';}} style={{position:'absolute',inset:0,opacity:0,cursor:'pointer'}}/></label>
              <button style={C.btn} onClick={()=>{const rows=[['Data','Litry','Cena/l','Kwota','Waluta','Stacja','Przebieg','Paliwo','Kraj','Uwagi']];fuels.forEach(f=>rows.push([f.date,f.liters,f.price_per_liter||f.price_gross,f.total_gross||f.total_net,f.currency||'PLN',f.station,f.mileage,f.fuel_type,f.country,f.notes]));const csv=rows.map(r=>r.map(v=>`"${(v||'').toString().replace(/"/g,'""')}"`).join(',')).join('\n');const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`paliwo_${form.vehicle_reg||'wyjazd'}.csv`;a.click();}}><i className="ti ti-download"/> Eksportuj CSV</button>
            </div>

            <CatTable cat="paliwo" label="Paliwo (Olej napędowy)"/>
            <CatTable cat="adblue" label="AdBlue"/>
            <CatTable cat="inne" label="Inne"/>
            {activeRows.length===0&&<div style={{textAlign:'center',padding:32,color:'#aaa',fontSize:11}}>Brak wpisów w tej kategorii.</div>}
          </>;
        })()}
      </div>
    </div>}

    {reconcileOpen&&<div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.5)',zIndex:22000,display:'flex',alignItems:'center',justifyContent:'center',padding:20}} onClick={()=>setReconcileOpen(false)}>
      <div style={{background:'#fff',borderRadius:12,padding:20,width:'100%',maxWidth:1100,maxHeight:'90vh',overflowY:'auto'}} onClick={e=>e.stopPropagation()}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14}}>
          <div style={{fontSize:15,fontWeight:600}}>Weryfikacja tankowań — {form.driver_name} ({form.vehicle_reg})</div>
          <button style={{...C.btn,padding:'4px 8px'}} onClick={()=>setReconcileOpen(false)}><i className="ti ti-x"/></button>
        </div>
        <FuelDriverReconciliation trips={trips} setTrips={setTrips} records={fuelRecords} setRecords={setFuelRecords} scopeTripId={form.id} settings={settings}/>
      </div>
    </div>}
  </div>);
};

// FINANSE
const COST_CATEGORIES=['Paliwo','Naprawy','Wynagrodzenia','Leasing/Rata','Ubezpieczenie','Opłaty drogowe','Księgowość','Telefon/Internet','Biuro','Inne'];
const Finanse=({db})=>{
  const [costs,setCosts]=db.costs;
  const [orders]=db.orders;const [invoices]=db.invoices;const [settings]=db.settings;
  const [costTab,setCostTab]=useState('realne');
  const [modal,setModal]=useState(false);const [form,setForm]=useState({});
  const [selMonth,setSelMonth]=useState(()=>today().slice(0,7));
  const [costCategories,setCostCategories]=useStore('tm_cost_categories',COST_CATEGORIES);
  const [newCat,setNewCat]=useState('');
  const [manualCat,setManualCat]=useState(false);
  const [pdfPreview,setPdfPreview]=useState(null);
  const [fileLoading,setFileLoading]=useState(false);
  // Filters
  const [fPaid,setFPaid]=useState('');       // ''|'paid'|'unpaid'
  const [fKsef,setFKsef]=useState('');       // ''|'yes'|'no'
  const [fCat,setFCat]=useState('');
  const [fSearch,setFSearch]=useState('');   // search in seller/description/nr faktury
  const [fAmtMin,setFAmtMin]=useState('');
  const [fAmtMax,setFAmtMax]=useState('');
  const [showFilters,setShowFilters]=useState(false);

  const addCat=()=>{const t=newCat.trim();if(!t||costCategories.includes(t))return;setCostCategories(p=>[...p,t]);setNewCat('')};
  const remCat=t=>{setCostCategories(p=>p.filter(x=>x!==t));if(form.category===t)setForm(p=>({...p,category:''}))};

  const hFile=async e=>{
    const file=e.target.files[0];if(!file)return;setFileLoading(true);
    let dataUrl;
    if(file.type.startsWith('image/')){
      dataUrl=await new Promise(res=>{
        const img=new Image();const url=URL.createObjectURL(file);
        img.onload=()=>{
          const maxW=1200;const scale=Math.min(1,maxW/img.width);
          const canvas=document.createElement('canvas');canvas.width=img.width*scale;canvas.height=img.height*scale;
          canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
          URL.revokeObjectURL(url);res(canvas.toDataURL('image/jpeg',0.78));
        };
        img.onerror=()=>{URL.revokeObjectURL(url);res(null);};
        img.src=url;
      });
    }else{
      dataUrl=await new Promise(res=>{const rd=new FileReader();rd.onload=ev=>res(ev.target.result);rd.onerror=()=>res(null);rd.readAsDataURL(file);});
    }
    if(!dataUrl){setFileLoading(false);return;}
    // Upload to Supabase Storage — keep only a small URL locally, not the full base64
    const url=await sbUploadBase64(dataUrl,file.name,'costs');
    if(url){
      setForm(p=>({...p,doc_file:url,doc_file_name:file.name}));
    }else{
      // Storage upload failed (e.g. offline) — fall back to local base64 so nothing is lost this session
      setForm(p=>({...p,doc_file:dataUrl,doc_file_name:file.name}));
      alert('Nie udało się wysłać pliku do chmury (brak internetu?). Plik jest tymczasowo zapisany lokalnie — zapisz koszt i spróbuj ponownie później, gdy będzie internet.');
    }
    setFileLoading(false);
    e.target.value='';
  };

  const [saving,setSaving]=useState(false);
  const save=async()=>{
    setSaving(true);
    const item={...form,type:form.type||costTab};
    const result=await(form.id?setCosts(p=>p.map(x=>x.id===form.id?{...x,...item}:x)):setCosts(p=>[...p,{...item,id:gid(),created_at:today()}]));
    setSaving(false);
    if(result?.synced===false){
      alert('UWAGA: Koszt zapisany TYLKO lokalnie na tym urządzeniu — nie udało się wysłać do chmury!\n\nBłąd: '+(result.error||'nieznany')+'\n\nSprawdź połączenie z internetem i otwórz ten koszt ponownie, edytuj i zapisz jeszcze raz gdy będzie internet.');
    }
    setModal(false);
  };
  const F=(k,l,t='text',full=false)=>(<div style={full?{gridColumn:'span 2'}:{}}><label style={C.lbl}>{l}</label><input style={C.inp} type={t} value={form[k]||''} onChange={e=>setForm(p=>({...p,[k]:e.target.value}))}/></div>);

  const er=parseFloat(settings?.eur_rate)||0;
  const names=['Styczeń','Luty','Marzec','Kwiecień','Maj','Czerwiec','Lipiec','Sierpień','Wrzesień','Październik','Listopad','Grudzień'];
  const [selYear,selMM]=selMonth.split('-');
  const monthLabel=`${names[parseInt(selMM)-1]} ${selYear}`;

  // Costs filtered by tab and month
  const tabCosts=costs.filter(c=>{
    if(costTab==='realne')return(c.type||'realne')==='realne';
    if(costTab==='księgowe')return c.type==='księgowe'||(c.also_accountant&&(c.type||'realne')==='realne');
    return false;
  });
  const monthCosts=tabCosts.filter(c=>{
    if(!(c.date||'').startsWith(selMonth))return false;
    if(fPaid==='paid'&&!c.paid)return false;
    if(fPaid==='unpaid'&&c.paid)return false;
    if(fKsef==='yes'&&!c.ksef)return false;
    if(fKsef==='no'&&c.ksef)return false;
    if(fCat&&c.category!==fCat)return false;
    if(fSearch){const q=fSearch.toLowerCase();if(!(c.seller||'').toLowerCase().includes(q)&&!(c.description||'').toLowerCase().includes(q)&&!(c.invoice_number||'').toLowerCase().includes(q))return false;}
    if(fAmtMin&&parseFloat(c.amount_gross||0)<parseFloat(fAmtMin))return false;
    if(fAmtMax&&parseFloat(c.amount_gross||0)>parseFloat(fAmtMax))return false;
    return true;
  });
  const activeFilters=[fPaid,fKsef,fCat,fSearch,fAmtMin,fAmtMax].filter(Boolean).length;
  const totalCostsNet=monthCosts.reduce((s,c)=>{
    const amt=parseFloat(c.amount_net)||0;
    if((c.currency||'PLN')==='EUR')s.eur+=amt;else s.pln+=amt;
    return s;
  },{eur:0,pln:0});
  const totalCostsGross=monthCosts.reduce((s,c)=>{
    const amt=parseFloat(c.amount_gross)||0;
    if((c.currency||'PLN')==='EUR')s.eur+=amt;else s.pln+=amt;
    return s;
  },{eur:0,pln:0});

  return(<div>
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12,flexWrap:'wrap',gap:8}}>
      <h1 style={{fontSize:18,fontWeight:500,margin:0}}>Finanse</h1>
      <div style={{display:'flex',alignItems:'center',gap:6}}>
        <button style={{...C.btn,padding:'6px 10px'}} onClick={()=>{
          let y=parseInt(selYear),m=parseInt(selMM)-1;if(m<1){m=12;y--;}
          setSelMonth(`${y}-${String(m).padStart(2,'0')}`);
        }}><i className="ti ti-chevron-left"/></button>
        <select style={{...C.inp,width:130}} value={selMM} onChange={e=>setSelMonth(`${selYear}-${e.target.value}`)}>
          {names.map((n,i)=><option key={n} value={String(i+1).padStart(2,'0')}>{n}</option>)}
        </select>
        <select style={{...C.inp,width:90}} value={selYear} onChange={e=>setSelMonth(`${e.target.value}-${selMM}`)}>
          {Array.from({length:7},(_,i)=>parseInt(today().slice(0,4))-3+i).map(y=><option key={y} value={y}>{y}</option>)}
        </select>
        <button style={{...C.btn,padding:'6px 10px'}} onClick={()=>{
          let y=parseInt(selYear),m=parseInt(selMM)+1;if(m>12){m=1;y++;}
          setSelMonth(`${y}-${String(m).padStart(2,'0')}`);
        }}><i className="ti ti-chevron-right"/></button>
      </div>
    </div>

    {/* Costs */}
    <div style={C.card}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8,flexWrap:'wrap',gap:8}}>
        <div style={{fontSize:12,fontWeight:500,display:'flex',alignItems:'center',gap:5}}><i className="ti ti-wallet"/>Koszty</div>
        <button style={C.btnP} onClick={()=>{setForm({date:today(),currency:'PLN',paid:false,ksef:false,type:costTab});setManualCat(false);setModal(true)}}><i className="ti ti-plus"/> Dodaj koszt</button>
      </div>
      <div style={{display:'flex',gap:5,marginBottom:10}}>
        {[{id:'realne',label:'Koszty realne'},{id:'księgowe',label:'Koszty do księgowego'}].map(t=>
          <button key={t.id} style={{...C.btn,...(costTab===t.id?{background:'#f5f4f0',fontWeight:500}:{})}} onClick={()=>setCostTab(t.id)}>{t.label}</button>
        )}
      </div>
      <div style={{display:'flex',gap:10,marginBottom:10,flexWrap:'wrap'}}>
        <div style={C.stat}>
          <div style={{fontSize:10,color:'#888'}}>Suma kosztów netto — {monthLabel}</div>
          <div style={{fontSize:18,fontWeight:500,color:'#A32D2D'}}>
            {totalCostsNet.eur>0&&<span>{totalCostsNet.eur.toFixed(2)} € · </span>}
            {(totalCostsNet.eur*er+totalCostsNet.pln).toFixed(2)} zł
            {er>0&&totalCostsNet.eur>0&&<span style={{fontSize:9,color:'#aaa',fontWeight:400}}> (kurs {er.toFixed(4)})</span>}
          </div>
        </div>
        <div style={C.stat}>
          <div style={{fontSize:10,color:'#888'}}>Suma kosztów brutto — {monthLabel}</div>
          <div style={{fontSize:18,fontWeight:500,color:'#A32D2D'}}>
            {totalCostsGross.eur>0&&<span>{totalCostsGross.eur.toFixed(2)} € · </span>}
            {(totalCostsGross.eur*er+totalCostsGross.pln).toFixed(2)} zł
            {er>0&&totalCostsGross.eur>0&&<span style={{fontSize:9,color:'#aaa',fontWeight:400}}> (kurs {er.toFixed(4)})</span>}
          </div>
        </div>
      </div>
      {/* Filter bar */}
      <div style={{display:'flex',gap:8,alignItems:'center',marginBottom:8,flexWrap:'wrap'}}>
        <button style={{...C.btn,background:showFilters?'#1a1a18':'',color:showFilters?'#fff':'',position:'relative'}} onClick={()=>setShowFilters(p=>!p)}>
          <i className="ti ti-filter"/> Filtry
          {activeFilters>0&&<span style={{position:'absolute',top:-4,right:-4,width:16,height:16,borderRadius:'50%',background:'#A32D2D',color:'#fff',fontSize:9,display:'flex',alignItems:'center',justifyContent:'center',fontWeight:700}}>{activeFilters}</span>}
        </button>
        <input style={{...C.inp,flex:1,minWidth:140}} placeholder="Szukaj: sprzedawca, opis, nr faktury..." value={fSearch} onChange={e=>setFSearch(e.target.value)}/>
        {activeFilters>0&&<button style={{...C.btn,fontSize:10,color:'#888'}} onClick={()=>{setFPaid('');setFKsef('');setFCat('');setFSearch('');setFAmtMin('');setFAmtMax('');}}><i className="ti ti-x"/> Wyczyść</button>}
      </div>
      {showFilters&&<div style={{background:'#f5f4f0',borderRadius:10,padding:'10px 12px',marginBottom:8,display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(160px,1fr))',gap:8}}>
        <div><label style={C.lbl}>Płatność</label><select style={C.inp} value={fPaid} onChange={e=>setFPaid(e.target.value)}>
          <option value="">Wszystkie</option>
          <option value="paid">✓ Zapłacone</option>
          <option value="unpaid">✗ Niezapłacone</option>
        </select></div>
        <div><label style={C.lbl}>KSeF</label><select style={C.inp} value={fKsef} onChange={e=>setFKsef(e.target.value)}>
          <option value="">Wszystkie</option>
          <option value="yes">✓ W KSeF</option>
          <option value="no">– Bez KSeF</option>
        </select></div>
        <div><label style={C.lbl}>Kategoria</label><select style={C.inp} value={fCat} onChange={e=>setFCat(e.target.value)}>
          <option value="">Wszystkie</option>
          {costCategories.map(c=><option key={c} value={c}>{c}</option>)}
        </select></div>
        <div><label style={C.lbl}>Kwota brutto od (zł)</label><input style={C.inp} type="number" step="0.01" value={fAmtMin} onChange={e=>setFAmtMin(e.target.value)} placeholder="np. 100"/></div>
        <div><label style={C.lbl}>Kwota brutto do (zł)</label><input style={C.inp} type="number" step="0.01" value={fAmtMax} onChange={e=>setFAmtMax(e.target.value)} placeholder="np. 5000"/></div>
      </div>}

      <table style={{width:'100%',borderCollapse:'collapse'}}>
        <thead><tr>{['Data','Kategoria','Sprzedawca','Nr faktury','Opis','Netto','Brutto',costTab==='księgowe'?'Rozliczenie':'Płatność','Księgowy','KSeF','PDF',''].map(h=><th key={h} style={C.th}>{h}</th>)}</tr></thead>
        <tbody>{monthCosts.sort((a,b)=>(a.date||'').localeCompare(b.date||'')).map(c=>(<tr key={c.id}>
          <td style={C.td}>{c.date}</td>
          <td style={C.td}>{c.category?<span style={bdg('gray')}>{c.category}</span>:'–'}</td>
          <td style={C.td}>{c.seller||'–'}</td>
          <td style={{...C.td,fontFamily:'monospace',fontSize:10}}>{c.invoice_number||'–'}</td>
          <td style={{...C.td,maxWidth:200}}><div style={{overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{c.description||'–'}</div></td>
          <td style={C.td}>{c.amount_net?`${parseFloat(c.amount_net).toFixed(2)} ${c.currency||'PLN'}`:'–'}</td>
          <td style={C.td}><strong>{parseFloat(c.amount_gross||0).toFixed(2)} {c.currency||'PLN'}</strong></td>
          <td style={C.td}><button onClick={()=>setCosts(p=>p.map(x=>x.id===c.id?{...x,paid:!x.paid}:x))} style={{...bdg(c.paid?'green':'red'),cursor:'pointer',border:'none',padding:'2px 8px',borderRadius:20,fontSize:10}}>{costTab==='księgowe'?(c.paid?'✓ Rozliczony':'✗ Nierozliczony'):(c.paid?'✓ Zapłacony':'✗ Niezapłacony')}</button></td>
          <td style={C.td}>{costTab==='realne'&&<button onClick={()=>setCosts(p=>p.map(x=>x.id===c.id?{...x,also_accountant:!x.also_accountant}:x))} style={{...bdg(c.also_accountant?'green':'gray'),cursor:'pointer',border:'none',padding:'2px 8px',borderRadius:20,fontSize:10}}>{c.also_accountant?'✓ Księgowy':'– Księgowy'}</button>}{costTab==='księgowe'&&c.also_accountant&&<span style={{...bdg('blue'),fontSize:10}}>z realnych</span>}</td>
          <td style={C.td}><button onClick={()=>setCosts(p=>p.map(x=>x.id===c.id?{...x,ksef:!x.ksef}:x))} style={{...bdg(c.ksef?'green':'gray'),cursor:'pointer',border:'none',padding:'2px 8px',borderRadius:20,fontSize:10}}>{c.ksef?'✓ KSeF':'– KSeF'}</button></td>
          <td style={C.td}>{c.doc_file?<button style={{...C.btn,padding:'2px 5px',color:'#185FA5'}} onClick={()=>setPdfPreview({data:c.doc_file,name:c.doc_file_name})} title="Podgląd"><i className="ti ti-file-type-pdf"/></button>:<span style={{color:'#aaa',fontSize:10}}>–</span>}</td>
          <td style={C.td}><button style={{...C.btn,padding:'2px 5px'}} onClick={()=>{setForm(c);setManualCat(!costCategories.includes(c.category)&&!!c.category);setModal(true)}}><i className="ti ti-edit"/></button><button style={{...C.btn,padding:'2px 5px',marginLeft:3}} onClick={()=>{if(c.doc_file&&c.doc_file.includes(BUCKET))sbDeleteFile(c.doc_file).catch(()=>{});setCosts(p=>p.filter(x=>x.id!==c.id));}}><i className="ti ti-trash"/></button></td>
        </tr>))}</tbody>
      </table>
      {monthCosts.length===0&&<div style={{textAlign:'center',padding:20,color:'#888',fontSize:11}}>Brak kosztów w tym miesiącu — {costTab==='realne'?'Koszty realne':'Koszty do księgowego'}.</div>}
      {monthCosts.length>0&&<div style={{borderTop:'2px solid #1a1a18',padding:'12px 14px',background:'#f5f4f0'}}>
        <div style={{display:'flex',gap:24,flexWrap:'wrap',alignItems:'center'}}>
          <div>
            <div style={{fontSize:10,color:'#888',marginBottom:2}}>Suma netto</div>
            <div style={{fontSize:14,fontWeight:600}}>
              {totalCostsNet.eur>0&&<span style={{color:'#185FA5'}}>{totalCostsNet.eur.toFixed(2)} € </span>}
              {totalCostsNet.pln>0&&<span>{totalCostsNet.pln.toFixed(2)} zł</span>}
              {totalCostsNet.eur>0&&er>0&&<span style={{fontSize:10,color:'#aaa',fontWeight:400,marginLeft:4}}>= {(totalCostsNet.eur*er+totalCostsNet.pln).toFixed(2)} zł</span>}
            </div>
          </div>
          <div>
            <div style={{fontSize:10,color:'#888',marginBottom:2}}>Suma brutto</div>
            <div style={{fontSize:14,fontWeight:700}}>
              {totalCostsGross.eur>0&&<span style={{color:'#185FA5'}}>{totalCostsGross.eur.toFixed(2)} € </span>}
              {totalCostsGross.pln>0&&<span>{totalCostsGross.pln.toFixed(2)} zł</span>}
              {totalCostsGross.eur>0&&er>0&&<span style={{fontSize:10,color:'#aaa',fontWeight:400,marginLeft:4}}>= {(totalCostsGross.eur*er+totalCostsGross.pln).toFixed(2)} zł</span>}
            </div>
          </div>
          <div style={{marginLeft:'auto',fontSize:10,color:'#888'}}>{monthCosts.length} pozycji</div>
        </div>
      </div>}
    </div>

    {modal&&<Modal title={form.id?'Edytuj koszt':`Dodaj koszt — ${costTab==='realne'?'realny':'do księgowego'}`} onClose={()=>setModal(false)} wide>
      <div style={{marginBottom:10,padding:'8px 10px',background:'#f5f4f0',borderRadius:8}}>
        <label style={C.lbl}>Rodzaj kosztu</label>
        <div style={{display:'flex',gap:6,marginTop:3}}>
          <button style={{...C.btn,flex:1,background:(form.type||costTab)==='realne'?'#185FA5':'',color:(form.type||costTab)==='realne'?'#fff':''}} onClick={()=>setForm(p=>({...p,type:'realne'}))}>Koszt realny</button>
          <button style={{...C.btn,flex:1,background:(form.type||costTab)==='księgowe'?'#854F0B':'',color:(form.type||costTab)==='księgowe'?'#fff':''}} onClick={()=>setForm(p=>({...p,type:'księgowe'}))}>Koszt do księgowego</button>
        </div>
      </div>
      <div style={C.g2}>
        {F('date','Data','date')}
        <div>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:2}}><label style={C.lbl}>Kategoria</label><button style={{...C.btn,padding:'1px 6px',fontSize:10}} onClick={()=>{setManualCat(p=>!p);if(manualCat)setForm(p=>({...p,category:''}))}}>{manualCat?'← Lista':'Wpisz ręcznie'}</button></div>
          {manualCat?<input style={C.inp} value={form.category||''} onChange={e=>setForm(p=>({...p,category:e.target.value}))} placeholder="Wpisz kategorię..."/>:<select style={C.inp} value={form.category||''} onChange={e=>setForm(p=>({...p,category:e.target.value}))}><option value="">Wybierz...</option>{costCategories.map(c=><option key={c}>{c}</option>)}</select>}
        </div>
        {F('seller','Nazwa sprzedawcy')}
        {F('invoice_number','Numer faktury')}
        <div><label style={C.lbl}>Kwota netto</label><input style={C.inp} type="number" step="0.01" value={form.amount_net||''} onChange={e=>{
          const net=e.target.value;
          setForm(p=>{
            const vatRate=parseFloat(p.vat_rate);
            const gross=(net!==''&&!isNaN(vatRate))?(parseFloat(net)*(1+vatRate/100)).toFixed(2):p.amount_gross;
            return {...p,amount_net:net,amount_gross:gross};
          });
        }}/></div>
        <div><label style={C.lbl}>VAT %</label><select style={C.inp} value={form.vat_rate||''} onChange={e=>{
          const vatRate=e.target.value;
          setForm(p=>{
            const net=parseFloat(p.amount_net);
            const gross=(vatRate!==''&&!isNaN(net))?(net*(1+parseFloat(vatRate)/100)).toFixed(2):p.amount_gross;
            return {...p,vat_rate:vatRate,amount_gross:gross};
          });
        }}><option value="">—</option><option value="23">23%</option><option value="8">8%</option><option value="5">5%</option><option value="0">0%</option></select></div>
        <div style={{gridColumn:'span 2'}}><label style={C.lbl}>Kwota brutto</label><div style={{display:'grid',gridTemplateColumns:'1fr 90px',gap:7}}><input style={C.inp} type="number" step="0.01" value={form.amount_gross||''} onChange={e=>setForm(p=>({...p,amount_gross:e.target.value}))}/><select style={C.inp} value={form.currency||'PLN'} onChange={e=>setForm(p=>({...p,currency:e.target.value}))}><option>PLN</option><option>EUR</option></select></div></div>
        {F('description','Opis',undefined,true)}
      </div>

      <div style={{marginTop:10,display:'flex',gap:16,flexWrap:'wrap'}}>
        <div style={{display:'flex',alignItems:'center',gap:7}}><input type="checkbox" id="cost-paid" checked={form.paid||false} onChange={e=>setForm(p=>({...p,paid:e.target.checked}))} style={{width:14,height:14,cursor:'pointer'}}/><label htmlFor="cost-paid" style={{fontSize:12,cursor:'pointer'}}>{costTab==='księgowe'?'Koszt rozliczony':'Koszt zapłacony'}</label></div>
        <div style={{display:'flex',alignItems:'center',gap:7}}><input type="checkbox" id="cost-ksef" checked={form.ksef||false} onChange={e=>setForm(p=>({...p,ksef:e.target.checked}))} style={{width:14,height:14,cursor:'pointer'}}/><label htmlFor="cost-ksef" style={{fontSize:12,cursor:'pointer'}}>Faktura w KSeF</label></div>
      </div>

      <div style={{marginTop:12,borderTop:'0.5px solid rgba(0,0,0,0.08)',paddingTop:12}}>
        <div style={C.secT}>Dokument (PDF/zdjęcie)</div>
        <div style={{display:'flex',gap:7,flexWrap:'wrap',alignItems:'center',marginBottom:8}}>
          <label style={{...C.btnP,cursor:'pointer',position:'relative',overflow:'hidden'}}>{fileLoading?<><i className="ti ti-loader-2" style={{animation:'spin 1s linear infinite'}}/> Wczytywanie...</>:<><i className="ti ti-upload"/> Wgraj PDF/zdjęcie</>}<input type="file" accept=".pdf,application/pdf,image/*" onChange={hFile} style={{position:'absolute',inset:0,opacity:0,cursor:'pointer'}} disabled={fileLoading}/></label>
          <label style={{...C.btn,cursor:'pointer',position:'relative',overflow:'hidden'}}><i className="ti ti-camera"/> Zrób zdjęcie<input type="file" accept="image/*" capture="environment" onChange={hFile} style={{position:'absolute',inset:0,opacity:0,cursor:'pointer'}} disabled={fileLoading}/></label>
          {form.doc_file&&<span style={{fontSize:11,color:'#3B6D11',display:'flex',alignItems:'center',gap:4}}><i className="ti ti-circle-check"/>{form.doc_file_name}<button style={{...C.btn,padding:'1px 4px',marginLeft:4,color:'#185FA5'}} onClick={()=>setPdfPreview({data:form.doc_file,name:form.doc_file_name})} title="Podgląd"><i className="ti ti-eye"/></button><button style={{...C.btn,padding:'1px 4px'}} onClick={()=>setForm(p=>({...p,doc_file:null,doc_file_name:null}))}><i className="ti ti-trash"/></button></span>}
        </div>
      </div>

      <div style={{marginTop:12,borderTop:'0.5px solid rgba(0,0,0,0.08)',paddingTop:12}}>
        <div style={C.secT}>Zarządzaj kategoriami</div>
        <div style={{display:'flex',gap:6,marginBottom:8}}><input style={{...C.inp,flex:1}} placeholder="Nowa kategoria..." value={newCat} onChange={e=>setNewCat(e.target.value)} onKeyDown={e=>e.key==='Enter'&&addCat()}/><button style={C.btnP} onClick={addCat}><i className="ti ti-plus"/></button></div>
        <div style={{display:'flex',flexWrap:'wrap',gap:5}}>{costCategories.map(c=><div key={c} style={{display:'flex',alignItems:'center',gap:3,background:'#f5f4f0',borderRadius:20,padding:'2px 10px 2px 11px',fontSize:11}}><span>{c}</span><button style={{background:'none',border:'none',cursor:'pointer',color:'#888',fontSize:13,lineHeight:1,padding:'0 1px'}} onClick={()=>remCat(c)}>×</button></div>)}</div>
      </div>

      <div style={{display:'flex',gap:6,justifyContent:'flex-end',marginTop:12,position:'sticky',bottom:0,background:'#fff',paddingTop:10,paddingBottom:6,borderTop:'0.5px solid rgba(0,0,0,0.08)'}}><button style={C.btn} onClick={()=>setModal(false)}>Anuluj</button><button style={C.btnP} onClick={save} disabled={saving}>{saving?<><i className="ti ti-loader-2" style={{animation:'spin 1s linear infinite'}}/> Zapisywanie...</>:'Zapisz'}</button></div>
    </Modal>}
    {pdfPreview&&<div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.6)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:10001}} onClick={()=>setPdfPreview(null)}>
      <div style={{background:'#fff',borderRadius:14,padding:14,maxWidth:760,width:'95%',maxHeight:'90vh',display:'flex',flexDirection:'column'}} onClick={e=>e.stopPropagation()}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}><div style={{fontSize:13,fontWeight:500}}><i className="ti ti-file-type-pdf" style={{color:'#A32D2D',marginRight:5}}/>{pdfPreview.name}</div><button style={{...C.btn,padding:'2px 6px'}} onClick={()=>setPdfPreview(null)}><i className="ti ti-x"/></button></div>
        {isPdfFile(pdfPreview.data,pdfPreview.name)
          ? <iframe src={pdfPreview.data} style={{width:'100%',height:'75vh',border:'0.5px solid rgba(0,0,0,0.1)',borderRadius:7}}/>
          : <img src={pdfPreview.data} style={{width:'100%',maxHeight:'75vh',objectFit:'contain',borderRadius:7}}/>}
      </div>
    </div>}
  </div>);
};



const Settings=({db,currentUser,isAdmin})=>{
  const [settings,setSettings]=db.settings;
  const [company]=db.company;
  const [loc,setLoc]=useState({...settings});
  const syncedRef=useRef(false);
  // Ustawienia mogą wczytać się z chmury PO tym jak ten komponent już się zamontował
  // (asynchroniczne pobieranie) — bez tego, lokalna kopia zostaje "pusta" na zawsze,
  // a każda zmiana (np. w szablonie checklisty) zapisuje się na tej pustej bazie,
  // przez co po ponownym wejściu widać wersję sprzed zmian.
  useEffect(()=>{
    if(!syncedRef.current&&settings&&Object.keys(settings).length>0){
      setLoc({...settings});
      syncedRef.current=true;
    }
  },[settings]);
  const [saved,setSaved]=useState(false);
  const [restoreMsg,setRestoreMsg]=useState(null);
  const [refreshing,setRefreshing]=useState(false);
  const [migrating,setMigrating]=useState(false);
  const [migrateReport,setMigrateReport]=useState(null);
  const [expanded,setExpanded]=useState({});
  const toggleSection=id=>setExpanded(p=>({...p,[id]:!p[id]}));
  const save=async()=>{
    const result=await setSettings(loc);
    if(result?.synced===false){
      alert('UWAGA: Ustawienia zapisane TYLKO lokalnie — nie udało się wysłać do chmury!\n\nBłąd: '+(result.error||'nieznany')+'\n\nSprawdź połączenie z internetem i spróbuj zapisać ponownie.');
      return;
    }
    setSaved(true);setTimeout(()=>setSaved(false),2000);
  };
  const F=(k,l,t='text',ph='')=>(<div><label style={C.lbl}>{l}</label><input style={C.inp} type={t} placeholder={ph} value={loc[k]||''} onChange={e=>setLoc(p=>({...p,[k]:e.target.value}))}/></div>);

  const BACKUP_KEYS=['tm_drivers','tm_vehicles','tm_repairs','tm_insurance','tm_orders','tm_invoices','tm_trips','tm_fines','tm_company','tm_contractors','tm_settings','tm_repair_types','tm_costs','tm_cost_categories','tm_todos','tm_payroll','tm_dismissed_alerts','tm_report_cols_orders','tm_report_cols_invoices'];

  // In the simplified model, Supabase is always the live source of truth on load —
  // there's no "unsynced backlog" to push. The only thing a manual action can usefully
  // do is force a fresh reload, which re-fetches everything straight from Supabase.
  const refreshFromCloud=()=>{
    setRefreshing(true);
    try{
      sessionStorage.setItem('tm_restore_active','settings'); // ten przycisk jest tylko w Ustawieniach
      sessionStorage.setItem('tm_restore_scroll',String(window.scrollY||0));
    }catch{}
    window.location.reload();
  };

  // One-time cleanup: find rows in fines/costs that still have large embedded base64
  // attachments (from before we switched uploads to Supabase Storage) and move them
  // to Storage, replacing the embedded data with a small URL. This is what was
  // causing HTTP 500 (server timeout) when loading the whole table at once.
  const HEAVY_FIELDS=['polisa_img','invoice_img','order_pdf_page1','doc_file'];
  const HEAVY_ARRAY_FIELDS=['docs','photos','documents','workPermitDocs','cmr_docs','polisa_docs','reg_docs'];
  const shrinkTable=async(table,folder)=>{
    const PAGE=10;let offset=0;let scanned=0,fixed=0,failed=0;
    while(true){
      const r=await fetch(`${SB_URL}/rest/v1/${table}?select=id,data&order=created_at.asc&limit=${PAGE}&offset=${offset}`,{headers:SB_HEADERS,cache:'no-store'});
      let rows=[];
      if(r.ok){rows=await r.json();}
      else{
        // page failed — fetch one at a time so we still find the heavy row(s)
        for(let i=0;i<PAGE;i++){
          try{
            const r2=await fetch(`${SB_URL}/rest/v1/${table}?select=id,data&order=created_at.asc&limit=1&offset=${offset+i}`,{headers:SB_HEADERS,cache:'no-store'});
            if(r2.ok){const row=await r2.json();if(row.length)rows.push(row[0]);else break;}
          }catch(e){}
        }
      }
      if(rows.length===0)break;
      for(const row of rows){
        scanned++;
        let changed=false;
        const d={...row.data};
        for(const f of HEAVY_FIELDS){
          if(typeof d[f]==='string'&&d[f].startsWith('data:')&&d[f].length>3000){
            try{const url=await sbUploadBase64(d[f],`${f}.jpg`,folder);if(url){d[f]=url;changed=true;}}catch(e){}
          }
        }
        for(const f of HEAVY_ARRAY_FIELDS){
          if(Array.isArray(d[f])){
            for(let i=0;i<d[f].length;i++){
              const item=d[f][i];
              if(item&&typeof item.data==='string'&&item.data.startsWith('data:')&&item.data.length>3000){
                try{const url=await sbUploadBase64(item.data,item.name||`${f}_${i}.jpg`,folder);if(url){d[f][i]={...item,data:url};changed=true;}}catch(e){}
              }
            }
          }
        }
        if(changed){
          try{
            const pr=await fetch(`${SB_URL}/rest/v1/${table}?id=eq.${row.id}`,{method:'PATCH',headers:{...SB_HEADERS,'Prefer':'return=minimal'},body:JSON.stringify({data:d})});
            if(pr.ok)fixed++;else failed++;
          }catch(e){failed++;}
        }
      }
      if(rows.length<PAGE)break;
      offset+=PAGE;
    }
    return{scanned,fixed,failed};
  };
  const runMigration=async()=>{
    setMigrating(true);
    const report=[];
    for(const [table,folder] of [['fines','fines'],['costs','costs']]){
      try{
        const res=await shrinkTable(table,folder);
        report.push({table,...res});
      }catch(e){report.push({table,error:e.message});}
    }
    setMigrateReport(report);
    setMigrating(false);
  };

  const [exporting,setExporting]=useState(false);
  const [importing,setImporting]=useState(false);

  const exportBackup=async()=>{
    setExporting(true);
    const data={version:2,exported:new Date().toISOString(),data:{}};
    try{
      for(const [lsKey,sbTable] of Object.entries(SB_TABLE)){
        try{
          if(SB_SINGLETON.has(lsKey)){
            const r=await fetch(`${SB_URL}/rest/v1/${sbTable}?select=id,data&limit=1`,{headers:SB_HEADERS,cache:'no-store'});
            if(r.ok){
              const rows=await r.json();
              if(rows.length>0)data.data[lsKey]={...rows[0].data,_sbid:rows[0].id};
            }
          }else{
            const rows=await sbFetch(sbTable);
            if(rows)data.data[lsKey]=rows;
          }
        }catch(e){}
      }
      const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
      const a=document.createElement('a');
      a.href=URL.createObjectURL(blob);
      a.download=`STAR-TRANS_backup_${today()}.json`;
      a.click();URL.revokeObjectURL(a.href);
    }finally{setExporting(false);}
  };

  const importBackup=e=>{
    const file=e.target.files[0];if(!file)return;
    const rd=new FileReader();
    rd.onload=async ev=>{
      try{
        const data=JSON.parse(ev.target.result);
        if(!data.data)throw new Error('Nieprawidłowy format pliku kopii zapasowej.');
        const keys=Object.keys(data.data);
        if(!window.confirm(`Czy na pewno chcesz przywrócić kopię zapasową z ${data.exported?new Date(data.exported).toLocaleString('pl'):'nieznanej daty'}?\n\nZostaną przywrócone: ${keys.length} kolekcji danych — zostaną zapisane BEZPOŚREDNIO w chmurze.\n\nUWAGA: to może nadpisać bieżące dane!`))return;
        setImporting(true);
        let totalOk=0,totalFail=0;
        for(const k of keys){
          const sbTable=SB_TABLE[k];
          if(!sbTable)continue;
          try{
            if(SB_SINGLETON.has(k)){
              await sbUpsertSingleton(sbTable,data.data[k]);
              totalOk++;
            }else{
              const arr=Array.isArray(data.data[k])?data.data[k]:[];
              for(const item of arr){
                try{await sbUpsert(sbTable,item);totalOk++;}catch(e){totalFail++;}
              }
            }
          }catch(e){totalFail++;}
        }
        setImporting(false);
        setRestoreMsg({ok:totalFail===0,msg:`Przywrócono ${totalOk} rekordów do chmury${totalFail>0?`, ${totalFail} błędów`:''}. Odświeżanie strony...`});
        try{
          sessionStorage.setItem('tm_restore_active','settings');
          sessionStorage.setItem('tm_restore_scroll',String(window.scrollY||0));
        }catch{}
        setTimeout(()=>window.location.reload(),2000);
      }catch(err){setImporting(false);setRestoreMsg({ok:false,msg:`Błąd: ${err.message}`});}
    };
    rd.readAsText(file);
    e.target.value='';
  };

  const Section=({id,icon,title,color,children,defaultOpen=false})=>{
    const isOpen=expanded[id]!==undefined?expanded[id]:defaultOpen;
    return<div style={{...C.card,marginBottom:14,border:color?`1px solid ${color}`:undefined}}>
      <button onClick={()=>toggleSection(id)} style={{background:'none',border:'none',padding:0,width:'100%',textAlign:'left',cursor:'pointer',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
        <div style={{fontSize:13,fontWeight:600,display:'flex',alignItems:'center',gap:6,color:color||'#1a1a18'}}><i className={`ti ${icon}`}/>{title}</div>
        <i className={isOpen?'ti ti-chevron-up':'ti ti-chevron-down'} style={{fontSize:16,color:'#888'}}/>
      </button>
      {isOpen&&<div style={{marginTop:14}}>{children}</div>}
    </div>;
  };
  return(<div>
    <h1 style={{fontSize:18,fontWeight:500,margin:'0 0 6px'}}>Ustawienia</h1>
    <div style={{fontSize:11,color:'#c00',fontFamily:'monospace',marginBottom:14,background:'#fff3f3',display:'inline-block',padding:'4px 10px',borderRadius:6,border:'1px solid #f0c0c0'}}>build: 2026-07-15-r10</div>

    <Section id="company" icon="ti-building" title="Dane firmy">
      <Company db={db}/>
    </Section>

    {isAdmin&&<Section id="users" icon="ti-users" title="Użytkownicy" color="#185FA5">
      <UserManagement currentUser={currentUser}/>
    </Section>}

    <Section id="sync" icon="ti-refresh" title="Dane w chmurze" color="#185FA5">
      <div style={{fontSize:11,color:'#555',marginBottom:12}}>
        Aplikacja zawsze pracuje na żywych danych z chmury (Supabase) — każdy zapis czeka na potwierdzenie zanim pojawi się na ekranie. Jeśli zmieniłeś coś na innym urządzeniu i chcesz mieć pewność że widzisz najnowszy stan — odśwież stronę.
      </div>
      <button style={C.btn} onClick={refreshFromCloud} disabled={refreshing}>
        {refreshing?<><i className="ti ti-loader-2" style={{animation:'spin 1s linear infinite'}}/> Odświeżanie...</>:<><i className="ti ti-refresh"/> Odśwież dane z chmury</>}
      </button>
    </Section>

    <Section id="announcements" icon="ti-speakerphone" title="Komunikaty ogólne dla kierowców" color="#185FA5">
      <div style={{fontSize:11,color:'#555',marginBottom:12}}>
        Niezależne od spalania — pokazują się przy każdym wejściu w link i każdym odświeżeniu strony, wszystkim kierowcom. Jeśli aktywny jest też komunikat o wysokim spalaniu, komunikaty ogólne pokazują się jako pierwsze, jeden po drugim.
      </div>
      {(()=>{
        const items=loc.general_announcements||[];
        const addItem=()=>setLoc(p=>({...p,general_announcements:[...(p.general_announcements||[]),{id:gid(),text:'',enabled:true}]}));
        const updItem=(id,key,val)=>setLoc(p=>({...p,general_announcements:(p.general_announcements||[]).map(a=>a.id===id?{...a,[key]:val}:a)}));
        const remItem=id=>setLoc(p=>({...p,general_announcements:(p.general_announcements||[]).filter(a=>a.id!==id)}));
        return<>
          <div style={{display:'flex',flexDirection:'column',gap:8,marginBottom:10}}>
            {items.map(a=><div key={a.id} style={{background:'#f5f4f0',borderRadius:8,padding:'8px 10px',display:'flex',gap:8,alignItems:'flex-start'}}>
              <label style={{display:'flex',alignItems:'center',gap:5,paddingTop:6,flexShrink:0,cursor:'pointer'}}>
                <input type="checkbox" checked={a.enabled!==false} onChange={e=>updItem(a.id,'enabled',e.target.checked)}/>
                <span style={{fontSize:9,color:a.enabled!==false?'#3B6D11':'#888',fontWeight:600}}>{a.enabled!==false?'Wł.':'Wył.'}</span>
              </label>
              <textarea style={{...C.inp,flex:1,minHeight:50,resize:'vertical'}} placeholder="Treść komunikatu..." value={a.text} onChange={e=>updItem(a.id,'text',e.target.value)}/>
              <button style={{...C.btn,padding:'4px 6px',flexShrink:0}} onClick={()=>remItem(a.id)}><i className="ti ti-trash" style={{fontSize:12}}/></button>
            </div>)}
            {items.length===0&&<div style={{fontSize:11,color:'#aaa',textAlign:'center',padding:8}}>Brak komunikatów.</div>}
          </div>
          <div style={{display:'flex',gap:8}}>
            <button style={C.btn} onClick={addItem}><i className="ti ti-plus"/> Dodaj komunikat</button>
            <button style={C.btnP} onClick={save}><i className="ti ti-device-floppy"/> Zapisz komunikaty</button>
          </div>
        </>;
      })()}
    </Section>

// TACHOGRAFY
// TERMINARZ POBIERANIA — tachograf pojazdu (1. dnia miesiąca, za poprzedni miesiąc)
// oraz karta kierowcy (15. dnia za 1-15 bieżącego miesiąca, 1. dnia za poprzedni miesiąc).
// Terminy generują się automatycznie, ale można je edytować pojedynczo (np. gdy
// kierowca ściąga dane dopiero po powrocie do Polski).
const lastDayOfMonth=(y,m)=>new Date(y,m+1,0).getDate(); // m is 0-indexed
const fmtD=(y,m,d)=>`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;

const TachoDownloadSchedule=({vehicles,drivers,downloads,setDownloads})=>{
  const [filterType,setFilterType]=useState('vehicle');
  const [driverCardTab,setDriverCardTab]=useState('polowa'); // 'polowa' | 'caly' — tylko dla filterType==='driver_card'
  const [selectedMonth,setSelectedMonth]=useState(today().slice(0,7));
  const [editingDate,setEditingDate]=useState(null); // id of row whose due_date is being edited
  const [editingPeriod,setEditingPeriod]=useState(null); // id of row whose period is being edited
  const [uploadingFor,setUploadingFor]=useState(null);
  const [addModal,setAddModal]=useState(false);
  const [addForm,setAddForm]=useState({type:'vehicle',due_date:today(),period_start:'',period_end:'',notes:''});

  // Auto-generate missing schedule entries — tylko blisko: poprzedni miesiąc (na wypadek
  // zaległości) + bieżący + następny. Kierowców dodajemy tylko jeśli mieli aktywną
  // umowę pokrywającą się z danym okresem rozliczeniowym.
  // Ciągłość okresów: znajdź OSTATNI pobrany plik dla tego samego pojazdu/kierowcy
  // (chronologicznie przed danym wpisem) — jeśli faktyczny okres pobrania różnił się
  // od sztywnego kalendarza (np. pobrano do 26., nie do 15./końca miesiąca), kolejny
  // wpis powinien zaczynać się od dnia po tamtym okresie, żeby nie było luki.
  const entityKey=d=>d.type==='vehicle'?`veh|${d.entity_reg}`:`drv|${d.driver_name}`;
  // Kategoria "połowa miesiąca" / "cały miesiąc" dla kart kierowców jest USTALANA RAZ,
  // w momencie utworzenia wpisu — zapisana na stałe w polu half_month_category. Późniejsza
  // ręczna zmiana terminu (due_date) NIE przenosi wpisu do innej zakładki.
  const halfCategory=d=>{
    if(d.half_month_category)return d.half_month_category;
    if(d.id?.startsWith('drv15-'))return'polowa';
    if(d.id?.startsWith('drv1-')||d.id?.startsWith('veh-'))return'caly';
    // Stare wpisy sprzed tej zmiany / wpisy dodane ręcznie bez jawnej flagi — wywnioskuj
    // z dnia pierwotnego terminu (15 = połowa, inny = cały miesiąc), tylko jednorazowo tutaj.
    return d.due_date?.slice(8,10)==='15'?'polowa':'caly';
  };
  const addDays=(dateStr,n)=>{const d=new Date(dateStr+'T00:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10);};
  const findLastDownloaded=(allDownloads,key,beforeDueDate)=>{
    return allDownloads
      .filter(d=>entityKey(d)===key&&d.downloaded&&d.period_end&&d.due_date<beforeDueDate)
      .sort((a,b)=>b.period_end.localeCompare(a.period_end))[0]||null;
  };

  const wasEmployedDuring=(dr,periodStart,periodEnd)=>{
    const empStart=dr.employment_start||'0000-01-01';
    const empEnd=dr.employment_end||'9999-12-31';
    return empStart<=periodEnd&&empEnd>=periodStart;
  };

  useEffect(()=>{
    const existingKeys=new Set(downloads.map(d=>d.id));
    const toAdd=[];
    const now=new Date();
    // Punkt startowy generowania NIE jest sztywno "-1 miesiąc od dziś" — zawsze cofa się
    // aż do najwcześniejszego miesiąca, jaki kiedykolwiek istniał w terminarzu (albo do
    // bieżącego miesiąca przy pierwszym uruchomieniu). Dzięki temu, nawet jeśli ktoś nie
    // otworzy aplikacji przez kilka miesięcy, żaden miesiąc nie zostanie pominięty na stałe
    // — przy kolejnym otwarciu wszystkie zaległe miesiące zostaną uzupełnione.
    let startOffset=-1;
    if(downloads.length>0){
      const minDue=downloads.reduce((min,dl)=>dl.due_date<min?dl.due_date:min,downloads[0].due_date);
      const minY=parseInt(minDue.slice(0,4),10),minM=parseInt(minDue.slice(5,7),10)-1;
      const monthsBack=(now.getFullYear()-minY)*12+(now.getMonth()-minM);
      startOffset=Math.min(-1,-monthsBack);
    }
    // Zakres startOffset..+2: wpisy "za poprzedni miesiąc" (tachograf pojazdu, karta 1-go dnia)
    // mają OKRES w miesiącu wcześniejszym niż termin, więc żeby ich okres (wg którego
    // klasyfikujemy zakładki) obejmował bieżący+następny miesiąc, trzeba wygenerować
    // termin jeszcze jeden miesiąc dalej niż w przypadku wpisów "15-go" (gdzie termin
    // i okres są w tym samym miesiącu).
    for(let offset=startOffset;offset<=2;offset++){
      const d=new Date(now.getFullYear(),now.getMonth()+offset,1);
      const y=d.getFullYear(),m=d.getMonth(); // this month
      const prevY=m===0?y-1:y,prevM=m===0?11:m-1;
      const dueVehicle=fmtD(y,m,1);
      const periodStartVeh=fmtD(prevY,prevM,1);
      const periodEndVeh=fmtD(prevY,prevM,lastDayOfMonth(prevY,prevM));

      vehicles.forEach(v=>{
        const id=`veh-${v.id}-${dueVehicle}`;
        if(!existingKeys.has(id)){
          const key=`veh|${v.registration}`;
          const lastEntry=findLastDownloaded(downloads,key,dueVehicle);
          const start=lastEntry?addDays(lastEntry.period_end,1):periodStartVeh;
          toAdd.push({id,type:'vehicle',entity_reg:v.registration,due_date:dueVehicle,period_start:start,period_end:periodEndVeh,downloaded:false,downloaded_date:null,file_url:null,file_name:null,notes:''});
        }
      });

      const due1=fmtD(y,m,1);
      const period1Start=fmtD(prevY,prevM,1);
      const period1End=fmtD(prevY,prevM,lastDayOfMonth(prevY,prevM));

      drivers.forEach(dr=>{
        const dn=`${dr.first_name} ${dr.last_name}`;
        const key=`drv|${dn}`;
        const id1=`drv1-${dr.id}-${due1}`;
        if(!existingKeys.has(id1)&&wasEmployedDuring(dr,period1Start,period1End)){
          const lastEntry=findLastDownloaded(downloads,key,due1);
          const start=lastEntry?addDays(lastEntry.period_end,1):period1Start;
          toAdd.push({id:id1,type:'driver_card',driver_name:dn,due_date:due1,period_start:start,period_end:period1End,downloaded:false,downloaded_date:null,file_url:null,file_name:null,notes:'',half_month_category:'caly'});
        }
      });

      // Wpisy 15-go dnia mają okres w TYM SAMYM miesiącu co termin — wystarczy zakres -1..+1
      if(offset<=1){
        const due15=fmtD(y,m,15);
        const period15Start=fmtD(y,m,1);
        const period15End=fmtD(y,m,15);
        drivers.forEach(dr=>{
          const dn=`${dr.first_name} ${dr.last_name}`;
          const key=`drv|${dn}`;
          const id15=`drv15-${dr.id}-${due15}`;
          if(!existingKeys.has(id15)&&wasEmployedDuring(dr,period15Start,period15End)){
            const lastEntry=findLastDownloaded(downloads,key,due15);
            const start=lastEntry?addDays(lastEntry.period_end,1):period15Start;
            toAdd.push({id:id15,type:'driver_card',driver_name:dn,due_date:due15,period_start:start,period_end:period15End,downloaded:false,downloaded_date:null,file_url:null,file_name:null,notes:'',half_month_category:'polowa'});
          }
        });
      }
    }
    if(toAdd.length>0)setDownloads(p=>[...p,...toAdd]);
    // eslint-disable-next-line
  },[vehicles.length,drivers.length]);

  const toggleDownloaded=id=>setDownloads(p=>p.map(d=>d.id===id?{...d,downloaded:!d.downloaded,downloaded_date:!d.downloaded?today():null}:d));
  const updateDueDate=(id,newDate)=>setDownloads(p=>p.map(d=>d.id===id?{...d,due_date:newDate,_manually_edited:true}:d));
  const updatePeriod=(id,key,val)=>setDownloads(p=>p.map(d=>d.id===id?{...d,[key]:val,_period_edited:true}:d));
  const updateNotes=(id,notes)=>setDownloads(p=>p.map(d=>d.id===id?{...d,notes}:d));

  const uploadFile=(id,file)=>{
    setUploadingFor(id);
    const rd=new FileReader();
    rd.onload=async ev=>{
      const dataUrl=ev.target.result;
      const url=await sbUploadBase64(dataUrl,file.name,'tacho-downloads');
      setDownloads(p=>p.map(d=>d.id===id?{...d,file_url:url||dataUrl,file_name:file.name,downloaded:true,downloaded_date:d.downloaded_date||today()}:d));
      if(!url)alert('Nie udało się wysłać pliku do chmury. Zapisano tymczasowo lokalnie.');
      setUploadingFor(null);
    };
    rd.readAsDataURL(file);
  };

  const todayStr=today();
  const filtered=downloads.filter(d=>{
    if(filterType&&d.type!==filterType)return false;
    if(!d.period_end||!d.period_end.startsWith(selectedMonth))return false;
    if(filterType==='driver_card'&&halfCategory(d)!==driverCardTab)return false;
    return true;
  }).sort((a,b)=>a.due_date.localeCompare(b.due_date));

  const overdueCount=downloads.filter(d=>!d.downloaded&&d.due_date<todayStr).length;
  const dueSoonCount=downloads.filter(d=>!d.downloaded&&d.due_date>=todayStr&&d.due_date<=fmtD(new Date().getFullYear(),new Date().getMonth(),new Date().getDate()+7)).length;

  return(<div>

    <div style={{fontSize:10,color:'#888',marginTop:8}}>

    </div>

    {addModal&&<Modal title="Dodaj wpis terminarza ręcznie" onClose={()=>setAddModal(false)}>
      <div style={C.g2}>
        <div><label style={C.lbl}>Typ</label><select style={C.inp} value={addForm.type} onChange={e=>setAddForm(p=>({...p,type:e.target.value,entity_reg:'',driver_name:''}))}>
          <option value="vehicle">Tachograf pojazdu</option>

        </select></div>
        {addForm.type==='vehicle'

          :<div><label style={C.lbl}>Kierowca</label><select style={C.inp} value={addForm.driver_name||''} onChange={e=>setAddForm(p=>({...p,driver_name:e.target.value}))}><option value="">Wybierz...</option>{drivers.map(dr=><option key={dr.id}>{dr.first_name} {dr.last_name}</option>)}</select></div>}
        <div><label style={C.lbl}>Termin</label><input style={C.inp} type="date" value={addForm.due_date} onChange={e=>setAddForm(p=>({...p,due_date:e.target.value}))}/></div>
        <div><label style={C.lbl}>Okres od</label><input style={C.inp} type="date" value={addForm.period_start} onChange={e=>setAddForm(p=>({...p,period_start:e.target.value}))}/></div>
        <div><label style={C.lbl}>Okres do</label><input style={C.inp} type="date" value={addForm.period_end} onChange={e=>setAddForm(p=>({...p,period_end:e.target.value}))}/></div>
        <div style={{gridColumn:'span 2'}}><label style={C.lbl}>Notatki</label><input style={C.inp} value={addForm.notes} onChange={e=>setAddForm(p=>({...p,notes:e.target.value}))}/></div>
      </div>
      <div style={{display:'flex',gap:6,justifyContent:'flex-end',marginTop:14}}>
        <button style={C.btn} onClick={()=>setAddModal(false)}>Anuluj</button>
        <button style={C.btnP} onClick={()=>{
          if(addForm.type==='vehicle'&&!addForm.entity_reg){alert('Wybierz pojazd.');return;}
          if(addForm.type==='driver_card'&&!addForm.driver_name){alert('Wybierz kierowcę.');return;}
          if(!addForm.due_date||!addForm.period_start||!addForm.period_end){alert('Uzupełnij termin i okres.');return;}
          setDownloads(p=>[...p,{id:gid(),...addForm,downloaded:false,downloaded_date:null,file_url:null,file_name:null,_manually_edited:true,_period_edited:true,half_month_category:addForm.due_date?.slice(8,10)==='15'?'polowa':'caly'}]);
          setAddModal(false);
        }}>Dodaj</button>
      </div>
    </Modal>}
  </div>);
};

    {tab==='wyjazdy'&&<div>

        {[['active','Aktywne'],['all','Wszystkie'],['completed','Zakończone']].map(([v,l])=>(
          <button key={v} style={{...C.btn,background:filter===v?'#1a1a18':'',color:filter===v?'#fff':''}} onClick={()=>setFilter(v)}>{l}</button>

              <div style={{fontSize:11,color:'#888'}}>{trip.vehicle_reg||'–'} · {trip.start_date||'–'} → {trip.end_date||'teraz'}</div></div>
            <span style={bdg(trip.status==='aktywny'?'green':trip.status==='zakończony'?'gray':'blue')}>{trip.status||'zaplanowany'}</span>
          </div>
          {entries.length>0&&<div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:6,marginBottom:8}}>

    </div>
