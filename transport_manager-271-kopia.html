  },[pendingInvoice]);
  const addItem=()=>setItems(p=>[...p,{description:'Zlecenie transportowe',qty:1,price:'',vat:form.doc_type==='nota'?'0':'23'}]);
  const remItem=i=>setItems(p=>p.filter((_,j)=>j!==i));
  const upItem=(i,k,v)=>setItems(p=>p.map((x,j)=>j===i?{...x,[k]:v}:x));
  const net=it=>(parseFloat(it.qty)||0)*(parseFloat(it.price)||0);
  const tNet=items.reduce((s,i)=>s+net(i),0);const tVat=items.reduce((s,i)=>s+net(i)*(parseFloat(i.vat)||0)/100,0);const tGross=tNet+tVat;
  const sym=form.currency==='EUR'?'€':'zł';const activeRate=eurOverride?parseFloat(eurOverride):eurRate?.rate;
  const fetchEurRate=async sd=>{
    if(!sd){setEurRate(null);return;}setEurRate(p=>({...p,loading:true,error:''}));
    try{
      const end=new Date(sd);end.setDate(end.getDate()-1);
      const start=new Date(end);start.setDate(start.getDate()-10);
      const endStr=end.toISOString().split('T')[0];
      const startStr=start.toISOString().split('T')[0];
      const r=await fetch(`https://api.nbp.pl/api/exchangerates/rates/A/EUR/${startStr}/${endStr}/?format=json`);
      if(r.ok){
        const d=await r.json();
        const list=d?.rates||[];
        if(list.length>0){
          const last=list[list.length-1]; // most recent = last business day before sale_date

          setEurRate({rate,date:dt,loading:false,error:''});
          setForm(p=>({...p,eur_rate:rate.toFixed(4),eur_rate_date:dt}));
          setEurOverride('');
          return;

      throw new Error('Brak danych');

  };
  // Fetch NBP rate for an exact date (or the last business day on/before it), used by manual date picker
  const fetchEurRateExact=async dateStr=>{
    if(!dateStr){setEurRate(null);return;}setEurRate(p=>({...p,loading:true,error:''}));
    try{
      const end=new Date(dateStr);
      const start=new Date(end);start.setDate(start.getDate()-10);
      const endStr=end.toISOString().split('T')[0];
      const startStr=start.toISOString().split('T')[0];
      const r=await fetch(`https://api.nbp.pl/api/exchangerates/rates/A/EUR/${startStr}/${endStr}/?format=json`);
      if(r.ok){
        const d=await r.json();
        const list=d?.rates||[];
        if(list.length>0){
          const last=list[list.length-1];
          const rate=last.mid;const dt=last.effectiveDate;
          setEurRate({rate,date:dt,loading:false,error:''});
          setForm(p=>({...p,eur_rate:rate.toFixed(4),eur_rate_date:dt}));
          setEurOverride('');
          return;
        }
      }
      throw new Error('Brak danych');
    }catch{setEurRate({rate:null,date:null,loading:false,error:'Nie udało się pobrać kursu NBP. Wpisz ręcznie.'});}
  };
  const save=()=>{
    const finalRate=eurOverride||form.eur_rate||null;
    const dtypeCheck=form.doc_type||'faktura';

    // Validation: required fields
    const missing=[];
    if(!form.seller_name)missing.push('Nazwa sprzedawcy');
    if(!form.seller_nip)missing.push('NIP sprzedawcy');
    if(!form.seller_address)missing.push('Adres sprzedawcy');
    if(!form.seller_bank_pln&&!form.seller_bank_eur)missing.push('Nr konta sprzedawcy (PLN lub EUR)');
    if(!form.buyer_name)missing.push('Nazwa nabywcy');
    if(!form.buyer_nip)missing.push('NIP nabywcy');
    if(!form.buyer_address)missing.push('Adres nabywcy');
    if(!form.issue_date)missing.push('Data wystawienia');
    if(dtypeCheck!=='nota'&&!form.sale_date)missing.push('Data sprzedaży');
    if(!form.payment_days)missing.push('Termin płatności');
    if(!form.payment_method)missing.push('Forma płatności');
    if(dtypeCheck==='korekta'){
      if(!form.corrects_number)missing.push('Nr korygowanej faktury');
      if(!form.correction_reason)missing.push('Powód korekty');
    }
    // Items: every item must have description, qty, price
    if(items.length===0)missing.push('Przynajmniej jedna pozycja faktury');
    items.forEach((it,i)=>{
      if(!it.description)missing.push(`Pozycja ${i+1}: opis`);
      if(it.qty===''||it.qty===null||it.qty===undefined||(dtypeCheck!=='korekta'&&parseFloat(it.qty)<=0)||(dtypeCheck==='korekta'&&parseFloat(it.qty)<0))missing.push(`Pozycja ${i+1}: ilość`);
      if(it.price===''||it.price===null||it.price===undefined||parseFloat(it.price)<0)missing.push(`Pozycja ${i+1}: cena netto`);
      if(it.vat===''||it.vat===null||it.vat===undefined)missing.push(`Pozycja ${i+1}: VAT`);
    });
    // EUR rate required when currency is EUR
    if(form.currency==='EUR'&&(!finalRate||parseFloat(finalRate)<=0))missing.push('Kurs EUR/PLN');

    if(missing.length>0){

    const monthSameType=invoices.filter(inv=>{const d=inv.issue_date||inv.created_at||'';return d.startsWith(`${yyyy}-${mm}`)&&(inv.doc_type||'faktura')===dtype;});
    const nextNum=form.id?null:monthSameType.length+1;
    const autoNumber=dtype==='faktura'?`${prefix} - ${nextNum}/${mm}/${yyyy}`:`${prefix}-${nextNum}/${mm}/${yyyy}`;
    let finalNumber=form.number||autoNumber;
    // If the chosen number is already taken (e.g. typed manually), automatically
    // bump to the next free number instead of blocking the save — increment the
    // numeric part while keeping the same prefix/month/year pattern.
    const existingNumbers=new Set(invoices.filter(inv=>inv.id!==form.id).map(inv=>inv.number));
    let bumpedFrom=null;
    if(existingNumbers.has(finalNumber)){
      bumpedFrom=finalNumber;
      const m=finalNumber.match(/^(.*?)(\d+)(\/.*)$/);
      if(m){
        let n=parseInt(m[2],10);
        let candidate;
        do{n++;candidate=`${m[1]}${n}${m[3]}`;}while(existingNumbers.has(candidate));
        finalNumber=candidate;
      }else{
        // Can't parse a numeric pattern — fall back to appending -2, -3, ...
        let suffix=2,candidate;
        do{candidate=`${finalNumber}-${suffix}`;suffix++;}while(existingNumbers.has(candidate));
        finalNumber=candidate;
      }

        after_net:tNet,
        after_vat:tVat,
        after_gross:tGross,
      };

    if(form.id)setInvoices(p=>p.map(x=>x.id===form.id?{...x,...inv}:x));else setInvoices(p=>[...p,{...inv,id:gid(),created_at:today()}]);
    setModal(false);
    if(bumpedFrom)alert(`Numer "${bumpedFrom}" był już zajęty — dokument zapisano z numerem "${finalNumber}".`);
    // If this invoice was created from an order (via "Wystaw fakturę"), return to Orders module

                  <td style={{padding:'7px 8px',textAlign:'right',fontWeight:700,fontSize:14}}>{gross.toFixed(2)} {sym}</td>
                  {hasPLN&&<td style={{padding:'7px 8px',textAlign:'right',fontWeight:700,fontSize:14}}>{(gross*rate).toFixed(2)} zł</td>}
                </tr>
              </tbody>
              {hasPLN&&<tfoot><tr><td colSpan={2} style={{...C.td,fontSize:10,color:'#888',paddingTop:6}}>
                Kurs: 1 EUR = {rate.toFixed(4)} PLN{preview.eur_rate_date&&preview.eur_rate_date!=='ręczny'?` (NBP ${preview.eur_rate_date})`:' (kurs ręczny)'}
              </td></tr></tfoot>}
            </table>;
            return<table style={{width:'100%',borderCollapse:'collapse',fontSize:11}}>
              <thead><tr>
                <th style={{...C.th,background:'#f5f4f0',textAlign:'left',width:'40%'}}>Podsumowanie</th>
                <th style={{...C.th,background:'#f5f4f0',textAlign:'right'}}>{isEUR?'EUR':'PLN'}</th>
                {hasPLN&&<th style={{...C.th,background:'#f5f4f0',textAlign:'right'}}>PLN</th>}
              </tr></thead>
              <tbody>
                <tr><td style={{...C.td,color:'#555'}}>Wartość netto</td><td style={{...C.td,textAlign:'right'}}>{net.toFixed(2)} {sym}</td>{hasPLN&&<td style={{...C.td,textAlign:'right'}}>{(net*rate).toFixed(2)} zł</td>}</tr>
                <tr><td style={{...C.td,color:'#555'}}>Podatek VAT</td><td style={{...C.td,textAlign:'right'}}>{vat.toFixed(2)} {sym}</td>{hasPLN&&<td style={{...C.td,textAlign:'right'}}>{(vat*rate).toFixed(2)} zł</td>}</tr>
                <tr style={{background:'#EAF3DE',color:'#1a1a18',border:'1.5px solid #1a1a18'}}>
                  <td style={{padding:'7px 8px',fontWeight:600}}>Do zapłaty</td>
                  <td style={{padding:'7px 8px',textAlign:'right',fontWeight:700,fontSize:14}}>{gross.toFixed(2)} {sym}</td>
                  {hasPLN&&<td style={{padding:'7px 8px',textAlign:'right',fontWeight:700,fontSize:14}}>{(gross*rate).toFixed(2)} zł</td>}
                </tr>
              </tbody>
              {hasPLN&&<tfoot><tr><td colSpan={3} style={{...C.td,fontSize:10,color:'#888',paddingTop:6}}>
                Kurs: 1 EUR = {rate.toFixed(4)} PLN{preview.eur_rate_date&&preview.eur_rate_date!=='ręczny'?` (NBP ${preview.eur_rate_date})`:' (kurs ręczny)'}
              </td></tr></tfoot>}
            </table>;
          })()}
        </div>
        {/* Correction comparison */}
        {preview.doc_type==='korekta'&&preview.before_net!==undefined&&(()=>{
          const bNet=parseFloat(preview.before_net||0),bVat=parseFloat(preview.before_vat||0),bGross=parseFloat(preview.before_gross||0);
          const aNet=parseFloat(preview.after_net!==undefined?preview.after_net:preview.total_net||0),aVat=parseFloat(preview.after_vat!==undefined?preview.after_vat:preview.total_vat||0),aGross=parseFloat(preview.after_gross!==undefined?preview.after_gross:preview.total_gross||0);
          const isEUR=preview.before_currency==='EUR'||preview.currency==='EUR';
          const bRate=parseFloat(preview.before_eur_rate)||0;
          const aRate=parseFloat(preview.eur_rate)||0;
          const effBRate=bRate>0?bRate:aRate;
          const effARate=aRate>0?aRate:bRate;
          const hasPLN=isEUR&&(effBRate>0||effARate>0);
          const sym=isEUR?'€':(preview.before_currency||preview.currency||'PLN')==='PLN'?'zł':(preview.before_currency||preview.currency);
          const fmtDiff=(d,s)=>`${d>0?'+':''}${d.toFixed(2)} ${s}`;
          const diffColor=d=>Math.abs(d)<0.005?'#888':d>0?'#3B6D11':'#A32D2D';
          const Row=({label,b,a,bold})=>{
            const d=a-b;
            if(bold){
              return<>
                <tr style={{background:'#EAF3DE',color:'#1a1a18',border:'1.5px solid #1a1a18'}}>
                  <td style={{padding:'7px 8px',fontWeight:600}}>{label}{hasPLN?' (EUR)':''}</td>
                  <td style={{padding:'7px 8px',textAlign:'right'}}>{b.toFixed(2)} {sym}</td>
                  <td style={{padding:'7px 8px',textAlign:'right'}}>{a.toFixed(2)} {sym}</td>
                  <td style={{padding:'7px 8px',textAlign:'right',fontWeight:700,color:d===0?'#888':d>0?'#3B6D11':'#A32D2D'}}>{fmtDiff(d,sym)}</td>
                </tr>
                {hasPLN&&<tr style={{background:'#EAF3DE',color:'#1a1a18',border:'1.5px solid #1a1a18'}}>
                  <td style={{padding:'7px 8px',fontWeight:600}}>{label} (PLN)</td>
                  <td style={{padding:'7px 8px',textAlign:'right'}}>{(b*effBRate).toFixed(2)} zł</td>
                  <td style={{padding:'7px 8px',textAlign:'right'}}>{(a*effARate).toFixed(2)} zł</td>
                  <td style={{padding:'7px 8px',textAlign:'right',fontWeight:700,color:((a*effARate)-(b*effBRate))===0?'#888':((a*effARate)-(b*effBRate))>0?'#3B6D11':'#A32D2D'}}>{fmtDiff((a*effARate)-(b*effBRate),'zł')}</td>
                </tr>}
              </>;
            }
            return<>
              <tr><td style={{...C.td,color:'#555'}}>{label}{hasPLN?' (EUR)':''}</td><td style={{...C.td,textAlign:'right'}}>{b.toFixed(2)} {sym}</td><td style={{...C.td,textAlign:'right'}}>{a.toFixed(2)} {sym}</td><td style={{...C.td,textAlign:'right',fontWeight:600,color:diffColor(d)}}>{fmtDiff(d,sym)}</td></tr>
              {hasPLN&&<tr><td style={{...C.td,color:'#555'}}>{label} (PLN)</td><td style={{...C.td,textAlign:'right'}}>{(b*effBRate).toFixed(2)} zł</td><td style={{...C.td,textAlign:'right'}}>{(a*effARate).toFixed(2)} zł</td><td style={{...C.td,textAlign:'right',fontWeight:600,color:diffColor((a*effARate)-(b*effBRate))}}>{fmtDiff((a*effARate)-(b*effBRate),'zł')}</td></tr>}
            </>;
          };
          return<div style={{marginTop:14}}>
            <div style={{fontSize:11,fontWeight:700,marginBottom:6,color:'#854F0B'}}><i className="ti ti-arrows-diff" style={{marginRight:5}}/>Zestawienie korekty — wartości przed i po korekcie{hasPLN&&` · kurs: ${effBRate.toFixed(4)} → ${effARate.toFixed(4)}`}</div>
            <table style={{width:'100%',borderCollapse:'collapse',fontSize:11}}>
              <thead><tr>
                <th style={{...C.th,background:'#f5f4f0',textAlign:'left'}}></th>
                <th style={{...C.th,background:'#f5f4f0',textAlign:'right'}}>Przed korektą</th>
                <th style={{...C.th,background:'#f5f4f0',textAlign:'right'}}>Po korekcie</th>
                <th style={{...C.th,background:'#f5f4f0',textAlign:'right'}}>Wartość korekty</th>
              </tr></thead>
              <tbody>
                <Row label="Wartość netto" b={bNet} a={aNet}/>
                <Row label="Podatek VAT" b={bVat} a={aVat}/>
                <Row label="Wartość brutto" b={bGross} a={aGross} bold/>
              </tbody>
            </table>
          </div>;
        })()}
      </div>
      {/* Already sent to KSeF — persistent status shown every time preview opens */}
      {preview.ksef_sent&&!ksefStatus&&<div style={{marginTop:10,padding:'8px 12px',borderRadius:8,background:'#EAF3DE',border:'0.5px solid #9FCB6A',fontSize:11,display:'flex',alignItems:'center',gap:8}}>
        <i className="ti ti-circle-check" style={{color:'#3B6D11'}}/>
        <span style={{flex:1,color:'#3B6D11'}}>Wysłano do KSeF{preview.ksef_ref?<> — nr ref: <b style={{fontFamily:'monospace'}}>{preview.ksef_ref}</b></>:''}</span>
      </div>}
      {/* KSeF status bar */}
      {ksefStatus&&<div style={{marginTop:10,padding:'8px 12px',borderRadius:8,background:ksefStatus.error?'#FCEBEB':ksefStatus.loading?'#f5f4f0':'#EAF3DE',border:`0.5px solid ${ksefStatus.error?'#F09595':ksefStatus.loading?'#e0dfd8':'#9FCB6A'}`,fontSize:11,display:'flex',alignItems:'center',gap:8}}>
        {ksefStatus.loading&&<i className="ti ti-loader-2" style={{animation:'spin 1s linear infinite'}}/>}
        {ksefStatus.error&&<i className="ti ti-alert-circle" style={{color:'#A32D2D'}}/>}
        {ksefStatus.refNo&&<i className="ti ti-circle-check" style={{color:'#3B6D11'}}/>}
        <span style={{flex:1,color:ksefStatus.error?'#A32D2D':ksefStatus.refNo?'#3B6D11':'#888',wordBreak:'break-all'}}>
          {ksefStatus.loading?'Wysyłanie do KSeF...':ksefStatus.error||`Wysłano! Nr referencyjny KSeF: ${ksefStatus.refNo}`}
        </span>
        {(ksefStatus.error||ksefStatus.refNo)&&<button style={{...C.btn,padding:'1px 5px'}} onClick={()=>setKsefStatus(null)}><i className="ti ti-x"/></button>}
      </div>}
      <div style={{display:'flex',gap:7,justifyContent:'flex-end',marginTop:16,paddingTop:12,borderTop:'0.5px solid rgba(0,0,0,0.1)',flexWrap:'wrap'}}>
        {/* KSeF buttons */}
        <button style={{...C.btn,color:'#888',fontSize:11}} title="Test połączenia z KSeF" onClick={async()=>{
          setKsefStatus({loading:true});
          const env=settings.ksef_env||'test';
          try{
            // Sprawdź dostępność API KSeF — GET /api/common/Status
            const r=await fetch(`${KSEF_PROXY}`,{
              method:'POST',
              headers:{'Content-Type':'application/json','Authorization':`Bearer ${SB_KEY}`,'apikey':SB_KEY},
              body:JSON.stringify({env,path:'/api/common/Status',method:'GET',body:{},token:null}),
            });
            const data=await r.json();
            setKsefStatus({error:`Status KSeF (${env}): HTTP ${data.status} → ${JSON.stringify(data.data).slice(0,200)}`});
          }catch(e){setKsefStatus({error:`Diagnostyka: ${e.message}`});}
        }}><i className="ti ti-stethoscope"/> Test KSeF</button>
        <button style={{...C.btn,color:'#185FA5'}} title="Pobierz plik XML FA(2) gotowy do KSeF" onClick={()=>{
          const xml=generateKSeFXML(preview,company);
          const blob=new Blob([xml],{type:'application/xml;charset=utf-8'});
          const a=document.createElement('a');
          a.href=URL.createObjectURL(blob);
          a.download=`${(preview.number||'faktura').replace(/[/\\:*?"<>|]/g,'_')}_KSeF.xml`;
          a.click();URL.revokeObjectURL(a.href);
        }}><i className="ti ti-file-type-xml"/> Pobierz XML (KSeF)</button>
        <button style={{...C.btn,color:'#3B6D11',fontWeight:500}} disabled={ksefStatus?.loading} title={`Wyślij do KSeF (${settings.ksef_env==='prod'?'produkcyjne':'testowe'})`} onClick={async()=>{
          setKsefStatus({loading:true});
          try{
            const res=await sendToKSeF(preview,[company].flat()[0],settings);
            setInvoices(p=>p.map(i=>i.id===preview.id?{...i,ksef_sent:true,ksef_ref:res.refNo,ksef_xml:res.xml}:i));
            setPreview(v=>({...v,ksef_sent:true,ksef_ref:res.refNo}));
            setKsefStatus({refNo:res.refNo});
          }catch(e){
            console.error('KSeF error:',e);
            setKsefStatus({error:e.message});
          }
        }}>{ksefStatus?.loading?<><i className="ti ti-loader-2" style={{animation:'spin 1s linear infinite'}}/> Wysyłanie...</>:<><i className="ti ti-send"/> {settings.ksef_env==='prod'?'Wyślij do KSeF':'Wyślij do KSeF (test)'}</>}</button>
        <button style={{...C.btnP,background:'#A32D2D'}} onClick={async()=>{
          const area=document.getElementById('invoice-print-area');
          if(!area)return;
          // Load html2pdf if not already loaded
          if(!window.html2pdf){
            await new Promise((res,rej)=>{
              const s=document.createElement('script');
              s.src='https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js';
              s.onload=res;s.onerror=rej;document.head.appendChild(s);
            });
          }
          const filename=`${(preview.number||'dokument').replace(/[/\\:*?"<>|]/g,'-')}.pdf`;
          window.html2pdf().set({
            margin:10,
            filename,
            image:{type:'jpeg',quality:0.98},
            html2canvas:{scale:2,useCORS:true},
            jsPDF:{unit:'mm',format:'a4',orientation:'portrait'}
          }).from(area).save();
        }}><i className="ti ti-file-type-pdf"/> Generuj PDF</button>
        <button style={C.btn} onClick={()=>setPreview(null)}>Zamknij</button>
      </div>
    </Modal>}
    {modal&&<Modal title={form.id?`Edytuj ${form.doc_type||'fakturę'}`:`Nowa ${form.doc_type==='korekta'?'faktura korygująca':form.doc_type==='nota'?'nota obciążeniowa':'faktura VAT'}`} onClose={()=>setModal(false)} wide>
      {/* Zmiana typu dokumentu — dostępna przy tworzeniu nowego dokumentu (np. ze zlecenia),
          gdy zamiast faktury trzeba wystawić notę obciążeniową. Korekta ma osobny tryb. */}
      {!form.id&&form.doc_type!=='korekta'&&<div style={{marginBottom:12,padding:'8px 10px',background:'#f5f4f0',borderRadius:8}}>
        <label style={C.lbl}>Rodzaj dokumentu</label>
        <div style={{display:'flex',gap:6,marginTop:3}}>
          <button style={{...C.btn,flex:1,background:(form.doc_type||'faktura')==='faktura'?'#185FA5':'',color:(form.doc_type||'faktura')==='faktura'?'#fff':''}} onClick={()=>{
            if((form.doc_type||'faktura')==='faktura')return;
            const _m=(form.issue_date||today()).slice(5,7),_y=(form.issue_date||today()).slice(0,4);
            const _n=invoices.filter(iv=>{const d=iv.issue_date||iv.created_at||'';return d.startsWith(`${_y}-${_m}`)&&(iv.doc_type||'faktura')==='faktura';}).length+1;
            setForm(p=>({...p,doc_type:'faktura',number:`TRANS - ${_n}/${_m}/${_y}`}));
          }}>Faktura VAT</button>
          <button style={{...C.btn,flex:1,background:form.doc_type==='nota'?'#854F0B':'',color:form.doc_type==='nota'?'#fff':''}} onClick={()=>{
            if(form.doc_type==='nota')return;
            const _t=today();const _m=_t.slice(5,7),_y=_t.slice(0,4);
            const _n=invoices.filter(iv=>{const d=iv.issue_date||iv.created_at||'';return d.startsWith(`${_y}-${_m}`)&&iv.doc_type==='nota';}).length+1;
            setForm(p=>({...p,doc_type:'nota',number:`NOB-${_n}/${_m}/${_y}`}));
            setItems(p=>p.map(it=>({...it,vat:'0'}))); // nota obciążeniowa — bez VAT
          }}>Nota obciążeniowa</button>
        </div>
      </div>}
      {/* Numer dokumentu — edytowalny */}
      <div style={{marginBottom:12,background:'#f5f4f0',borderRadius:8,padding:'10px 14px'}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:5}}>
          <label style={{...C.lbl,margin:0,fontSize:11,fontWeight:500}}>Numer dokumentu</label>
          {form.number&&invoices.find(inv=>inv.number===form.number&&inv.id!==form.id)&&
            <span style={{fontSize:10,color:'#854F0B',display:'flex',alignItems:'center',gap:3}}><i className="ti ti-alert-circle"/>Zajęty — przy zapisie zostanie automatycznie zmieniony na kolejny wolny numer</span>}
          {form.number&&!invoices.find(inv=>inv.number===form.number&&inv.id!==form.id)&&
            <span style={{fontSize:10,color:'#3B6D11',display:'flex',alignItems:'center',gap:3}}><i className="ti ti-circle-check"/>Numer dostępny</span>}
        </div>
        <input style={{...C.inp,fontFamily:'monospace',fontWeight:500,fontSize:13,background:'#fff'}} value={form.number||''} onChange={e=>setForm(p=>({...p,number:e.target.value}))} placeholder="np. TRANS - 1/05/2026"/>
        <div style={{fontSize:10,color:'#888',marginTop:4}}>Wygenerowano automatycznie — możesz edytować</div>
      </div>
      {form.doc_type==='korekta'&&<div style={{marginBottom:10,background:'#FAEEDA',border:'0.5px solid #EF9F27',borderRadius:8,padding:'10px 12px'}}>
        <div style={{fontSize:11,fontWeight:500,color:'#854F0B',marginBottom:6}}><i className="ti ti-file-minus" style={{marginRight:5}}/>Faktura korygująca — podaj nr faktury korygowanej</div>
        <div style={C.g2}>
          <div><label style={C.lbl}>Nr korygowanej faktury</label>
            <select style={C.inp} value={form.corrects_number||''} onChange={e=>{
              const val=e.target.value;
              const src=invoices.find(iv=>iv.number===val);
              if(src){
                setForm(p=>({
                  ...p,
                  corrects_number:val,
                  buyer_name:src.buyer_name||'',
                  buyer_nip:src.buyer_nip||'',
                  buyer_address:src.buyer_address||'',
                  currency:src.currency||'EUR',
                  eur_rate:src.eur_rate||'',
                  eur_rate_date:src.eur_rate_date||'',
                  sale_date:src.sale_date||p.sale_date,
                  payment_days:src.payment_days||p.payment_days,
                  payment_method:src.payment_method||p.payment_method,
                  _from_order:src._from_order,
                  before_net:src.total_net,
                  before_vat:src.total_vat,
                  before_gross:src.total_gross,
                  before_currency:src.currency,
                  before_eur_rate:src.eur_rate,
                  before_sale_date:src.sale_date,
                  before_items:(src.items||[]).map(it=>({...it})),
                  corrects_ksef_number:src.ksef_ref||null,
                }));
                setItems((src.items||[]).map(it=>({...it})));
                if(src.eur_rate)setEurOverride(src.eur_rate);
              }else{
                setForm(p=>({...p,corrects_number:val}));
              }
            }}>
              <option value="">— wybierz fakturę do korekty —</option>
              {invoices.filter(iv=>(iv.doc_type||'faktura')!=='korekta'&&iv.id!==form.id).sort((a,b)=>(b.issue_date||'').localeCompare(a.issue_date||'')).map(iv=><option key={iv.id} value={iv.number}>{iv.number} — {iv.buyer_name}</option>)}
              {form.corrects_number&&!invoices.some(iv=>iv.number===form.corrects_number)&&<option value={form.corrects_number}>{form.corrects_number} (niestandardowy)</option>}
            </select>
            <div style={{fontSize:10,color:'#888',marginTop:3}}>Wybór faktury automatycznie wczyta nabywcę, pozycje, walutę i kurs.</div>
          </div>
          <div><label style={C.lbl}>Powód korekty</label><input style={C.inp} placeholder="np. Błędna stawka frachtowa" value={form.correction_reason||''} onChange={e=>setForm(p=>({...p,correction_reason:e.target.value}))}/></div>
        </div>
        {form.before_net!==undefined&&(()=>{
          const bNet=parseFloat(form.before_net||0),bVat=parseFloat(form.before_vat||0),bGross=parseFloat(form.before_gross||0);
          const aNet=items.reduce((s,it)=>s+(parseFloat(it.qty)||0)*(parseFloat(it.price)||0),0);
          const aVat=items.reduce((s,it)=>s+(parseFloat(it.qty)||0)*(parseFloat(it.price)||0)*((parseFloat(it.vat)||0)/100),0);
          const aGross=aNet+aVat;
          const isEUR=form.before_currency==='EUR'||form.currency==='EUR';
          const bRate=parseFloat(form.before_eur_rate)||0;
          const aRate=parseFloat(eurOverride||form.eur_rate)||0;
          const effBRate=bRate>0?bRate:aRate;
          const effARate=aRate>0?aRate:bRate;
          const hasPLN=isEUR&&(effBRate>0||effARate>0);
          const fmtDiff=(d,sym)=>`${d>0?'+':''}${d.toFixed(2)} ${sym}`;
          const diffColor=d=>Math.abs(d)<0.005?'#888':d>0?'#3B6D11':'#A32D2D';
          const sym=isEUR?'€':(form.before_currency||form.currency||'PLN')==='PLN'?'zł':(form.before_currency||form.currency);
          const Row=({label,b,a,bold})=>{
            const d=a-b;
            return<>
              <tr>
                <td style={{...C.td,color:bold?undefined:'#555',fontWeight:bold?600:undefined}}>{label}{hasPLN?' (EUR)':''}</td>
                <td style={{...C.td,textAlign:'right',fontWeight:bold?600:undefined}}>{b.toFixed(2)} {sym}</td>
                <td style={{...C.td,textAlign:'right',fontWeight:bold?600:undefined}}>{a.toFixed(2)} {sym}</td>
                <td style={{...C.td,textAlign:'right',fontWeight:bold?700:600,color:diffColor(d)}}>{fmtDiff(d,sym)}</td>
              </tr>
              {hasPLN&&<tr>
                <td style={{...C.td,color:bold?undefined:'#555',fontWeight:bold?600:undefined}}>{label} (PLN)</td>
                <td style={{...C.td,textAlign:'right',fontWeight:bold?600:undefined}}>{(b*effBRate).toFixed(2)} zł</td>
                <td style={{...C.td,textAlign:'right',fontWeight:bold?600:undefined}}>{(a*effARate).toFixed(2)} zł</td>
                <td style={{...C.td,textAlign:'right',fontWeight:bold?700:600,color:diffColor((a*effARate)-(b*effBRate))}}>{fmtDiff((a*effARate)-(b*effBRate),'zł')}</td>
              </tr>}
            </>;
          };
          return<div style={{marginTop:10,borderTop:'0.5px solid #EF9F27',paddingTop:8}}>
            <div style={{fontSize:10,fontWeight:600,color:'#854F0B',marginBottom:5}}>Podgląd zmian (na podstawie aktualnych pozycji){hasPLN&&` · kurs: ${effBRate.toFixed(4)} → ${effARate.toFixed(4)}`}</div>
            <table style={{width:'100%',borderCollapse:'collapse',fontSize:11}}>
              <thead><tr>
                <th style={{...C.th,textAlign:'left'}}></th>
                <th style={{...C.th,textAlign:'right'}}>Przed</th>
                <th style={{...C.th,textAlign:'right'}}>Po</th>
                <th style={{...C.th,textAlign:'right'}}>Wartość korekty</th>
              </tr></thead>
              <tbody>
                <Row label="Netto" b={bNet} a={aNet}/>
                <Row label="VAT" b={bVat} a={aVat}/>
                <Row label="Brutto" b={bGross} a={aGross} bold/>
              </tbody>
            </table>
          </div>;
        })()}
      </div>}

const Fines=({db})=>{
  const [fines,setFines]=db.fines;const [drivers]=db.drivers;const [vehicles]=db.vehicles;
  const [modal,setModal]=useState(false);const [form,setForm]=useState({});const [fs,setFs]=useState('wszystkie');
  const [filterDriver,setFilterDriver]=useState('');
  const [filterVehicle,setFilterVehicle]=useState('');
  const [filterMonth,setFilterMonth]=useState('');
  const [filterSearch,setFilterSearch]=useState('');
  const [docPreview,setDocPreview]=useState(null);const [docLoading,setDocLoading]=useState(false);
  const [saving,setSaving]=useState(false);
  const save=async()=>{
    setSaving(true);
    const item=form.id?{...form}:{...form,id:gid(),settled:false,created_at:today()};
    const result=await(form.id?setFines(p=>p.map(x=>x.id===form.id?{...x,...item}:x)):setFines(p=>[...p,item]));
    setSaving(false);
    if(result?.synced===false){
      alert('UWAGA: Mandat zapisany TYLKO lokalnie na tym urządzeniu — nie udało się wysłać do chmury!\n\nBłąd: '+(result.error||'nieznany')+'\n\nSprawdź połączenie z internetem i otwórz ten mandat ponownie aby wymusić ponowną synchronizację (np. edytuj i zapisz jeszcze raz, gdy będzie internet).');
    }
    setModal(false);
  };
  const F=(k,l,t='text',full=false)=>(<div style={full?{gridColumn:'span 2'}:{}}><label style={C.lbl}>{l}</label>{t==='textarea'?<textarea style={{...C.inp,height:55,resize:'vertical'}} value={form[k]||''} onChange={e=>setForm(p=>({...p,[k]:e.target.value}))}/>:<input style={C.inp} type={t} value={form[k]||''} onChange={e=>setForm(p=>({...p,[k]:e.target.value}))}/>}</div>);
  const addDoc=e=>{
    setDocLoading(true);
    Array.from(e.target.files).forEach(async f=>{
      let dataUrl;
      if(f.type.startsWith('image/')){
        dataUrl=await compressImage(f);
      }else{
        dataUrl=await new Promise(res=>{const rd=new FileReader();rd.onload=ev=>res(ev.target.result);rd.onerror=()=>res(null);rd.readAsDataURL(f);});
      }
      if(!dataUrl){setDocLoading(false);return;}
      const url=await sbUploadBase64(dataUrl,f.name,'fines');
      if(url){
        setForm(p=>({...p,docs:[...(p.docs||[]),{id:gid(),name:f.name,data:url}]}));
      }else{
        setForm(p=>({...p,docs:[...(p.docs||[]),{id:gid(),name:f.name,data:dataUrl}]}));
        alert('Nie udało się wysłać pliku do chmury. Zapisano tymczasowo lokalnie — spróbuj ponownie z internetem.');
      }
      setDocLoading(false);
    });
    e.target.value='';
  };
  const months=[...new Set(fines.map(f=>(f.date||'').slice(0,7)).filter(Boolean))].sort().reverse();
  const filtered=fines.filter(f=>{
    if(fs==='rozliczone'&&!f.settled)return false;
    if(fs==='nierozliczone'&&f.settled)return false;
    if(filterDriver&&f.driver_name!==filterDriver)return false;
    if(filterVehicle&&f.vehicle_reg!==filterVehicle)return false;
    if(filterMonth&&!(f.date||'').startsWith(filterMonth))return false;
    if(filterSearch){
      const q=filterSearch.toLowerCase();
      if(!(f.driver_name||'').toLowerCase().includes(q)&&!(f.vehicle_reg||'').toLowerCase().includes(q)&&!(f.reason||'').toLowerCase().includes(q)&&!(f.fine_number||'').toLowerCase().includes(q))return false;
    }
    return true;
  }).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const totalUnpaid=fines.filter(f=>!f.settled).reduce((s,f)=>s+(parseFloat(f.amount)||0),0);
  return(<div>
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}}><h1 style={{fontSize:18,fontWeight:500,margin:0}}>Mandaty</h1><button style={C.btnP} onClick={()=>{setForm({date:today(),settled:false});setModal(true)}}><i className="ti ti-plus"/> Dodaj mandat</button></div>
    <div style={{...C.g2,marginBottom:10}}>
      <div style={{...C.stat,display:'flex',gap:10,alignItems:'center'}}><i className="ti ti-alert-octagon" style={{fontSize:20,color:'#A32D2D'}}/><div><div style={{fontSize:10,color:'#888'}}>Nierozliczone</div><div style={{fontSize:18,fontWeight:500,color:'#A32D2D'}}>{fines.filter(f=>!f.settled).length} · {totalUnpaid.toFixed(2)} PLN</div></div></div>

    </div>
    <div style={{display:'flex',gap:5,marginBottom:10}}>{['wszystkie','nierozliczone','rozliczone'].map(s=><button key={s} style={{...C.btn,...(fs===s?{background:'#f5f4f0',fontWeight:500}:{})}} onClick={()=>setFs(s)}>{s.charAt(0).toUpperCase()+s.slice(1)}</button>)}</div>
    <div style={{display:'flex',gap:8,marginBottom:12,flexWrap:'wrap'}}>

      </select>
      <select style={{...C.inp,width:150}} value={filterVehicle} onChange={e=>setFilterVehicle(e.target.value)}>
        <option value="">Wszystkie pojazdy</option>
        {[...new Set(fines.map(f=>f.vehicle_reg).filter(Boolean))].sort().map(v=><option key={v} value={v}>{v}</option>)}

      <select style={{...C.inp,width:150}} value={filterMonth} onChange={e=>setFilterMonth(e.target.value)}>
        <option value="">Wszystkie miesiące</option>
        {months.map(m=><option key={m} value={m}>{m}</option>)}
      </select>
      {(filterDriver||filterVehicle||filterMonth||filterSearch)&&<button style={C.btn} onClick={()=>{setFilterDriver('');setFilterVehicle('');setFilterMonth('');setFilterSearch('');}}><i className="ti ti-x"/> Wyczyść filtry</button>}

    <div style={C.card}><table style={{width:'100%',borderCollapse:'collapse'}}>

        <td style={C.td}>{f.country?<span style={bdg('blue')}>{f.country}</span>:'–'}</td>
        <td style={{...C.td,maxWidth:110}}><div style={{overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{f.reason}</div></td>

        <div><label style={C.lbl}>Organ</label><select style={C.inp} value={form.issuer||''} onChange={e=>setForm(p=>({...p,issuer:e.target.value}))}><option value="">Wybierz...</option>{['Policja','Straż Miejska','ITD','Służba Celna','Zagraniczny organ'].map(o=><option key={o}>{o}</option>)}</select></div>
        <div><label style={C.lbl}>Kraj</label><select style={C.inp} value={form.country||''} onChange={e=>setForm(p=>({...p,country:e.target.value}))}><option value="">Wybierz...</option>{['PL','DE','FR','BE','NL','LU','IT','AT','ES','CZ','SL'].map(c=><option key={c}>{c}</option>)}</select></div>

        <div style={{gridColumn:'span 2',display:'flex',alignItems:'center',gap:7}}><input type="checkbox" id="fsc" checked={form.settled||false} onChange={e=>setForm(p=>({...p,settled:e.target.checked,settled_date:e.target.checked?today():null}))} style={{width:14,height:14,cursor:'pointer'}}/><label htmlFor="fsc" style={{fontSize:12,cursor:'pointer'}}>Kierowca rozliczony z mandatu{form.settled&&form.settled_date&&<span style={{fontSize:10,color:'#888',marginLeft:6}}>{form.settled_date}</span>}</label></div>
        <div style={{gridColumn:'span 2',display:'flex',alignItems:'center',gap:7}}><input type="checkbox" id="fvd" checked={form.visible_to_driver!==false} onChange={e=>setForm(p=>({...p,visible_to_driver:e.target.checked}))} style={{width:14,height:14,cursor:'pointer'}}/><label htmlFor="fvd" style={{fontSize:12,cursor:'pointer'}}>Widoczny dla kierowcy w portalu (przez link wyjazdu)</label></div>
        <div style={{gridColumn:'span 2',borderTop:'0.5px solid rgba(0,0,0,0.08)',paddingTop:10}}>
          <div style={C.secT}>Dokumenty (zdjęcia, PDF)</div>
          <div style={{display:'flex',gap:7,marginBottom:8}}>
            <label style={{...C.btn,cursor:'pointer',position:'relative',overflow:'hidden'}}>{docLoading?<><i className="ti ti-loader-2" style={{animation:'spin 1s linear infinite'}}/> Wczytywanie...</>:<><i className="ti ti-upload"/> Wgraj</>}<input type="file" multiple accept="image/*,.pdf,application/pdf" onChange={addDoc} style={{position:'absolute',inset:0,opacity:0,cursor:'pointer'}} disabled={docLoading}/></label>
            <label style={{...C.btn,cursor:'pointer',position:'relative',overflow:'hidden'}}><i className="ti ti-camera"/> Zdjęcie<input type="file" accept="image/*" capture="environment" onChange={addDoc} style={{position:'absolute',inset:0,opacity:0,cursor:'pointer'}} disabled={docLoading}/></label>
          </div>
          {(form.docs||[]).length>0&&<div style={{display:'flex',flexDirection:'column',gap:5}}>
            {form.docs.map(d=><div key={d.id} style={{display:'flex',gap:7,alignItems:'center',background:'#f5f4f0',borderRadius:7,padding:'5px 9px',fontSize:11}}>
              <i className={d.data?.startsWith('data:image')?'ti ti-photo':'ti ti-file-type-pdf'} style={{color:'#185FA5'}}/>
              <span style={{flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{d.name}</span>
              <button style={{...C.btn,padding:'2px 5px',color:'#185FA5'}} onClick={()=>setDocPreview(d)}><i className="ti ti-eye"/></button>
              <button style={{...C.btn,padding:'2px 5px'}} onClick={()=>setForm(p=>({...p,docs:p.docs.filter(x=>x.id!==d.id)}))}><i className="ti ti-trash"/></button>
            </div>)}
          </div>}
          {!(form.docs||[]).length&&<div style={{fontSize:11,color:'#aaa'}}>Brak dokumentów.</div>}
        </div>
      </div>
      <div style={{display:'flex',gap:6,justifyContent:'flex-end',marginTop:12,position:'sticky',bottom:0,background:'#fff',paddingTop:10,paddingBottom:6,borderTop:'0.5px solid rgba(0,0,0,0.08)'}}><button style={C.btn} onClick={()=>setModal(false)}>Anuluj</button><button style={C.btnP} onClick={save} disabled={saving}>{saving?<><i className="ti ti-loader-2" style={{animation:'spin 1s linear infinite'}}/> Zapisywanie...</>:'Zapisz'}</button></div>
    </Modal>}
    {docPreview&&<div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.7)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:10001}} onClick={()=>setDocPreview(null)}>
      <div style={{background:'#fff',borderRadius:14,padding:14,maxWidth:760,width:'95%',maxHeight:'90vh',display:'flex',flexDirection:'column'}} onClick={e=>e.stopPropagation()}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>

      </div>
    </div>}
  </div>);
};

// TRIPS


const TACHO_RULES={
  maxDriveDay:9*60,maxDriveDayExtended:10*60,maxDriveWeek:56*60,maxDriveTwoWeeks:90*60,
  minBreakAfter:270,minBreak:45,minDailyRest:11*60,minDailyRestReduced:9*60,minWeeklyRest:45*60,
};
const toMin=t=>{if(!t)return 0;const[h,m]=(t||'').split(':').map(Number);return(h||0)*60+(m||0);};
const fromMin=m=>{if(m===null||m===undefined)return'–';const abs=Math.abs(m);return`${m<0?'-':''}${String(Math.floor(abs/60)).padStart(2,'0')}:${String(abs%60).padStart(2,'0')}`;};
const addMinToTime=(t,min)=>{const base=toMin(t)+min;return fromMin(((base%1440)+1440)%1440);};
const getWeekNum=d=>{const dt=new Date(d);const jan1=new Date(dt.getFullYear(),0,1);const week=Math.ceil(((dt-jan1)/86400000+jan1.getDay()+1)/7);return`${dt.getFullYear()}-W${String(week).padStart(2,'0')}`;};
const TachoScreen=({entries,setEntries,trip,onClose,onSave})=>{
  const emptyDay=()=>({id:gid(),date:'',start:'09:00',end:'18:00',drive_hours:0,breaks:[{id:gid(),st:'12:00',hours:9}]});
  const [days,setDays]=useState(()=>{
    if(entries&&entries.length>0)return entries.map(d=>({breaks:[{id:gid(),st:'12:00',hours:9}],...d,drive_hours:typeof d.drive_hours==='number'?d.drive_hours:(d.drive_hours||[]).length,breaks:(d.breaks&&d.breaks.length>0)?d.breaks:[{id:gid(),st:'12:00',hours:9}]}));
    return[{...emptyDay(),date:trip.start_date||today()}];
  });
  const [rests,setRests]=useState(()=>trip.weekly_rests||[]);
  const [restForm,setRestForm]=useState(null);
  const upDay=(i,k,v)=>setDays(p=>{
    const updated=p.map((d,j)=>j===i?{...d,[k]:v}:d);
    // After updating breaks, recalculate blocked days and next day start
    const day=updated[i];
    const br0=day.breaks&&day.breaks[0];
    if(br0&&br0.hours>=24&&day.date){
      const e=calcBreakEnd(day.date,br0.st,br0.hours);
      // Block all days fully covered by the break
      return updated.map((d,j)=>{
        if(j===i)return d;
        if(!d.date)return d;
        // Day fully within break — mark as rest day (drive_hours=0)
        if(d.date>day.date&&d.date<e.date){
          return{...d,drive_hours:0,_restDay:true};
        }
        // First day after break ends — set start time to break end time
        if(d.date===e.date){
          return{...d,start:e.time,_restDay:false};
        }
        return{...d,_restDay:false};
      });
    }
    return updated;
  });
  const addDay=()=>{const last=days[days.length-1]?.date||today();const nd=new Date(last);nd.setDate(nd.getDate()+1);setDays(p=>[...p,{...emptyDay(),date:nd.toISOString().slice(0,10)}]);};
  const delDay=i=>days.length>1&&setDays(p=>p.filter((_,j)=>j!==i));
  const adjTime=(i,f,delta)=>setDays(p=>p.map((d,j)=>j!==i?d:{...d,[f]:fromMin(((toMin(d[f]||'09:00')+delta)+1440)%1440)}));
  const calcBreakEnd=(date,st,h)=>{const ms=new Date((date||today())+'T'+(st||'12:00')).getTime()+h*3600000;const e=new Date(ms);return{date:e.toISOString().slice(0,10),time:String(e.getHours()).padStart(2,'0')+':'+String(e.getMinutes()).padStart(2,'0')};};
  const calcStats=d=>{
    const s=toMin(d.start||'09:00'),e=toMin(d.end||'18:00');
    const totalMin=e>s?e-s:e+1440-s;
    const driveMin=Math.round((Number(d.drive_hours)||0)*60);
    const violations=[];
    if(driveMin>600)violations.push({type:'danger',msg:`>10h jazdy`});
    else if(driveMin>540)violations.push({type:'warning',msg:`>9h jazdy`});
    return{totalMin,driveMin,violations};
  };
  const getPeriods=()=>{
    if(!days.length)return[];
    const sd=[...days].filter(d=>d.date).sort((a,b)=>a.date.localeCompare(b.date));
    const first=sd[0]?.date||today();
    const ar=[...rests];
    sd.forEach(d=>(d.breaks||[]).filter(b=>b.hours>=24).forEach(b=>{const e=calcBreakEnd(d.date,b.st,b.hours);ar.push({id:b.id,start_date:d.date,start_time:b.st||'12:00',hours:b.hours,end_date:e.date,end_time:e.time});}));
    const sr=ar.sort((a,b)=>(a.start_date+' '+(a.start_time||'')).localeCompare(b.start_date+' '+(b.start_time||'')));
    const ps=[];let cur=first;
    sr.forEach((r,idx)=>{const pd=sd.filter(d=>d.date>=cur&&d.date<=r.start_date);ps.push({idx:idx+1,from:cur,to:r.start_date,days:pd,totalH:pd.reduce((s,d)=>s+Number(d.drive_hours||0),0),rest:r});cur=r.end_date||r.start_date;});
    const ld=sd.filter(d=>d.date>=cur);ps.push({idx:ps.length+1,from:cur,to:null,days:ld,totalH:ld.reduce((s,d)=>s+Number(d.drive_hours||0),0),rest:null});
    return ps;
  };
  const WeeklySummary=()=>{
    const periods=getPeriods();if(!periods.length)return null;
    const cur=periods[periods.length-1],prev=periods.length>1?periods[periods.length-2]:null;
    const curH=cur.totalH,prevH=prev?.totalH??null,twoH=(prevH||0)+curH;
    const max56=prevH!==null?Math.min(56,90-prevH):56;
    const rem90=prevH!==null?Math.max(0,90-twoH):null;
    const over56=curH>56,over90=prevH!==null&&twoH>90;

    // Count short breaks (< 24h) per period
    const countShortBreaks=(period)=>{let c=0;period.days.forEach(d=>(d.breaks||[]).forEach(b=>{if(b.hours>0&&b.hours<11)c++;}));return c;};
    // Count 10h drive days per period
    const countLongDrive=(period)=>period.days.filter(d=>Number(d.drive_hours||0)>=10).length;
    const countExtended15=(period)=>period.days.filter(d=>!!d.extended15).length;
    const curShort=countShortBreaks(cur);
    const prevShort=prev?countShortBreaks(prev):0;
    const shortOverCur=curShort>3;
    const curLong=countLongDrive(cur);
    const prevLong=prev?countLongDrive(prev):0;
    const longOverCur=curLong>2;
    const curExt=countExtended15(cur);
    const prevExt=prev?countExtended15(prev):0;
    const extOverCur=curExt>3;

    const Bar=({val,max,col})=><div style={{height:5,background:'#ddd',borderRadius:2,overflow:'hidden',marginTop:2}}><div style={{height:'100%',width:`${Math.min(100,val/max*100)}%`,background:col,borderRadius:2}}/></div>;
    return<div style={{fontSize:11}}>
      <div style={{fontWeight:700,color:'#888',fontSize:9,letterSpacing:'0.06em',marginBottom:8}}>PODSUMOWANIE</div>

      {/* Current period */}
      <div style={{background:'#fff',borderRadius:7,padding:'7px 9px',marginBottom:7,border:(over56||over90||shortOverCur||longOverCur||extOverCur)?'1.5px solid #A32D2D':'none'}}>
        <div style={{fontSize:9,color:'#888'}}>Bieżący okres #{cur.idx} ({cur.from}{cur.to?' → '+cur.to:''})</div>
        <div style={{fontSize:20,fontWeight:700,color:over56?'#A32D2D':'#185FA5',lineHeight:1.1}}>{curH.toFixed(1)}<span style={{fontSize:10,fontWeight:400}}>h</span></div>
        <div style={{fontSize:9,color:'#888',marginBottom:2}}>/ 56h maks. w okresie</div>
        <Bar val={curH} max={56} col={over56?'#A32D2D':curH>45?'#EF9F27':'#3B6D11'}/>
        <div style={{fontSize:9,marginTop:3,color:over56?'#A32D2D':'#3B6D11',fontWeight:600}}>
          {over56?`+${(curH-56).toFixed(1)}h ponad limit 56h`:`Pozostało do 56h: ${(max56-curH).toFixed(1)}h`}
        </div>
        {rem90!==null&&<div style={{fontSize:9,marginTop:2,color:over90?'#A32D2D':'#854F0B',fontWeight:600}}>
          {over90?`+${(twoH-90).toFixed(1)}h ponad limit 90h`:`Pozostało do 90h (2 okresy): ${rem90.toFixed(1)}h`}
        </div>}
        {/* Short break counter */}
        <div style={{marginTop:6,paddingTop:5,borderTop:'0.5px solid #e8e8e8'}}>
          <div style={{fontSize:9,color:'#888',marginBottom:3}}>Skrócone przerwy (maks. 3/okres)</div>
          <div style={{display:'flex',gap:4,alignItems:'center'}}>
            {[1,2,3].map(n=><div key={n} style={{width:22,height:22,borderRadius:4,display:'flex',alignItems:'center',justifyContent:'center',fontSize:10,fontWeight:700,
              background:curShort>=n?(shortOverCur?'#A32D2D':'#185FA5'):'#e8e8e8',
              color:curShort>=n?'#fff':'#ccc'}}>{n}</div>)}
            {curShort>3&&<span style={{fontSize:9,color:'#A32D2D',fontWeight:700}}>+{curShort-3} ponad limit!</span>}
            {curShort===0&&<span style={{fontSize:9,color:'#aaa'}}>Brak skróconych</span>}
            {curShort>0&&curShort<=3&&<span style={{fontSize:9,color:'#888'}}>użyte: {curShort}/3</span>}
          </div>
        </div>
        {/* 10h drive counter */}
        <div style={{marginTop:5,paddingTop:5,borderTop:'0.5px solid #e8e8e8'}}>
          <div style={{fontSize:9,color:'#888',marginBottom:3}}>Jazda 10h (maks. 2/okres)</div>
          <div style={{display:'flex',gap:4,alignItems:'center'}}>
            {[1,2].map(n=><div key={n} style={{width:22,height:22,borderRadius:4,display:'flex',alignItems:'center',justifyContent:'center',fontSize:10,fontWeight:700,
              background:curLong>=n?(longOverCur?'#A32D2D':'#854F0B'):'#e8e8e8',
              color:curLong>=n?'#fff':'#ccc'}}>{n}</div>)}
            {curLong>2&&<span style={{fontSize:9,color:'#A32D2D',fontWeight:700}}>+{curLong-2} ponad limit!</span>}
            {curLong===0&&<span style={{fontSize:9,color:'#aaa'}}>Brak dni 10h</span>}
            {curLong>0&&curLong<=2&&<span style={{fontSize:9,color:'#888'}}>użyte: {curLong}/2</span>}
          </div>
        </div>
        {/* 15h extended work counter */}
        <div style={{marginTop:5,paddingTop:5,borderTop:'0.5px solid #e8e8e8'}}>
          <div style={{fontSize:9,color:'#888',marginBottom:3}}>Wydłużony czas pracy 15h (maks. 3/okres)</div>
          <div style={{display:'flex',gap:4,alignItems:'center'}}>
            {[1,2,3].map(n=><div key={n} style={{width:22,height:22,borderRadius:4,display:'flex',alignItems:'center',justifyContent:'center',fontSize:10,fontWeight:700,
              background:curExt>=n?(extOverCur?'#A32D2D':'#6B2FA0'):'#e8e8e8',
              color:curExt>=n?'#fff':'#ccc'}}>{n}</div>)}
            {curExt>3&&<span style={{fontSize:9,color:'#A32D2D',fontWeight:700}}>+{curExt-3} ponad limit!</span>}
            {curExt===0&&<span style={{fontSize:9,color:'#aaa'}}>Brak 15h</span>}
            {curExt>0&&curExt<=3&&<span style={{fontSize:9,color:'#888'}}>użyte: {curExt}/3</span>}
          </div>
        </div>
      </div>

      {/* Previous period */}
      {prev&&<div style={{background:'#fff',borderRadius:7,padding:'7px 9px',marginBottom:7}}>
        <div style={{fontSize:9,color:'#888'}}>Poprzedni okres #{prev.idx} ({prev.from} → {prev.to})</div>
        <div style={{fontSize:20,fontWeight:700,color:(prevH||0)>56?'#A32D2D':'#555',lineHeight:1.1}}>{(prevH||0).toFixed(1)}<span style={{fontSize:10,fontWeight:400}}>h</span></div>
        <Bar val={prevH||0} max={56} col={(prevH||0)>56?'#A32D2D':(prevH||0)>45?'#EF9F27':'#3B6D11'}/>
        <div style={{fontSize:9,color:'#888',marginTop:3}}>Skrócone przerwy: <b style={{color:prevShort>3?'#A32D2D':'#1a1a18'}}>{prevShort}/3</b> · Jazda 10h: <b style={{color:prevLong>2?'#A32D2D':'#1a1a18'}}>{prevLong}/2</b> · 15h: <b style={{color:prevExt>3?'#A32D2D':'#1a1a18'}}>{prevExt}/3</b></div>
        {prev.rest&&<div style={{fontSize:9,color:'#3B6D11',marginTop:2}}>Pauza: {prev.rest.hours}h ({prev.rest.end_date} {prev.rest.end_time})</div>}
      </div>}
      {prev&&max56<56&&!over56&&<div style={{background:'#FAEEDA',borderRadius:7,padding:'5px 8px',fontSize:9,color:'#854F0B',marginBottom:7}}>Max w bieżącym: <b>{max56.toFixed(1)}h</b></div>}
      {getPeriods().map((p,i)=><div key={i} style={{background:'#fff',borderRadius:7,padding:'7px 9px',marginBottom:7}}>
        <div style={{fontSize:9,color:'#888',fontWeight:700,marginBottom:4}}>OKRESY</div>
        <div style={{display:'flex',justifyContent:'space-between',fontSize:9,marginBottom:2}}>
          <span style={{color:'#888'}}>#{p.idx} {p.from}{p.to?' → '+p.to:''}</span>
          <b style={{color:p.totalH>56?'#A32D2D':p.totalH>45?'#854F0B':'#3B6D11'}}>{p.totalH.toFixed(1)}h</b>
        </div>
      </div>)}
      {/* Short weekly rests */}
      {(()=>{
        const allRests=[...rests];
        days.forEach(d=>(d.breaks||[]).filter(b=>b.hours>=24).forEach(b=>{const e=calcBreakEnd(d.date,b.st,b.hours);allRests.push({hours:b.hours,start_date:d.date,end_date:e.date});}));
        const shortRests=allRests.filter(r=>r.hours>=24&&r.hours<45);
        if(!shortRests.length)return null;
        return<div style={{background:'#FAEEDA',borderRadius:7,padding:'7px 9px'}}>
          <div style={{fontSize:9,color:'#854F0B',fontWeight:700,marginBottom:4}}>SKRÓCONE PAUZY TYGODNIOWE</div>
          {shortRests.map((r,i)=><div key={i} style={{fontSize:9,color:'#854F0B',marginBottom:3,display:'flex',justifyContent:'space-between'}}>
            <span>{r.start_date}: {r.hours}h</span>

    {photoPreview&&<div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.7)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:10001}} onClick={()=>setPhotoPreview(null)}>

        {(()=>{

          const pairedManualByCsvId={};

          const kierowcaRowsFromManual=manualRows.map(r=>{

            return matchedCsv?{...r,_effLiters:matchedCsv.liters,_effGross:matchedCsv.total_gross,_effCurrency:matchedCsv.currency}:{...r,_effLiters:r.liters,_effGross:r.total_gross,_effCurrency:r.currency};

          const FULL_TANK=105;
          // Kafelek "Wpisane od kierowcy" pokazuje TĘ SAMĄ liczbę, którą widzi kierowca w swoim

          const kierowcaConsumption=(()=>{
            const csvVisible=fuelRecords.filter(r=>r.trip_id===form.id&&r.visible_to_driver);
            const matchedCsvIds=new Set((fuels||[]).filter(f=>f.verified&&f.verified_csv_id).map(f=>f.verified_csv_id));
            const csvVisibleDeduped=csvVisible.filter(r=>!matchedCsvIds.has(r.id));
            const combined=[
              ...(fuels||[]).map(f=>({...f,_source:'manual'})),
              ...csvVisibleDeduped.map(r=>({id:r.id,date:r.date,liters:r.liters,fuel_type:r.fuel_type,mileage:r.mileage||null,_source:'csv',deleted:r.deleted})),
            ];
            const sumL=combined.filter(f=>!f.deleted&&classifyProduct(f.fuel_type)==='paliwo').reduce((s,f)=>s+(parseFloat(f.liters)||0),0);

            const last=[...paliwoEntries].sort((a,b)=>(a.date||'').localeCompare(b.date||''))[paliwoEntries.length-1];
            const lastMileage=last?parseFloat(last.mileage)||null:null;
            const dist=(lastMileage!==null&&mStart!==null)?lastMileage-mStart:null;
            const fuelStart=parseFloat(form.fuel_start)||0;
            const consumed=fuelStart+sumL-FULL_TANK;
            return(dist&&dist>0)?consumed/dist*100:null;
          })();

            // Dla kafelka "kierowca" sumujemy wartości EFEKTYWNE (poprawione z Autoryzacji jeśli

            const l=tab==='kierowca'?rows.reduce((s,r)=>s+(parseFloat(r._effLiters??r.liters)||0),0):rows.reduce((s,r)=>s+(parseFloat(r.liters)||0),0);
            const c=tab==='kierowca'?rows.reduce((s,r)=>s+(parseFloat(r._effGross??r.total_gross)||0),0):rows.reduce((s,r)=>s+(parseFloat(r.total_gross||r.total_cost)||0),0);
            const cons=tab==='kierowca'?kierowcaConsumption:(distance&&distance>0&&l>0)?l/distance*100:null;
            return{l,c,cons};

            const sumC=rows.reduce((s,r)=>s+toEUR(isKierowcaTab?(r._effGross??r.total_gross):(r.total_gross||r.total_cost),rowCcy(r)),0);

                  <tbody>
                    {rows.map((r,i)=>{
                      const matchedCsv=(r._manual&&r._raw?.verified&&r._raw?.verified_csv_id)?importedRows.find(x=>x.id===r._raw.verified_csv_id):null;
                      const isChecked=r._pairedManual||(r._manual&&r._raw?.verified)||r._adopted;
                      const diffCell=(driverVal,csvVal,fmt=v=>v)=>{
                        if(!matchedCsv||csvVal===undefined||csvVal===null||csvVal==='')return fmt(driverVal);
                        const same=String(driverVal||'')===String(csvVal||'');
                        if(same)return fmt(driverVal);
                        return<>
                          <span style={{textDecoration:'line-through',color:'#A32D2D'}}>{fmt(driverVal)}</span>
                          <div style={{color:'#3B6D11',fontWeight:600}}>{fmt(csvVal)}</div>
                        </>;
                      };
                      return(
                      <tr key={r.id} style={{background:r.is_duplicate?'#FFF6D8':isChecked?'#EAF3DE':(i%2===0?'#fff':'#f0f6fc'),borderBottom:'0.5px solid rgba(0,0,0,0.05)'}}>
                        <td style={C.td}>

                        <td style={C.td}>{r.city||'–'}</td>

                        <td style={C.td}>

                    <tr style={{background:'#f5f4f0',fontWeight:600,borderTop:'1.5px solid rgba(0,0,0,0.12)'}}>

                      <td style={C.td}></td>
                      <td style={C.td}></td>
                      <td style={C.td}></td>
                      <td style={C.td}></td>
                      <td style={C.td}></td>
                      <td style={C.td}>{sumL.toFixed(2)}</td>
                      <td style={C.td}></td>

                      <td style={C.td}></td>
                      <td style={C.td}>{sumV.toFixed(2)} €</td>
                      <td style={C.td}></td>
                      <td style={C.td}></td>
                      <td style={C.td}></td>
                      <td style={C.td}></td>
                      <td style={C.td}></td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>;
          };
          return<>
            {/* Kafelki wyboru źródła — na samej górze. Każdy ma własne, w pełni niezależne
                podsumowanie: litry, koszt i średnie spalanie liczone tylko z litrów tego źródła
                (na tym samym dystansie wyjazdu — stan licznika poniżej jest wspólny dla auta). */}
            <div style={{display:'flex',gap:12,marginBottom:16,flexWrap:'wrap'}}>
              {[['kierowca','Wpisane od kierowcy',kierowcaRows,'ti-user'],['autoryzacje','Z autoryzacji',autoryzacjeRows,'ti-file-invoice'],['koszty_dkv','Z kosztów całkowitych',kosztyDkvRows,'ti-report-money']].map(([v,l,rws,icon])=>{
                const s=tabSummary(rws,v);
                return<button key={v} onClick={()=>setFuelSourceTab(v)} style={{
                  display:'flex',alignItems:'center',gap:12,padding:'14px 20px',borderRadius:14,cursor:'pointer',minWidth:220,flex:1,
                  border:fuelSourceTab===v?'2px solid #185FA5':'1px solid rgba(0,0,0,0.1)',
